<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0f0f0f"><title>Messenger</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;transition:all .3s}:root{--bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#252525;--text:#fff;--text2:#888;--accent:#00d4ff;--accent2:#00ff88;--danger:#ff4444;--border:#333}.theme-light{--bg:#f5f5f5;--bg2:#fff;--bg3:#e8e8e8;--text:#000;--text2:#666;--border:#ddd}.theme-neon{--bg:#0a0015;--bg2:#150028;--bg3:#250040;--text:#fff;--text2:#b088ff;--accent:#ff00ff;--accent2:#00ffff;--border:#4400aa}#loginScreen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:100;transition:opacity .5s}#loginScreen h1{font-size:32px;margin-bottom:10px;background:linear-gradient(45deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:900}#loginScreen .subtitle{color:var(--text2);margin-bottom:30px;font-size:14px}.input-group{width:100%;max-width:320px;margin-bottom:15px;position:relative}.input-group input{width:100%;padding:15px 20px;font-size:16px;border:2px solid var(--border);border-radius:15px;background:var(--bg2);color:var(--text);outline:none;transition:all .3s}.input-group input:focus{border-color:var(--accent);box-shadow:0 0 20px var(--accent)33}.input-group .hint{position:absolute;right:15px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text2)}.btn-primary{width:100%;max-width:320px;padding:15px;font-size:16px;font-weight:bold;background:linear-gradient(45deg,var(--accent),var(--accent2));color:#000;border:none;border-radius:15px;cursor:pointer;transition:all .2s;margin-top:10px}.btn-primary:active{transform:scale(.95)}.btn-primary:disabled{opacity:.5;cursor:not-allowed}.error-msg{color:var(--danger);margin-top:10px;font-size:14px;min-height:20px;text-align:center}.saved-notice{background:var(--accent)22;color:var(--accent);padding:10px 20px;border-radius:10px;margin-bottom:15px;font-size:13px}#app{display:none;height:100vh;flex-direction:row}#sidebar{width:320px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}#sidebarHeader{padding:15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}#sidebarHeader h2{font-size:20px;color:var(--accent)}#sidebarHeader .icons{display:flex;gap:8px}#sidebarHeader .icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--bg3);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}#sidebarHeader .icon-btn:active{transform:scale(.9)}#searchBox{padding:10px 15px;border-bottom:1px solid var(--border)}#searchBox input{width:100%;padding:10px 15px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);color:var(--text);outline:none;font-size:14px}#searchBox input:focus{border-color:var(--accent)}#chatList{flex:1;overflow-y:auto}#chatList::-webkit-scrollbar{width:4px}#chatList::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}.chat-item{display:flex;align-items:center;gap:12px;padding:12px 15px;cursor:pointer;transition:background .2s;border-bottom:1px solid var(--border)11}.chat-item:hover{background:var(--bg3)}.chat-item.active{background:var(--accent)22;border-left:3px solid var(--accent)}.chat-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;color:#fff;flex-shrink:0}.chat-info{flex:1;min-width:0}.chat-name{font-size:15px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-last{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}.chat-time{font-size:11px;color:var(--text2)}.chat-badge{background:var(--accent);color:#000;font-size:11px;font-weight:bold;padding:2px 6px;border-radius:10px;min-width:18px;text-align:center}#chatArea{flex:1;display:flex;flex-direction:column;min-width:0}#chatHeader{background:var(--bg2);padding:12px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}#backBtn{display:none;width:36px;height:36px;border-radius:50%;border:none;background:var(--bg3);color:var(--text);font-size:18px;cursor:pointer}#chatHeader .avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;color:#fff}#chatHeader .info{flex:1}#chatHeader .name{font-size:16px;font-weight:600}#chatHeader .status{font-size:12px;color:var(--text2)}#chatHeader .actions{display:flex;gap:8px}#messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}#messages::-webkit-scrollbar{width:4px}#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}.message{max-width:75%;padding:10px 14px;border-radius:18px;word-wrap:break-word;animation:msgIn .3s;position:relative}.message.mine{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;border-bottom-right-radius:5px}.message.other{align-self:flex-start;background:var(--bg3);border-bottom-left-radius:5px}.message .head{display:flex;align-items:center;gap:6px;margin-bottom:4px}.message .avatar-sm{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;color:#fff;flex-shrink:0}.message .uname{font-size:12px;font-weight:bold;opacity:.8}.message .time{font-size:10px;opacity:.5;margin-top:4px;text-align:right}.message .text{font-size:15px;line-height:1.4}.message .img{max-width:100%;border-radius:10px;margin-top:5px;cursor:pointer}.message .actions{position:absolute;top:-8px;right:-8px;display:none;gap:4px}.message:hover .actions{display:flex}.message .act-btn{width:24px;height:24px;border-radius:50%;border:none;background:var(--danger);color:#fff;font-size:12px;cursor:pointer}.system{align-self:center;background:var(--bg3);padding:6px 12px;border-radius:12px;font-size:11px;color:var(--text2);margin:5px 0}.typing-indicator{align-self:flex-start;background:var(--bg3);padding:8px 14px;border-radius:15px;font-size:12px;color:var(--text2);font-style:italic;animation:pulse 1.5s infinite}#inputArea{background:var(--bg2);padding:10px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;position:relative}#inputArea input{flex:1;padding:12px 18px;font-size:15px;border:2px solid var(--border);border-radius:25px;background:var(--bg3);color:var(--text);outline:none}#inputArea input:focus{border-color:var(--accent)}#inputArea .btn{width:42px;height:42px;border-radius:50%;border:none;background:var(--accent);color:#000;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}#inputArea .btn:active{transform:scale(.9)}#inputArea .btn.img-btn{background:var(--bg3);color:var(--text)}#emojiPanel{position:absolute;bottom:60px;left:10px;right:10px;background:var(--bg2);border:1px solid var(--border);border-radius:15px;padding:10px;display:none;max-height:200px;overflow-y:auto;z-index:50}#emojiPanel.show{display:block}#emojiPanel .emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}#emojiPanel .emoji{font-size:24px;padding:5px;text-align:center;cursor:pointer;border-radius:8px}#emojiPanel .emoji:active{background:var(--bg3)}#themePanel{position:fixed;top:60px;right:10px;background:var(--bg2);border:1px solid var(--border);border-radius:15px;padding:10px;display:none;z-index:60;min-width:150px}#themePanel.show{display:block}#themePanel .theme-btn{width:100%;padding:10px;margin:3px 0;border:none;border-radius:8px;cursor:pointer;font-weight:bold;color:#fff}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:90;padding:20px}.modal.show{display:flex}.modal-content{background:var(--bg2);border-radius:20px;padding:20px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto}.modal-content h3{margin-bottom:15px;color:var(--accent)}.modal-content .close{float:right;background:none;border:none;color:var(--text);font-size:24px;cursor:pointer}#imageModal img{max-width:100%;border-radius:10px;margin-top:10px}#emptyState{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text2);text-align:center;padding:20px}#emptyState .icon{font-size:64px;margin-bottom:20px;opacity:.5}#emptyState h3{font-size:20px;margin-bottom:10px}@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}@media(max-width:768px){#sidebar{width:100%;position:absolute;inset:0;z-index:10}#chatArea{width:100%}#sidebar.hidden{display:none}#chatArea.hidden{display:none}#backBtn{display:flex}}@media(max-width:480px){.message{max-width:90%}}</style></head><body><div id="loginScreen"><h1>💬 Messenger</h1><p class="subtitle">Общайся с друзьями</p><div id="savedNotice" class="saved-notice" style="display:none"></div><div class="input-group"><input type="text" id="usernameInput" placeholder="Придумай ник (3-20 символов)" maxlength="20" autocomplete="off"><span class="hint">a-z 0-9 _</span></div><button class="btn-primary" id="loginBtn" onclick="doLogin()">🚀 Войти</button><div class="error-msg" id="loginError"></div></div><div id="app"><div id="sidebar"><div id="sidebarHeader"><h2>💬 Чаты</h2><div class="icons"><button class="icon-btn" onclick="toggleThemes()"></button><button class="icon-btn" onclick="toggleFullscreen()">⛶</button></div></div><div id="searchBox"><input type="text" id="searchInput" placeholder="🔍 Поиск чатов..." oninput="filterChats()"></div><div id="chatList"></div></div><div id="chatArea"><div id="emptyState"><div class="icon"></div><h3>Выбери чат</h3><p>Выбери чат из списка слева, чтобы начать общение</p></div></div></div><div id="themePanel"><button class="theme-btn" style="background:#0f0f0f" onclick="setTheme('')">🌙 Тёмная</button><button class="theme-btn" style="background:#f5f5f5;color:#000" onclick="setTheme('theme-light')">️ Светлая</button><button class="theme-btn" style="background:linear-gradient(45deg,#ff00ff,#00ffff)" onclick="setTheme('theme-neon')">✨ Неон</button></div><div class="modal" id="imageModal" onclick="this.classList.remove('show')"><div class="modal-content" onclick="event.stopPropagation()"><button class="close" onclick="document.getElementById('imageModal').classList.remove('show')">✕</button><h3>Картинка</h3><img id="modalImg" src=""></div></div><script>
let ws=null,myUsername=null,myAvatar=null,chats=[],activeChat=null,typingUsers=new Set();
const $=id=>document.getElementById(id);
const savedUser=localStorage.getItem('messenger_user');
if(savedUser){$('usernameInput').value=savedUser;$('savedNotice').style.display='block';$('savedNotice').textContent='✓ Привет, '+savedUser+'!'}
const EMOJIS=['😀','😂','🥰','😎','','😴','😡','','👎','❤️','','🎉','💯','✨','','💬','👋','','💪','🎵','','🌟','⭐','🌈','☀️','🌙','❄️','🎯','🏆','💎','🍕','🍔','☕','','🌺','🌻','','🐱','🐻','','🦁','🐸','','🏔️','🎨','🎭','🎬','📹','📞','📌','✅','','⚠️','🚫','','💭','💋','','🎤','🎧','','📝','🔒','','🎁','✈️','','🎮','🎲',''];
EMOJIS.forEach(e=>{const d=document.createElement('div');d.className='emoji';d.textContent=e;d.onclick=()=>{const inp=document.querySelector('#inputArea input');if(inp){inp.value+=e;inp.focus()}};$('emojiGrid').appendChild(d)});
function doLogin(){const name=$('usernameInput').value.trim();if(!name){$('loginError').textContent='Введи ник!';return}if(!/^[a-zA-Z0-9_]{3,20}$/.test(name)){$('loginError').textContent='Ник: 3-20 символов (a-z, 0-9, _)';return}$('loginBtn').disabled=true;$('loginError').textContent='Проверка ника...';connectAndLogin(name)}
async function connectAndLogin(name){const url=(location.protocol==='https:'?'wss:':'ws:')+'//'+location.host;try{const checkWs=new WebSocket(url);await new Promise((res,rej)=>{checkWs.onopen=()=>{checkWs.send(JSON.stringify({type:'check_username',username:name}))};checkWs.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='username_ok')res();else{rej(new Error(m.msg))}checkWs.close()};checkWs.onerror=()=>rej(new Error('Ошибка соединения'));setTimeout(()=>rej(new Error('Таймаут')),5000)});localStorage.setItem('messenger_user',name);myUsername=name;startChat()}catch(e){$('loginError').textContent=e.message;$('loginBtn').disabled=false}}
function startChat(){$('loginScreen').style.opacity='0';setTimeout(()=>$('loginScreen').style.display='none',500);$('app').style.display='flex';connect()}
function connect(){const url=(location.protocol==='https:'?'wss:':'ws:')+'//'+location.host;ws=new WebSocket(url);ws.onopen=()=>{ws.send(JSON.stringify({type:'login',username:myUsername}))};ws.onmessage=e=>{try{const m=JSON.parse(e.data);handleMsg(m)}catch(e){}};ws.onclose=()=>setTimeout(connect,3000);ws.onerror=()=>{}}
function handleMsg(m){if(m.type==='welcome'){myAvatar=m.avatar;chats=m.chats||[];renderChatList();if(chats.length>0)openChat('general')}else if(m.type==='message'){const chat=chats.find(c=>c.id==='general');if(chat){chat.lastMessage={text:m.message.text||'[картинка]',time:m.message.time,username:m.message.username}}renderChatList();if(activeChat==='general')addMsgToChat(m.message)}else if(m.type==='user_joined'){renderChatList()}else if(m.type==='user_left'){renderChatList()}else if(m.type==='chats_update'){chats=m.chats||[];renderChatList()}else if(m.type==='private_message'){const from=m.message.from,to=m.message.to;const other=from===myUsername?to:from;const chat=chats.find(c=>c.id===other);if(chat){chat.lastMessage={text:m.message.text,time:m.message.time,username:from}}renderChatList();if(activeChat===other)addDMMsg(m.message)}else if(m.type==='private_history'){renderDMHistory(m.messages)}else if(m.type==='typing'){if(activeChat){typingUsers.add(m.username);showTyping()}}else if(m.type==='stop_typing'){typingUsers.delete(m.username);hideTyping()}else if(m.type==='message_deleted'){const el=document.querySelector('[data-id="'+m.id+'"]');if(el)el.remove()}else if(m.type==='error'){alert(m.msg)}}
function renderChatList(){const q=($('searchInput').value||'').toLowerCase();const list=$('chatList');list.innerHTML='';chats.filter(c=>c.name.toLowerCase().includes(q)).forEach(c=>{const item=document.createElement('div');item.className='chat-item'+(activeChat===c.id?' active':'');const time=c.lastMessage?new Date(c.lastMessage.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'';const lastText=c.lastMessage?(c.lastMessage.username!==myUsername&&c.id!=='general'?c.lastMessage.username+': ':'')+c.lastMessage.text:'Нет сообщений':'';item.innerHTML='<div class="chat-avatar" style="background:'+c.avatar+'">'+c.name[0].toUpperCase()+'</div><div class="chat-info"><div class="chat-name">'+esc(c.name)+'</div><div class="chat-last">'+esc(lastText)+'</div></div><div class="chat-meta"><div class="chat-time">'+time+'</div></div>';item.onclick=()=>openChat(c.id);list.appendChild(item)})}
function openChat(id){activeChat=id;const chat=chats.find(c=>c.id===id);if(!chat)return;$('chatArea').innerHTML='<div id="chatHeader"><button id="backBtn" onclick="backToList()">←</button><div class="avatar" style="background:'+chat.avatar+'">'+chat.name[0].toUpperCase()+'</div><div class="info"><div class="name">'+esc(chat.name)+'</div><div class="status" id="chatStatus">онлайн</div></div><div class="actions"><button class="icon-btn" onclick="toggleEmojiInChat()">😊</button></div></div><div id="messages"></div><div id="inputArea"><input type="text" id="chatInput" placeholder="Сообщение..." maxlength="1000"><button class="btn img-btn" onclick="document.getElementById(\'fileInput\').click()">📷</button><button class="btn" onclick="sendMessage()">➤</button><input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImage(event)"><div id="emojiPanel"><div class="emoji-grid" id="emojiGrid"></div></div></div>';EMOJIS.forEach(e=>{const d=document.createElement('div');d.className='emoji';d.textContent=e;d.onclick=()=>{const inp=$('chatInput');if(inp){inp.value+=e;inp.focus()}};$('emojiGrid').appendChild(d)});if(window.innerWidth<=768){$('sidebar').classList.add('hidden');$('chatArea').classList.remove('hidden')}if(id==='general'){$('chatStatus').textContent=chats.length-1+' онлайн';loadGeneralMessages()}else{$('chatStatus').textContent='онлайн';ws.send(JSON.stringify({type:'get_private_history',withUser:id}))}setupInputHandlers()}
function backToList(){$('sidebar').classList.remove('hidden');$('chatArea').classList.add('hidden');activeChat=null;renderChatList()}
function loadGeneralMessages(){$('messages').innerHTML='';const msgs=JSON.parse(sessionStorage.getItem('general_msgs')||'[]');msgs.forEach(addMsgToChat)}
function addMsgToChat(m){const msgsDiv=$('messages');if(!msgsDiv)return;const d=document.createElement('div');d.className='message '+(m.username===myUsername?'mine':'other');d.dataset.id=m.id;const time=new Date(m.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});let content='';if(m.image)content='<img class="img" src="'+m.image+'" onclick="showImage(this.src)">';else content='<div class="text">'+esc(m.text)+'</div>';d.innerHTML=(m.username!==myUsername?'<div class="head"><div class="avatar-sm" style="background:'+m.avatar+'">'+m.username[0].toUpperCase()+'</div><div class="uname">'+esc(m.username)+'</div></div>':'')+content+'<div class="time">'+time+'</div>'+(m.username===myUsername&&Date.now()-m.time<300000?'<div class="actions"><button class="act-btn" onclick="deleteMsg('+m.id+')">✕</button></div>':'');msgsDiv.appendChild(d);msgsDiv.scrollTop=msgsDiv.scrollHeight;const msgs=JSON.parse(sessionStorage.getItem('general_msgs')||'[]');msgs.push(m);sessionStorage.setItem('general_msgs',JSON.stringify(msgs.slice(-100)))}
function addDMMsg(m){const msgsDiv=$('messages');if(!msgsDiv)return;const d=document.createElement('div');d.className='message '+(m.from===myUsername?'mine':'other');const time=new Date(m.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});d.innerHTML=(m.from!==myUsername?'<div class="head"><div class="avatar-sm" style="background:'+m.avatar+'">'+m.from[0].toUpperCase()+'</div><div class="uname">'+esc(m.from)+'</div></div>':'')+'<div class="text">'+esc(m.text)+'</div><div class="time">'+time+'</div>';msgsDiv.appendChild(d);msgsDiv.scrollTop=msgsDiv.scrollHeight}
function renderDMHistory(msgs){const msgsDiv=$('messages');if(!msgsDiv)return;msgsDiv.innerHTML='';msgs.forEach(addDMMsg)}
function sendMessage(){const inp=$('chatInput');if(!inp)return;const t=inp.value.trim();if(!t||!ws)return;if(activeChat==='general'){ws.send(JSON.stringify({type:'message',text:t}))}else{ws.send(JSON.stringify({type:'private_message',to:activeChat,text:t}))}inp.value='';if(ws)ws.send(JSON.stringify({type:'typing'}))}
function deleteMsg(id){if(!ws)return;ws.send(JSON.stringify({type:'delete_message',id:id}))}
function toggleEmojiInChat(){$('emojiPanel').classList.toggle('show')}
function toggleThemes(){$('themePanel').classList.toggle('show')}
function setTheme(t){document.body.className=t;localStorage.setItem('theme',t);$('themePanel').classList.remove('show')}
const savedTheme=localStorage.getItem('theme');if(savedTheme)document.body.className=savedTheme;
function filterChats(){renderChatList()}
function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen()}
function handleImage(e){const f=e.target.files[0];if(!f)return;if(f.size>250000){alert('Максимум 250KB');return}const r=new FileReader();r.onload=()=>{if(ws&&activeChat==='general')ws.send(JSON.stringify({type:'image',data:r.result}))};r.readAsDataURL(f);e.target.value=''}
function showImage(src){$('modalImg').src=src;$('imageModal').classList.add('show')}
function setupInputHandlers(){const inp=$('chatInput');if(inp){inp.addEventListener('keypress',e=>{if(e.key==='Enter')sendMessage()});inp.addEventListener('input',()=>{if(ws)ws.send(JSON.stringify({type:'typing'}))})}}
function showTyping(){const el=document.getElementById('typingEl');if(el)el.remove();if(typingUsers.size>0){const d=document.createElement('div');d.id='typingEl';d.className='typing-indicator';d.textContent=[...typingUsers].join(', ')+' печатает...';$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}}
function hideTyping(){const el=document.getElementById('typingEl');if(el)el.remove()}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
document.addEventListener('click',e=>{if(!e.target.closest('#emojiPanel')&&!e.target.closest('.img-btn')){const ep=$('emojiPanel');if(ep)ep.classList.remove('show')}if(!e.target.closest('#themePanel')&&!e.target.closest('[onclick*="toggleThemes"]'))$('themePanel').classList.remove('show')});
</script></body></html>
