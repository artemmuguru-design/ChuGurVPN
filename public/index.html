<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0f0f0f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Messenger</title><link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiTWVzc2VuZ2VyIiwic2hvcnRfbmFtZSI6Ik1lc3NlbmdlciIsInN0YXJ0X3VybCI6Ii4iLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjMGYwZjBmIiwidGhlbWVfY29sb3IiOiIjMDBkNGZmIn0="><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;transition:all .3s}:root{--bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#252525;--text:#fff;--text2:#888;--accent:#00d4ff;--accent2:#00ff88;--danger:#ff4444;--border:#333}.theme-light{--bg:#f5f5f5;--bg2:#fff;--bg3:#e8e8e8;--text:#000;--text2:#666;--border:#ddd}.theme-neon{--bg:#0a0015;--bg2:#150028;--bg3:#250040;--text:#fff;--text2:#b088ff;--accent:#ff00ff;--accent2:#00ffff;--border:#4400aa}#loginScreen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:100;transition:opacity .5s}#loginScreen h1{font-size:32px;margin-bottom:10px;background:linear-gradient(45deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:900}#loginScreen .subtitle{color:var(--text2);margin-bottom:30px;font-size:14px}.input-group{width:100%;max-width:320px;margin-bottom:15px;position:relative}.input-group input{width:100%;padding:15px 20px;font-size:16px;border:2px solid var(--border);border-radius:15px;background:var(--bg2);color:var(--text);outline:none;transition:all .3s}.input-group input:focus{border-color:var(--accent);box-shadow:0 0 20px var(--accent)33}.input-group .hint{position:absolute;right:15px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text2)}.btn-primary{width:100%;max-width:320px;padding:15px;font-size:16px;font-weight:bold;background:linear-gradient(45deg,var(--accent),var(--accent2));color:#000;border:none;border-radius:15px;cursor:pointer;transition:all .2s;margin-top:10px}.btn-primary:active{transform:scale(.95)}.btn-primary:disabled{opacity:.5;cursor:not-allowed}.error-msg{color:var(--danger);margin-top:10px;font-size:14px;min-height:20px;text-align:center}.saved-notice{background:var(--accent)22;color:var(--accent);padding:10px 20px;border-radius:10px;margin-bottom:15px;font-size:13px}#chatScreen{display:none;flex-direction:column;height:100vh}#header{background:var(--bg2);padding:12px 15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}#header .left{display:flex;align-items:center;gap:10px}#header h2{font-size:18px;color:var(--accent)}#header .right{display:flex;gap:8px;align-items:center}#header .icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--bg3);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}#header .icon-btn:active{transform:scale(.9)}#usersBar{background:var(--bg2);padding:8px 15px;border-bottom:1px solid var(--border);display:flex;gap:8px;overflow-x:auto;font-size:12px}#usersBar::-webkit-scrollbar{display:none}.user-chip{display:flex;align-items:center;gap:5px;padding:5px 10px;background:var(--bg3);border-radius:15px;white-space:nowrap;cursor:pointer;flex-shrink:0}.user-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2)}#messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}#messages::-webkit-scrollbar{width:4px}#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}.message{max-width:85%;padding:10px 14px;border-radius:18px;word-wrap:break-word;animation:msgIn .3s;position:relative}.message.mine{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;border-bottom-right-radius:5px}.message.other{align-self:flex-start;background:var(--bg3);border-bottom-left-radius:5px}.message .head{display:flex;align-items:center;gap:6px;margin-bottom:4px}.message .avatar{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;color:#fff;flex-shrink:0}.message .uname{font-size:12px;font-weight:bold;opacity:.8}.message .time{font-size:10px;opacity:.5;margin-top:4px;text-align:right}.message .text{font-size:15px;line-height:1.4}.message .img{max-width:100%;border-radius:10px;margin-top:5px;cursor:pointer}.message .actions{position:absolute;top:-8px;right:-8px;display:none;gap:4px}.message:hover .actions,.message:active .actions{display:flex}.message .act-btn{width:24px;height:24px;border-radius:50%;border:none;background:var(--danger);color:#fff;font-size:12px;cursor:pointer}.system{align-self:center;background:var(--bg3);padding:6px 12px;border-radius:12px;font-size:11px;color:var(--text2);margin:5px 0}.typing-indicator{align-self:flex-start;background:var(--bg3);padding:8px 14px;border-radius:15px;font-size:12px;color:var(--text2);font-style:italic;animation:pulse 1.5s infinite}#inputArea{background:var(--bg2);padding:10px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}#inputArea input{flex:1;padding:12px 18px;font-size:15px;border:2px solid var(--border);border-radius:25px;background:var(--bg3);color:var(--text);outline:none}#inputArea input:focus{border-color:var(--accent)}#inputArea .btn{width:42px;height:42px;border-radius:50%;border:none;background:var(--accent);color:#000;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}#inputArea .btn:active{transform:scale(.9)}#inputArea .btn.img-btn{background:var(--bg3);color:var(--text)}#emojiPanel{position:absolute;bottom:70px;left:10px;right:10px;background:var(--bg2);border:1px solid var(--border);border-radius:15px;padding:10px;display:none;max-height:200px;overflow-y:auto;z-index:50}#emojiPanel.show{display:block}#emojiPanel .emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}#emojiPanel .emoji{font-size:24px;padding:5px;text-align:center;cursor:pointer;border-radius:8px}#emojiPanel .emoji:active{background:var(--bg3)}#themePanel{position:fixed;top:60px;right:10px;background:var(--bg2);border:1px solid var(--border);border-radius:15px;padding:10px;display:none;z-index:60;min-width:150px}#themePanel.show{display:block}#themePanel .theme-btn{width:100%;padding:10px;margin:3px 0;border:none;border-radius:8px;cursor:pointer;font-weight:bold;color:#fff}#searchBar{position:fixed;top:0;left:0;right:0;background:var(--bg2);padding:10px;border-bottom:1px solid var(--border);display:none;z-index:70}#searchBar.show{display:flex;gap:8px}#searchBar input{flex:1;padding:10px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);color:var(--text);outline:none}#searchBar button{padding:10px 15px;border:none;border-radius:20px;background:var(--accent);color:#000;font-weight:bold}#dmPanel{position:fixed;inset:0;background:var(--bg);z-index:80;display:none;flex-direction:column}#dmPanel.show{display:flex}#dmPanel header{background:var(--bg2);padding:15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}#dmPanel header .back{width:36px;height:36px;border-radius:50%;border:none;background:var(--bg3);color:var(--text);font-size:18px;cursor:pointer}#dmPanel .dm-messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px}#dmPanel .dm-input{background:var(--bg2);padding:10px;border-top:1px solid var(--border);display:flex;gap:8px}#dmPanel .dm-input input{flex:1;padding:12px;border-radius:25px;border:1px solid var(--border);background:var(--bg3);color:var(--text);outline:none}#dmPanel .dm-input button{padding:12px 20px;border:none;border-radius:25px;background:var(--accent);color:#000;font-weight:bold}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:90;padding:20px}.modal.show{display:flex}.modal-content{background:var(--bg2);border-radius:20px;padding:20px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto}.modal-content h3{margin-bottom:15px;color:var(--accent)}.modal-content .close{float:right;background:none;border:none;color:var(--text);font-size:24px;cursor:pointer}#imageModal img{max-width:100%;border-radius:10px;margin-top:10px}@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}@media(max-width:480px){.message{max-width:90%}}</style></head><body><div id="loginScreen"><h1>💬 Messenger</h1><p class="subtitle">Общайся с друзьями</p><div id="savedNotice" class="saved-notice" style="display:none"></div><div class="input-group"><input type="text" id="usernameInput" placeholder="Придумай ник (3-20 символов)" maxlength="20" autocomplete="off"><span class="hint">a-z 0-9 _</span></div><button class="btn-primary" id="loginBtn" onclick="doLogin()"> Войти</button><div class="error-msg" id="loginError"></div></div><div id="chatScreen"><div id="header"><div class="left"><h2>💬 Чат</h2></div><div class="right"><button class="icon-btn" onclick="toggleSearch()">🔍</button><button class="icon-btn" onclick="toggleThemes()">🎨</button><button class="icon-btn" onclick="toggleFullscreen()"></button></div></div><div id="usersBar"></div><div id="messages"></div><div id="inputArea" style="position:relative"><input type="text" id="messageInput" placeholder="Сообщение..." maxlength="1000"><button class="btn img-btn" onclick="document.getElementById('fileInput').click()">📷</button><button class="btn" onclick="toggleEmoji()">😊</button><button class="btn" onclick="sendMessage()">➤</button><input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImage(event)"><div id="emojiPanel"><div class="emoji-grid" id="emojiGrid"></div></div></div></div><div id="searchBar"><input type="text" id="searchInput" placeholder="Поиск..." oninput="doSearch()"><button onclick="toggleSearch()"></button></div><div id="themePanel"><button class="theme-btn" style="background:#0f0f0f" onclick="setTheme('')">🌙 Тёмная</button><button class="theme-btn" style="background:#f5f5f5;color:#000" onclick="setTheme('theme-light')">☀️ Светлая</button><button class="theme-btn" style="background:linear-gradient(45deg,#ff00ff,#00ffff)" onclick="setTheme('theme-neon')">✨ Неон</button></div><div id="dmPanel"><header><button class="back" onclick="closeDM()">←</button><h3 id="dmTitle">Личка</h3></header><div class="dm-messages" id="dmMessages"></div><div class="dm-input"><input type="text" id="dmInput" placeholder="Сообщение..." maxlength="1000" onkeypress="if(event.key==='Enter')sendDM()"><button onclick="sendDM()"></button></div></div><div class="modal" id="imageModal" onclick="this.classList.remove('show')"><div class="modal-content" onclick="event.stopPropagation()"><button class="close" onclick="document.getElementById('imageModal').classList.remove('show')">✕</button><h3>Картинка</h3><img id="modalImg" src=""></div></div><script>
let ws=null,myUsername=null,myAvatar=null,users=[],messages=[],typingUsers=new Set(),currentDM=null,searchQuery='';
const $=id=>document.getElementById(id);
const savedUser=localStorage.getItem('messenger_user');
if(savedUser){$('usernameInput').value=savedUser;$('savedNotice').style.display='block';$('savedNotice').textContent='✓ Привет, '+savedUser+'!'}
const EMOJIS=['😀','😂','🥰','😎','🤔','','😡','👍','','❤️','🔥','🎉','💯','✨','🚀','💬','👋','','💪','🎮','','📱','💻','','⭐','🌈','️','🌙','⚡','','🎯','🏆','','🎂','🍕','🍔','☕','','🌺','🌸','','🐶','🐱','','🐻','🐼','🦁','🐸','','🌍','🌊','🏔️','🌆','🎨','🎭','','🎬','📷','📹','📞','','🔔','📌','✅','❌','⚠️','','💤','👀','','🤝','💋','','🎶','🎤','🎧','📚','️','📝','','🔒','🔓','','💳','🎁','','🚗','✈️','','⚽','','🎮','🎲','','🎳'];
EMOJIS.forEach(e=>{const d=document.createElement('div');d.className='emoji';d.textContent=e;d.onclick=()=>{const inp=$('messageInput');inp.value+=e;inp.focus()};$('emojiGrid').appendChild(d)});
function doLogin(){const name=$('usernameInput').value.trim();if(!name){$('loginError').textContent='Введи ник!';return}if(!/^[a-zA-Z0-9_]{3,20}$/.test(name)){$('loginError').textContent='Ник: 3-20 символов (a-z, 0-9, _)';return}$('loginBtn').disabled=true;$('loginError').textContent='Проверка ника...';connectAndLogin(name)}
async function connectAndLogin(name){const url=(location.protocol==='https:'?'wss:':'ws:')+'//'+location.host;try{const checkWs=new WebSocket(url);await new Promise((res,rej)=>{checkWs.onopen=()=>{checkWs.send(JSON.stringify({type:'check_username',username:name}))};checkWs.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='username_ok')res();else{rej(new Error(m.msg))}checkWs.close()};checkWs.onerror=()=>rej(new Error('Ошибка соединения'));setTimeout(()=>rej(new Error('Таймаут')),5000)});localStorage.setItem('messenger_user',name);myUsername=name;startChat()}catch(e){$('loginError').textContent=e.message;$('loginBtn').disabled=false}}
function startChat(){$('loginScreen').style.opacity='0';setTimeout(()=>$('loginScreen').style.display='none',500);$('chatScreen').style.display='flex';connect()}
function connect(){const url=(location.protocol==='https:'?'wss:':'ws:')+'//'+location.host;ws=new WebSocket(url);ws.onopen=()=>{ws.send(JSON.stringify({type:'login',username:myUsername}))};ws.onmessage=e=>{try{const m=JSON.parse(e.data);handleMsg(m)}catch(e){}};ws.onclose=()=>setTimeout(connect,3000);ws.onerror=()=>{}}
function handleMsg(m){if(m.type==='welcome'){myAvatar=m.avatar;users=m.users||[];messages=m.messages||[];renderUsers();messages.forEach(addMsg);scrollDown()}else if(m.type==='message'){if(!messages.find(x=>x.id===m.message.id)){messages.push(m.message);addMsg(m.message);scrollDown();notify(m.message)}}else if(m.type==='user_joined'){users=m.users||[];renderUsers();if(m.username!==myUsername)addSystem(m.username+' зашёл')}else if(m.type==='user_left'){users=m.users||[];renderUsers();addSystem(m.username+' вышел')}else if(m.type==='typing'){if(m.username!==myUsername){typingUsers.add(m.username);renderTyping()}}else if(m.type==='stop_typing'){typingUsers.delete(m.username);renderTyping()}else if(m.type==='message_deleted'){const el=document.querySelector('[data-id="'+m.id+'"]');if(el)el.remove()}else if(m.type==='private_message'){if(currentDM===m.message.from||currentDM===m.message.to){addDMMsg(m.message)}else{notify(m.message,true)}}else if(m.type==='private_history'){renderDMHistory(m.messages)}else if(m.type==='error'){$('loginError').textContent=m.msg}}
function addMsg(m){const d=document.createElement('div');d.className='message '+(m.username===myUsername?'mine':'other');d.dataset.id=m.id;const time=new Date(m.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});let content='';if(m.image)content='<img class="img" src="'+m.image+'" onclick="showImage(this.src)">';else content='<div class="text">'+esc(m.text)+'</div>';d.innerHTML='<div class="head"><div class="avatar" style="background:'+m.avatar+'">'+m.username[0].toUpperCase()+'</div><div class="uname">'+esc(m.username)+'</div></div>'+content+'<div class="time">'+time+'</div>'+(m.username===myUsername&&Date.now()-m.time<300000?'<div class="actions"><button class="act-btn" onclick="deleteMsg('+m.id+')">✕</button></div>':'');$('messages').appendChild(d)}
function addSystem(t){const d=document.createElement('div');d.className='system';d.textContent=t;$('messages').appendChild(d);scrollDown()}
function renderTyping(){const el=document.getElementById('typingEl');if(el)el.remove();if(typingUsers.size>0){const d=document.createElement('div');d.id='typingEl';d.className='typing-indicator';d.textContent=[...typingUsers].join(', ')+' печатает...';$('messages').appendChild(d);scrollDown()}}
function renderUsers(){$('usersBar').innerHTML=users.map(u=>'<div class="user-chip" onclick="openDM(\''+u+'\')"><div class="dot"></div>'+esc(u)+'</div>').join('')}
function sendMessage(){const t=$('messageInput').value.trim();if(!t||!ws)return;ws.send(JSON.stringify({type:'message',text:t}));$('messageInput').value='';ws.send(JSON.stringify({type:'typing'}))}
function deleteMsg(id){if(!ws)return;ws.send(JSON.stringify({type:'delete_message',id:id}))}
function toggleEmoji(){$('emojiPanel').classList.toggle('show')}
function toggleThemes(){$('themePanel').classList.toggle('show')}
function setTheme(t){document.body.className=t;localStorage.setItem('theme',t);$('themePanel').classList.remove('show')}
const savedTheme=localStorage.getItem('theme');if(savedTheme)document.body.className=savedTheme;
function toggleSearch(){$('searchBar').classList.toggle('show');if($('searchBar').classList.contains('show'))$('searchInput').focus();else{$('searchInput').value='';doSearch()}}
function doSearch(){const q=$('searchInput').value.toLowerCase();searchQuery=q;document.querySelectorAll('.message').forEach(el=>{const txt=el.textContent.toLowerCase();el.style.display=q&&!txt.includes(q)?'none':''})}
function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen()}
function handleImage(e){const f=e.target.files[0];if(!f)return;if(f.size>250000){alert('Максимум 250KB');return}const r=new FileReader();r.onload=()=>{if(ws)ws.send(JSON.stringify({type:'image',data:r.result}))};r.readAsDataURL(f);e.target.value=''}
function showImage(src){$('modalImg').src=src;$('imageModal').classList.add('show')}
function openDM(u){if(u===myUsername)return;currentDM=u;$('dmTitle').textContent='💬 '+u;$('dmPanel').classList.add('show');$('dmMessages').innerHTML='';if(ws)ws.send(JSON.stringify({type:'get_private_history',with:u}))}
function closeDM(){currentDM=null;$('dmPanel').classList.remove('show')}
function sendDM(){const t=$('dmInput').value.trim();if(!t||!ws||!currentDM)return;ws.send(JSON.stringify({type:'private_message',to:currentDM,text:t}));$('dmInput').value=''}
function addDMMsg(m){const d=document.createElement('div');d.className='message '+(m.from===myUsername?'mine':'other');const time=new Date(m.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});d.innerHTML=(m.from!==myUsername?'<div class="head"><div class="avatar" style="background:'+m.avatar+'">'+m.from[0].toUpperCase()+'</div><div class="uname">'+esc(m.from)+'</div></div>':'')+'<div class="text">'+esc(m.text)+'</div><div class="time">'+time+'</div>';$('dmMessages').appendChild(d);$('dmMessages').scrollTop=$('dmMessages').scrollHeight}
function renderDMHistory(msgs){$('dmMessages').innerHTML='';msgs.forEach(addDMMsg);$('dmMessages').scrollTop=$('dmMessages').scrollHeight}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function scrollDown(){$('messages').scrollTop=$('messages').scrollHeight}
function notify(m,isDM=false){if(document.hidden&&'Notification' in window&&Notification.permission==='granted'){new Notification((isDM?'💬 '+m.from+': ':'')+m.text.substring(0,50))}else if('vibrate' in navigator){navigator.vibrate(100)}}
if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
$('messageInput').addEventListener('input',()=>{if(ws)ws.send(JSON.stringify({type:'typing'}))});
$('messageInput').addEventListener('keypress',e=>{if(e.key==='Enter')sendMessage()});
$('usernameInput').addEventListener('keypress',e=>{if(e.key==='Enter')doLogin()});
document.addEventListener('click',e=>{if(!e.target.closest('#emojiPanel')&&!e.target.closest('.img-btn'))$('emojiPanel').classList.remove('show');if(!e.target.closest('#themePanel')&&!e.target.closest('[onclick*="toggleThemes"]'))$('themePanel').classList.remove('show')});
</script></body></html>
