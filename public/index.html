<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Мессенджер</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f0f;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#loginScreen{position:fixed;inset:0;background:#0f0f0f;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:100}
#loginScreen h1{font-size:28px;margin-bottom:30px;color:#00d4ff}
#loginScreen input{width:100%;max-width:300px;padding:15px;font-size:16px;border:2px solid #333;border-radius:10px;background:#1a1a1a;color:#fff;margin-bottom:20px;outline:none}
#loginScreen input:focus{border-color:#00d4ff}
#loginScreen button{padding:15px 40px;font-size:16px;font-weight:bold;background:#00d4ff;color:#000;border:none;border-radius:10px;cursor:pointer}
#loginScreen button:active{transform:scale(0.95)}
#loginScreen .error{color:#ff4444;margin-top:10px;font-size:14px}
#chatScreen{display:none;flex-direction:column;height:100vh}
#header{background:#1a1a1a;padding:15px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
#header h2{font-size:18px;color:#00d4ff}
#connectionStatus{font-size:12px;padding:4px 10px;border-radius:10px}
#connectionStatus.online{background:#00d4ff33;color:#00d4ff}
#connectionStatus.offline{background:#ff444433;color:#ff4444}
#users{font-size:12px;color:#888;margin-top:5px}
#messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.message{max-width:80%;padding:10px 15px;border-radius:15px;word-wrap:break-word}
.message.mine{align-self:flex-end;background:#00d4ff;color:#000;border-bottom-right-radius:5px}
.message.other{align-self:flex-start;background:#2a2a2a;border-bottom-left-radius:5px}
.message .username{font-size:12px;font-weight:bold;margin-bottom:3px;opacity:0.7}
.message .time{font-size:10px;opacity:0.5;margin-top:5px;text-align:right}
#inputArea{background:#1a1a1a;padding:15px;border-top:1px solid #333;display:flex;gap:10px}
#inputArea input{flex:1;padding:12px;font-size:16px;border:2px solid #333;border-radius:25px;background:#0f0f0f;color:#fff;outline:none}
#inputArea input:focus{border-color:#00d4ff}
#inputArea button{padding:12px 20px;font-size:16px;background:#00d4ff;color:#000;border:none;border-radius:25px;cursor:pointer;font-weight:bold}
#inputArea button:active{transform:scale(0.95)}
#inputArea button:disabled{background:#555;cursor:not-allowed}
.system{align-self:center;background:#2a2a2a;padding:8px 15px;border-radius:15px;font-size:12px;color:#888;margin:5px 0}
#sendLog{position:fixed;top:60px;right:10px;background:#00d4ff;color:#000;padding:5px 10px;border-radius:10px;font-size:12px;font-weight:bold;opacity:0;transition:opacity .3s;z-index:100;pointer-events:none}
#sendLog.show{opacity:1}
</style>
</head>
<body>

<div id="loginScreen">
<h1>💬 Мессенджер</h1>
<input type="text" id="usernameInput" placeholder="Твоё имя" maxlength="20">
<button onclick="enterFullscreen()">🚀 Начать общение</button>
<div id="loginError" class="error"></div>
</div>

<div id="chatScreen">
<div id="header">
<div>
<h2>💬 Чат</h2>
<div id="users">0 онлайн</div>
</div>
<div id="connectionStatus" class="offline">● Оффлайн</div>
</div>
<div id="messages"></div>
<div id="inputArea">
<input type="text" id="messageInput" placeholder="Сообщение..." maxlength="500" disabled>
<button id="sendBtn" onclick="sendMessage()" disabled>➤</button>
</div>
</div>

<div id="sendLog">✓ Отправлено</div>

<script>
let ws=null;
let myUsername=null;
let isFullscreen=false;
let isConnected=false;
let messageQueue=[];

const loginScreen=document.getElementById('loginScreen');
const chatScreen=document.getElementById('chatScreen');
const usernameInput=document.getElementById('usernameInput');
const messageInput=document.getElementById('messageInput');
const messagesDiv=document.getElementById('messages');
const usersDiv=document.getElementById('users');
const sendBtn=document.getElementById('sendBtn');
const connectionStatus=document.getElementById('connectionStatus');
const loginError=document.getElementById('loginError');
const sendLog=document.getElementById('sendLog');

async function enterFullscreen(){
const username=usernameInput.value.trim();
if(!username){
loginError.textContent='Введи имя!';
return;
}
loginError.textContent='';
myUsername=username;

try{
const elem=document.documentElement;
if(elem.requestFullscreen)await elem.requestFullscreen();
else if(elem.webkitRequestFullscreen)await elem.webkitRequestFullscreen();
isFullscreen=true;
}catch(err){
console.log('Fullscreen не поддерживается');
}

loginScreen.style.display='none';
chatScreen.style.display='flex';
connect();
}

function connect(){
const url=(location.protocol==='https:'?'wss:':'ws:')+'//'+location.host;
console.log('Подключение к:',url);
connectionStatus.textContent='● Подключение...';
connectionStatus.className='offline';

ws=new WebSocket(url);

ws.onopen=()=>{
console.log('WebSocket открыт');
isConnected=true;
connectionStatus.textContent='● Онлайн';
connectionStatus.className='online';
messageInput.disabled=false;
sendBtn.disabled=false;

// Отправляем логин
const loginMsg=JSON.stringify({type:'login',username:myUsername});
console.log('Отправляю login:',loginMsg);
ws.send(loginMsg);

// Отправляем сообщения из очереди
while(messageQueue.length>0){
const msg=messageQueue.shift();
ws.send(JSON.stringify({type:'message',text:msg}));
}
};

ws.onmessage=(e)=>{
try{
const msg=JSON.parse(e.data);
console.log('Получено:',msg);

if(msg.type==='history'){
msg.messages.forEach(m=>addMessage(m));
}else if(msg.type==='message'){
addMessage(msg.message);
}else if(msg.type==='user_joined'){
usersDiv.textContent=msg.users.length+' онлайн';
if(msg.username!==myUsername){
addSystemMessage(msg.username+' зашёл в чат');
}
}else if(msg.type==='user_left'){
usersDiv.textContent=msg.users.length+' онлайн';
addSystemMessage(msg.username+' вышел из чата');
}
}catch(err){
console.error('Parse error:',err);
}
};

ws.onclose=()=>{
console.log('WebSocket закрыт');
isConnected=false;
connectionStatus.textContent='● Оффлайн';
connectionStatus.className='offline';
messageInput.disabled=true;
sendBtn.disabled=true;
setTimeout(connect,3000);
};

ws.onerror=(err)=>{
console.error('WS error:',err);
connectionStatus.textContent='● Ошибка';
};
}

function sendMessage(){
const text=messageInput.value.trim();
if(!text)return;

console.log('Попытка отправить:',text);
console.log('isConnected:',isConnected);
console.log('ws state:',ws?ws.readyState:'null');

if(!ws||ws.readyState!==WebSocket.OPEN){
console.log('Соединение не готово, добавляю в очередь');
messageQueue.push(text);
showSendLog('⏳ В очереди...');
return;
}

try{
const msg=JSON.stringify({type:'message',text:text});
console.log('Отправляю:',msg);
ws.send(msg);
messageInput.value='';
showSendLog('✓ Отправлено');
}catch(err){
console.error('Ошибка отправки:',err);
showSendLog(' Ошибка');
}
}

function showSendLog(text){
sendLog.textContent=text;
sendLog.classList.add('show');
setTimeout(()=>sendLog.classList.remove('show'),1500);
}

function addMessage(msg){
const div=document.createElement('div');
div.className='message '+(msg.username===myUsername?'mine':'other');
div.innerHTML=`
${msg.username!==myUsername?'<div class="username">'+escapeHtml(msg.username)+'</div>':''}
<div>${escapeHtml(msg.text)}</div>
<div class="time">${msg.time}</div>
`;
messagesDiv.appendChild(div);
messagesDiv.scrollTop=messagesDiv.scrollHeight;
}

function addSystemMessage(text){
const div=document.createElement('div');
div.className='system';
div.textContent=text;
messagesDiv.appendChild(div);
messagesDiv.scrollTop=messagesDiv.scrollHeight;
}

function escapeHtml(text){
const div=document.createElement('div');
div.textContent=text;
return div.innerHTML;
}

messageInput.addEventListener('keypress',(e)=>{
if(e.key==='Enter')sendMessage();
});

usernameInput.addEventListener('keypress',(e)=>{
if(e.key==='Enter')enterFullscreen();
});

// Для отладки - показать состояние в консоли
window.checkWS=()=>{
console.log('ws:',ws);
console.log('readyState:',ws?ws.readyState:'null');
console.log('isConnected:',isConnected);
console.log('queue:',messageQueue);
};
</script>
</body>
</html>
