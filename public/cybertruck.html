<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<title>Tesla Cybertruck — 3D модель</title>
<style>
  :root{--bg:#0a0b0d;--fg:#e9ecf0;--mut:#8b93a0;--line:rgba(255,255,255,.12);--glass:rgba(18,20,24,.62)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}
  header{position:fixed;left:28px;top:24px;pointer-events:none}
  h1{font-weight:600;letter-spacing:.42em;font-size:clamp(18px,2.6vw,30px)}
  header p{margin-top:8px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
  .hint{position:fixed;right:24px;top:26px;font-size:12px;color:var(--mut);text-align:right;
    pointer-events:none;line-height:1.7}
  .dock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:10px;flex-wrap:wrap;
    justify-content:center;max-width:calc(100vw - 24px);padding:10px;border-radius:18px;
    background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .grp{display:flex;gap:6px;align-items:center;padding:0 6px;flex-wrap:wrap;justify-content:center}
  .grp+.grp{border-left:1px solid var(--line);padding-left:12px}
  button{font:inherit;color:var(--fg);background:rgba(255,255,255,.06);border:1px solid transparent;
    border-radius:11px;padding:8px 12px;font-size:13px;cursor:pointer;transition:background .18s,border-color .18s}
  button:hover{background:rgba(255,255,255,.12)}
  button.on,button[aria-pressed="true"]{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.28)}
  .sw{width:26px;height:26px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.25)}
  .sw.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
  #loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:10;
    transition:opacity .7s;font-size:13px;letter-spacing:.3em;color:var(--mut);text-transform:uppercase}
  #loader.hide{opacity:0;pointer-events:none}
  @media(max-width:700px){
    .hint{display:none} header{left:16px;top:16px}
    .dock{bottom:12px;gap:6px;padding:8px;border-radius:16px}
    .grp+.grp{border-left:0;padding-left:6px}
    button{padding:7px 9px;font-size:12px}
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<div class="hint">Перетащите — вращение<br>Колесо / щипок — масштаб<br>Двойной клик — сброс вида</div>

<div class="dock">
  <div class="grp" id="views">
    <button data-view="iso" class="on">3/4</button>
    <button data-view="front">Спереди</button>

  </div>

  <div class="grp" id="colors">
    <button class="sw on" data-wrap="steel" title="Нержавеющая сталь" style="background:linear-gradient(135deg,#f1f3f5,#8f959c 55%,#d5d9de)"></button>
    <button class="sw" data-wrap="black" title="Чёрный" style="background:#17181b"></button>
    <button class="sw" data-wrap="white" title="Белый" style="background:#eceef0"></button>
    <button class="sw" data-wrap="red" title="Красный" style="background:#a3121a"></button>
    <button class="sw" data-wrap="blue" title="Синий" style="background:#1f4380"></button>
  </div>
</div>

<div id="loader">Загрузка…</div>

<script type="module">
/* =====================================================================
   ЧИСТАЯ ГЕОМЕТРИЯ КУЗОВА (без зависимостей от Three.js)
   Ось X — вперёд (передок +X), Y — вверх, Z — вправо. Единицы — метры.
   Кузов — «лофт» по сечениям: каждая плоская грань остаётся плоской,
   поэтому панели выглядят как у настоящего стального экзоскелета.
   ===================================================================== */
const ST = [
  // x, низ, линия пояса, верх, полуширина по низу
  { x:  2.84, yb: 0.42, belt: 0.95,  top: 0.95,  wb: 0.93  }, // передний торец
  { x:  2.20, yb: 0.42, belt: 1.079, top: 1.079, wb: 0.985 }, // капот
  { x:  1.50, yb: 0.42, belt: 1.22,  top: 1.22,  wb: 1.0   }, // основание лобового
  { x:  0.25, yb: 0.42, belt: 1.17,  top: 1.79,  wb: 1.0   }, // пик крыши
  { x: -0.95, yb: 0.42, belt: 1.20,  top: 1.59,  wb: 1.0   }, // конец кабины
  { x: -2.84, yb: 0.42, belt: 1.27,  top: 1.275, wb: 1.0   }, // корма
];
const TILT = 0.45; // наклон боковых стёкол внутрь (постоянный => грани плоские)

function buildBody(V){
  const v = (x,y,z) => new V(x,y,z);
  const sub = (a,b) => a.clone().sub(b);
  const cross = (a,b) => a.clone().cross(b);

  // кольцо сечения: 0 низ-лев, 1 низ-прав, 2 пояс-прав, 3 верх-прав, 4 верх-лев, 5 пояс-лев
  const rings = ST.map(s => {
    const wt = s.wb - TILT * (s.top - s.belt);
    return [ v(s.x,s.yb,-s.wb), v(s.x,s.yb,s.wb), v(s.x,s.belt,s.wb),
             v(s.x,s.top,wt),  v(s.x,s.top,-wt),  v(s.x,s.belt,-s.wb) ];
  });

  const tri = (pos,a,b,c) => pos.push(a.x,a.y,a.z, b.x,b.y,b.z, c.x,c.y,c.z);
  const area = (a,b,c) => cross(sub(b,a), sub(c,a)).length();

  function quad(pos,a,b,c,d,outFn){
    const n = cross(sub(c,a), sub(d,b));
    if (n.length() < 1e-7) return;
    const cen = v((a.x+b.x+c.x+d.x)/4,(a.y+b.y+c.y+d.y)/4,(a.z+b.z+c.z+d.z)/4);
    const flip = outFn(cen,n) < 0;
    const t1 = flip ? [a,d,c] : [a,b,c];
    const t2 = flip ? [a,c,b] : [a,c,d];
    if (area(...t1) > 1e-7) tri(pos,...t1);
    if (area(...t2) > 1e-7) tri(pos,...t2);
  }
  const loftOut = (cen,n) => (cen.y - 0.7) * n.y + cen.z * n.z;

  function loft(pos, segs){
    for (let i = 0; i < rings.length - 1; i++)
      for (const k of segs)
        quad(pos, rings[i][k], rings[i][(k+1)%6], rings[i+1][(k+1)%6], rings[i+1][k], loftOut);
  }
  function cap(pos, ring, sign){
    const c = v(0,0,0);
    ring.forEach(p => { c.x += p.x/6; c.y += p.y/6; c.z += p.z/6; });
    for (let i = 0; i < 6; i++){
      const p = ring[i], q = ring[(i+1)%6];
      const n = cross(sub(p,c), sub(q,c));
      if (n.length() < 1e-7) continue;
      if (n.x * sign < 0) tri(pos,c,q,p); else tri(pos,c,p,q);
    }
  }

  const steelPos = [], underPos = [];
  loft(steelPos, [1,2,3,4,5]);
  cap(steelPos, rings[0], +1);
  cap(steelPos, rings[rings.length-1], -1);
  loft(underPos, [0]);

  // точка на боковой скошенной поверхности сегмента seg (правый борт)
  function sideSurf(seg, x, t){
    const A = rings[seg], B = rings[seg+1];
    const s = (A[2].x - x) / (A[2].x - B[2].x);
    const bel = A[2].clone().lerp(B[2], s), top = A[3].clone().lerp(B[3], s);
    return bel.lerp(top, t);
  }
  function sideN(seg){
    const A = rings[seg], B = rings[seg+1];
    const e1 = sub(B[2],A[2]);
    const e2 = sub(A[3],A[2]).add(sub(B[3],B[2]));
    const n = cross(e1,e2).normalize();
    if (n.z < 0) n.negate();
    return n;
  }
  // точка на верхней плоскости сегмента seg; f = -1 (левый край) … +1 (правый край)
  function topSurf(seg, x, f){
    const A = rings[seg], B = rings[seg+1];
    const s = (A[3].x - x) / (A[3].x - B[3].x);
    const L = A[4].clone().lerp(B[4], s), R = A[3].clone().lerp(B[3], s);
    return L.lerp(R, (f + 1) / 2);
  }
  function topN(seg){
    const A = rings[seg], B = rings[seg+1];
    const n = cross(sub(B[3],A[3]), sub(A[4],A[3])).normalize();
    if (n.y < 0) n.negate();
    return n;
  }
  // накладка (стекло/рамка) поверх плоскости: 4 точки + нормаль + смещение
  function overlayPos(pts, normal, off){
    const p = pts.map(q => q.clone().add(normal.clone().multiplyScalar(off)));
    const pos = [];
    quad(pos, p[0], p[1], p[2], p[3], (cen,n) => n.x*normal.x + n.y*normal.y + n.z*normal.z);
    return pos;
  }
  return { rings, steelPos, underPos, sideSurf, sideN, topSurf, topN, overlayPos };
}
/*__END_GEOM__*/

/* =====================================================================
   СЦЕНА
   ===================================================================== */
const loader = document.getElementById('loader');
function fail(msg, err){
  console.error(err || msg);
  loader.classList.remove('hide');
  loader.innerHTML = '<div style="text-align:center;line-height:1.8;letter-spacing:.06em;text-transform:none;padding:0 24px">' + msg + '</div>';
}

(async function boot(){
  let mods;
  try {
    mods = await Promise.all([
      import('three'),
      import('three/addons/controls/OrbitControls.js'),
      import('three/addons/postprocessing/EffectComposer.js'),
      import('three/addons/postprocessing/RenderPass.js'),
      import('three/addons/postprocessing/UnrealBloomPass.js'),
      import('three/addons/postprocessing/OutputPass.js'),
    ]);
  } catch (e) {
    fail('Не удалось загрузить Three.js с CDN.<br>Проверьте интернет-соединение и обновите страницу.', e);
    return;
  }
  try {
    start(mods[0], {
      OrbitControls: mods[1].OrbitControls, EffectComposer: mods[2].EffectComposer,
      RenderPass: mods[3].RenderPass, UnrealBloomPass: mods[4].UnrealBloomPass, OutputPass: mods[5].OutputPass,
    });
  } catch (e) {
    fail('Не удалось запустить 3D-сцену.<br>Возможно, в браузере отключён WebGL.', e);
  }
})();

function start(THREE, X){
  const { OrbitControls, EffectComposer, RenderPass, UnrealBloomPass, OutputPass } = X;
  const stage = document.getElementById('stage');
  const W = () => stage.clientWidth || window.innerWidth;
  const H = () => stage.clientHeight || window.innerHeight;
  const pr = Math.min(window.devicePixelRatio || 1, 1.75);
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- рендерер, сцена, камера ---------- */
  const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(pr);
  renderer.setSize(W(), H());
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0b0d);
  scene.fog = new THREE.Fog(0x0a0b0d, 15, 42);

  const camera = new THREE.PerspectiveCamera(32, W() / H(), 0.5, 120);
  const TARGET = new THREE.Vector3(0, 0.85, 0);

  /* ---------- постобработка: MSAA + bloom для светодиодных планок ---------- */
  const rt = new THREE.WebGLRenderTarget(Math.floor(W() * pr), Math.floor(H() * pr), { type: THREE.HalfFloatType, samples: 4 });
  const composer = new EffectComposer(renderer, rt);
  composer.setSize(W(), H());
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(W(), H()), 0.55, 0.6, 1.5);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  /* ---------- студийное окружение для отражений ---------- */
  (function buildEnv(){
    const env = new THREE.Scene();
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false,
      vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: 'varying vec3 vP; void main(){ float h = normalize(vP).y;' +
        ' vec3 top = vec3(0.28,0.30,0.34); vec3 hor = vec3(0.20,0.21,0.23); vec3 bot = vec3(0.04,0.04,0.045);' +
        ' vec3 c = h > 0.0 ? mix(hor, top, pow(h, 0.6)) : mix(hor, bot, pow(-h, 0.5));' +
        ' gl_FragColor = vec4(c, 1.0); }'
    });
    env.add(new THREE.Mesh(new THREE.SphereGeometry(60, 32, 16), skyMat));
    const panel = (w, h, pos, k, tint) => {
      const t = tint || [1, 1, 1];
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ color: new THREE.Color(t[0]*k, t[1]*k, t[2]*k), side: THREE.DoubleSide }));
      m.position.set(pos[0], pos[1], pos[2]); m.lookAt(0, 0, 0); env.add(m);
    };
    panel(26, 10, [0, 22, 0], 2.3, [1.0, 1.0, 1.05]);   // верхний софтбокс
    panel(30, 7,  [0, 7, 21], 1.7, [1.0, 1.0, 1.0]);     // боковой, +Z
    panel(30, 7,  [0, 7, -21], 1.7, [1.0, 1.0, 1.0]);    // боковой, -Z
    panel(8, 26,  [22, 8, 0], 1.6, [0.9, 0.95, 1.1]);    // передний холодный
    panel(8, 26,  [-22, 8, 0], 1.6, [1.1, 0.98, 0.9]);   // задний тёплый
    panel(18, 3,  [14, 2, -14], 2.0, [1.1, 0.9, 0.75]);  // тёплый акцент
    const pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(env, 0.02).texture;
    pm.dispose();
  })();

  /* ---------- свет ---------- */
  const sun = new THREE.DirectionalLight(0xffffff, 1.6);
  sun.position.set(5, 9, 4);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 30 });
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.025; sun.shadow.radius = 4;
  scene.add(sun);

  const SPOT_I = 260;
  const spots = [];
  [-0.7, 0.7].forEach(z => {
    const s = new THREE.SpotLight(0xe6f1ff, SPOT_I, 22, 0.55, 0.85, 2);
    s.position.set(2.95, 0.9, z); s.target.position.set(9.5, 0, z * 1.8);
    scene.add(s, s.target); spots.push(s);
  });

  /* ---------- текстуры ---------- */
  function brushedTexture(){
    const c = document.createElement('canvas'); c.width = c.height = 1024;
    const g = c.getContext('2d');
    g.fillStyle = 'rgb(170,170,170)'; g.fillRect(0, 0, 1024, 1024);
    for (let i = 0; i < 5200; i++){
      const y = Math.random() * 1024, len = 80 + Math.random() * 700, x = Math.random() * 1024;
      const v = (120 + Math.random() * 100) | 0;
      g.strokeStyle = 'rgba(' + v + ',' + v + ',' + v + ',' + (0.15 + Math.random() * 0.35) + ')';
      g.lineWidth = 0.5 + Math.random() * 1.3;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + len, y); g.stroke();
      if (x + len > 1024){ g.beginPath(); g.moveTo(x - 1024, y); g.lineTo(x + len - 1024, y); g.stroke(); }
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
    return t;
  }
  function rimTexture(){
    const S = 512, cx = S / 2, c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d');
    let gr = g.createRadialGradient(cx, cx, 10, cx, cx, cx);
    gr.addColorStop(0, '#3a3d42'); gr.addColorStop(0.6, '#2a2c30'); gr.addColorStop(1, '#1a1b1e');
    g.fillStyle = gr; g.beginPath(); g.arc(cx, cx, cx, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#9aa0a8'; g.lineWidth = 14; g.beginPath(); g.arc(cx, cx, cx - 9, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = '#555a61'; g.lineWidth = 4;  g.beginPath(); g.arc(cx, cx, cx - 22, 0, Math.PI * 2); g.stroke();
    const N = 12;
    for (let i = 0; i < N; i++){
      g.save(); g.translate(cx, cx); g.rotate(i * 2 * Math.PI / N);
      g.beginPath(); g.moveTo(60, -8); g.lineTo(215, -34); g.lineTo(222, -6); g.lineTo(80, 22); g.closePath();
      g.fillStyle = '#050506'; g.fill();
      g.strokeStyle = 'rgba(180,186,194,0.35)'; g.lineWidth = 2; g.stroke();
      g.restore();
    }
    gr = g.createRadialGradient(cx - 10, cx - 10, 4, cx, cx, 52);
    gr.addColorStop(0, '#c7ccd2'); gr.addColorStop(1, '#4b4f55');
    g.fillStyle = gr; g.beginPath(); g.arc(cx, cx, 52, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#1c1d20'; g.lineWidth = 5; g.stroke();
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
    return t;
  }
  function radialTexture(inner, outer){
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
    gr.addColorStop(0, inner); gr.addColorStop(0.55, inner.replace(/[\d.]+\)$/, '0.45)')); gr.addColorStop(1, outer);
    g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }

  /* ---------- материалы ---------- */
  const brushed = brushedTexture();
  const bodyMat  = new THREE.MeshPhysicalMaterial({ color: 0xc3c7cc, metalness: 1, roughness: 0.5, roughnessMap: brushed, envMapIntensity: 1.1 });
  const underMat = new THREE.MeshStandardMaterial({ color: 0x0c0d0f, roughness: 0.8, metalness: 0.2 });
  const poly = { polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 };
  const glassMat = new THREE.MeshPhysicalMaterial(Object.assign({ color: 0x0b0f14, metalness: 1, roughness: 0.06, envMapIntensity: 1.0 }, poly));
  const frameMat = new THREE.MeshStandardMaterial(Object.assign({ color: 0x050607, roughness: 0.4, metalness: 0.3 }, poly));
  const plastic  = new THREE.MeshStandardMaterial({ color: 0x101113, roughness: 0.62, metalness: 0.1 });
  const gloss    = new THREE.MeshPhysicalMaterial({ color: 0x050506, roughness: 0.15, metalness: 0.2, clearcoat: 1 });
  const seamMat  = new THREE.MeshStandardMaterial({ color: 0x08090a, roughness: 0.6, metalness: 0.2 });
  const darkMetal= new THREE.MeshStandardMaterial({ color: 0x1b1d20, roughness: 0.5, metalness: 0.8, side: THREE.DoubleSide });
  const tireMat  = new THREE.MeshStandardMaterial({ color: 0x0b0b0c, roughness: 0.88, metalness: 0, side: THREE.DoubleSide });
  const rimMat   = new THREE.MeshStandardMaterial({ map: rimTexture(), metalness: 0.85, roughness: 0.34 });
  const lipMat   = new THREE.MeshStandardMaterial({ color: 0xaeb4bb, metalness: 1, roughness: 0.25 });
  const frontBar = new THREE.MeshStandardMaterial({ color: 0x151515, emissive: 0xeaf4ff, emissiveIntensity: 12, roughness: 0.4 });
  const rearBar  = new THREE.MeshStandardMaterial({ color: 0x151515, emissive: 0xff1410, emissiveIntensity: 7, roughness: 0.4 });
  const amberMat = new THREE.MeshStandardMaterial({ color: 0x151515, emissive: 0xff8a1c, emissiveIntensity: 5, roughness: 0.4 });

  /* ---------- вспомогательные функции геометрии ---------- */
  function geoFromPos(pos, uvScale){
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.computeVertexNormals();
    const n = g.attributes.normal, p = g.attributes.position, uv = new Float32Array(p.count * 2);
    for (let i = 0; i < p.count; i++){
      const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));
      let u, v;
      if (ay >= ax && ay >= az){ u = p.getX(i); v = p.getZ(i); }
      else if (az >= ax){ u = p.getX(i); v = p.getY(i); }
      else { u = p.getZ(i); v = p.getY(i); }
      uv[2*i] = u * uvScale; uv[2*i+1] = v * uvScale;
    }
    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    return g;
  }
  const put = (parent, geo, mat, x, y, z) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x || 0, y || 0, z || 0); parent.add(m); return m;
  };
  const box = (parent, mat, w, h, d, x, y, z) => put(parent, new THREE.BoxGeometry(w, h, d), mat, x, y, z);
  function ribbon(parent, x1, y1, x2, y2, w, z, mat){
    const m = new THREE.Mesh(new THREE.PlaneGeometry(Math.hypot(x2 - x1, y2 - y1), w), mat);
    m.position.set((x1 + x2) / 2, (y1 + y2) / 2, z);
    m.rotation.z = Math.atan2(y2 - y1, x2 - x1);
    parent.add(m); return m;
  }
  // многоугольная (граненая) арка колёсной ниши
  function archPoints(R, n){
    const a = [];
    for (let i = 0; i <= n; i++){ const t = Math.PI * i / n; a.push([R * Math.cos(t), R * Math.sin(t)]); }
    return a;
  }
  function archRingShape(R, r, n){
    const o = archPoints(R, n), i = archPoints(r, n), s = new THREE.Shape();
    s.moveTo(o[0][0], o[0][1]);
    for (let k = 1; k <= n; k++) s.lineTo(o[k][0], o[k][1]);
    s.lineTo(i[n][0], i[n][1]);
    for (let k = n - 1; k >= 0; k--) s.lineTo(i[k][0], i[k][1]);
    s.closePath(); return s;
  }
  function archDiscShape(R, n){
    const o = archPoints(R, n), s = new THREE.Shape();
    s.moveTo(o[0][0], o[0][1]);
    for (let k = 1; k <= n; k++) s.lineTo(o[k][0], o[k][1]);
    s.closePath(); return s;
  }

  /* ---------- сборка автомобиля ---------- */
  const body = buildBody(THREE.Vector3);
  const truck = new THREE.Group();
  scene.add(truck);

  truck.add(new THREE.Mesh(geoFromPos(body.steelPos, 0.5), bodyMat));
  truck.add(new THREE.Mesh(geoFromPos(body.underPos, 0.5), underMat));

  // стёкла: лобовое и панорамная крыша (рамка + стекло)
  const overlay = (pts, normal, off, mat) =>
    truck.add(new THREE.Mesh(geoFromPos(body.overlayPos(pts, normal, off), 1), mat));
  const topQuad = (seg, x1, x2, f) => [
    body.topSurf(seg, x1, -f), body.topSurf(seg, x1, f), body.topSurf(seg, x2, f), body.topSurf(seg, x2, -f)];
  overlay(topQuad(2, 1.47, 0.27, 0.955), body.topN(2), 0.004, frameMat);
  overlay(topQuad(2, 1.43, 0.31, 0.90),  body.topN(2), 0.0075, glassMat);
  overlay(topQuad(3, 0.17, -0.90, 0.93), body.topN(3), 0.004, frameMat);
  overlay(topQuad(3, 0.12, -0.86, 0.88), body.topN(3), 0.0075, glassMat);

  // передняя оптика и бампер
  box(truck, gloss,   0.012, 0.075, 1.84, 2.838, 0.905, 0);
  box(truck, frontBar, 0.02,  0.028, 1.78, 2.848, 0.905, 0);
  [-1, 1].forEach(s => box(truck, amberMat, 0.016, 0.03, 0.12, 2.846, 0.905, s * 0.88));
  box(truck, plastic, 0.12, 0.25, 1.80, 2.82, 0.55, 0);     // чёрный бампер
  box(truck, plastic, 0.20, 0.03, 1.90, 2.77, 0.405, 0);    // сплиттер
  // задняя оптика и бампер
  box(truck, gloss,   0.012, 0.075, 1.90, -2.842, 1.225, 0);
  box(truck, rearBar, 0.02,  0.028, 1.84, -2.852, 1.225, 0);
  box(truck, plastic, 0.12, 0.25, 1.84, -2.80, 0.56, 0);
  box(truck, plastic, 0.16, 0.10, 0.70, -2.82, 0.46, 0);    // приёмник фаркопа

  // колесо в локальных координатах: наружу = +Z
  const tireGeo = (function(){
    const half = [[0.268,-0.128],[0.292,-0.148],[0.335,-0.156],[0.385,-0.153],[0.425,-0.138],
                  [0.446,-0.108],[0.455,-0.07],[0.457,-0.03],[0.457,0.0]];
    const pts = half.concat(half.slice(0, -1).reverse().map(p => [p[0], -p[1]]))
                    .map(p => new THREE.Vector2(p[0], p[1]));
    const g = new THREE.LatheGeometry(pts, 72); g.rotateX(Math.PI / 2); return g;
  })();
  const WZ = 0.905; // центр шины по Z
  function makeWheel(){
    const g = new THREE.Group();
    put(g, tireGeo, tireMat, 0, 0, WZ);
    const barrel = put(g, new THREE.CylinderGeometry(0.27, 0.27, 0.26, 32, 1, true), darkMetal, 0, 0, WZ);
    barrel.rotation.x = Math.PI / 2;
    put(g, new THREE.CircleGeometry(0.285, 64), rimMat, 0, 0, WZ + 0.103);
    put(g, new THREE.TorusGeometry(0.283, 0.012, 10, 64), lipMat, 0, 0, WZ + 0.105);
    return g;
  }

  // правый борт (затем зеркально — левый)
  const side = new THREE.Group();
  const WHEEL_Y = 0.457, WHEEL_X = [1.86, -1.69];
  WHEEL_X.forEach(wx => {
    const w = makeWheel(); w.position.set(wx, WHEEL_Y, 0); side.add(w);
    const disc = new THREE.Mesh(new THREE.ShapeGeometry(archDiscShape(0.545, 8)), plastic);
    disc.position.set(wx, WHEEL_Y, 1.003); side.add(disc);
    const flare = new THREE.Mesh(new THREE.ExtrudeGeometry(archRingShape(0.575, 0.515, 8), { depth: 0.06, bevelEnabled: false }), plastic);
    flare.position.set(wx, WHEEL_Y, 1.0); side.add(flare);
  });
  box(side, plastic, 2.40, 0.15, 0.05, 0.085, 0.495, 1.0);                 // порог
  ribbon(side, 1.30, 1.205, 1.33, 0.57, 0.008, 1.0035, seamMat);           // перед. кромка передней двери
  ribbon(side, 0.27, 1.17, 0.20, 0.57, 0.008, 1.0035, seamMat);            // стык дверей (B-стойка)
  ribbon(side, -0.90, 1.195, -0.94, 0.57, 0.008, 1.0035, seamMat);         // задняя кромка задней двери
  ribbon(side, 1.33, 0.585, -0.94, 0.585, 0.008, 1.0035, seamMat);         // нижний шов дверей
  [0.62, -0.50].forEach(hx => box(side, darkMetal, 0.18, 0.03, 0.022, hx, 1.06, 1.006));  // ручки
  // боковые окна
  const sideQuad = (seg, pts) => pts.map(p => body.sideSurf(seg, p[0], p[1]));
  const addSide = (seg, pts, off, mat) =>
    side.add(new THREE.Mesh(geoFromPos(body.overlayPos(sideQuad(seg, pts), body.sideN(seg), off), 1), mat));
  addSide(2, [[1.44,0.17],[0.26,0.10],[0.26,0.90],[1.44,0.83]], 0.004, frameMat);
  addSide(2, [[1.40,0.20],[0.30,0.14],[0.30,0.86],[1.40,0.80]], 0.0075, glassMat);
  addSide(3, [[0.24,0.12],[-0.90,0.12],[-0.90,0.88],[0.24,0.88]], 0.004, frameMat);
  addSide(3, [[0.20,0.16],[-0.86,0.16],[-0.86,0.84],[0.20,0.84]], 0.0075, glassMat);
  // зеркало
  const mir = new THREE.Group(); mir.position.set(1.28, 1.25, 1.0); side.add(mir);
  box(mir, plastic, 0.08, 0.03, 0.14, 0, 0, 0.07);
  const head = box(mir, gloss, 0.22, 0.15, 0.06, 0, 0.04, 0.17); head.rotation.y = 0.12;
  const mg = put(mir, new THREE.PlaneGeometry(0.19, 0.115), lipMat, -0.108, 0.04, 0.17);
  mg.rotation.y = -Math.PI / 2 + 0.12;
  truck.add(side);
  const left = side.clone(); left.scale.set(1, 1, -1); truck.add(left);

  truck.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });

  /* ---------- пол, тени, отражение ---------- */
  const floor = new THREE.Mesh(new THREE.CircleGeometry(40, 96),
    new THREE.MeshStandardMaterial({ color: 0x16181c, roughness: 0.5, metalness: 0.2, transparent: true, opacity: 0.86, envMapIntensity: 0.6 }));
  floor.rotation.x = -Math.PI / 2; floor.renderOrder = 0; scene.add(floor);

  const glow = new THREE.Mesh(new THREE.CircleGeometry(8.5, 64),
    new THREE.MeshBasicMaterial({ map: radialTexture('rgba(120,150,190,0.55)', 'rgba(120,150,190,0)'),
      transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  glow.rotation.x = -Math.PI / 2; glow.position.y = 0.003; glow.renderOrder = 1; scene.add(glow);

  const contact = new THREE.Mesh(new THREE.PlaneGeometry(7.6, 3.4),
    new THREE.MeshBasicMaterial({ map: radialTexture('rgba(0,0,0,0.9)', 'rgba(0,0,0,0)'), transparent: true, depthWrite: false, fog: false }));
  contact.rotation.x = -Math.PI / 2; contact.position.y = 0.005; contact.renderOrder = 2; scene.add(contact);

  const shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.ShadowMaterial({ opacity: 0.5 }));
  shadowCatcher.rotation.x = -Math.PI / 2; shadowCatcher.position.y = 0.007;
  shadowCatcher.receiveShadow = true; shadowCatcher.renderOrder = 3; scene.add(shadowCatcher);

  const reflection = truck.clone(true);
  reflection.scale.y = -1;
  reflection.traverse(o => { if (o.isMesh){ o.castShadow = false; o.receiveShadow = false; } });
  scene.add(reflection);

  /* ---------- управление камерой ---------- */
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(TARGET);
  controls.enableDamping = true; controls.dampingFactor = 0.06;
  controls.enablePan = false;
  controls.minDistance = 4.5; controls.maxDistance = 24;
  controls.maxPolarAngle = Math.PI / 2 - 0.02;
  controls.autoRotate = !reduceMotion; controls.autoRotateSpeed = 1.0;

  const aspect0 = W() / H();
  const fit = aspect0 < 1.3 ? Math.min(2.4, 1.3 / aspect0 * 0.8) : 1;
  const VIEWS = {
    iso:   [7.2, 2.5, 6.4],
    front: [10.2, 1.4, 0.6],
    side:  [-0.6, 1.5, 10.8],
    rear:  [-10.2, 1.6, -0.6],
    top:   [0.01, 12.5, 0.4],
  };
  const viewPos = k => new THREE.Vector3(VIEWS[k][0], VIEWS[k][1], VIEWS[k][2]).multiplyScalar(fit).add(TARGET);
  camera.position.copy(viewPos('iso'));
  controls.update();

  let anim = null;
  function flyTo(key){
    const from = new THREE.Spherical().setFromVector3(camera.position.clone().sub(TARGET));
    const to = new THREE.Spherical().setFromVector3(viewPos(key).sub(TARGET));
    let d = to.theta - from.theta;
    while (d > Math.PI) d -= 2 * Math.PI;
    while (d < -Math.PI) d += 2 * Math.PI;
    anim = { from, to, d, t: 0, dur: 1.1 };
  }
  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  /* ---------- интерфейс ---------- */
  const btnRot = document.getElementById('btnRot');
  const btnLights = document.getElementById('btnLights');
  const viewBtns = [].slice.call(document.querySelectorAll('[data-view]'));
  const wrapBtns = [].slice.call(document.querySelectorAll('[data-wrap]'));
  const syncRot = () => btnRot.setAttribute('aria-pressed', String(controls.autoRotate));
  const markView = k => viewBtns.forEach(b => b.classList.toggle('on', b.dataset.view === k));
  syncRot();

  viewBtns.forEach(b => b.addEventListener('click', () => {
    controls.autoRotate = false; syncRot(); markView(b.dataset.view); flyTo(b.dataset.view);
  }));
  btnRot.addEventListener('click', () => { controls.autoRotate = !controls.autoRotate; anim = null; syncRot(); });
  controls.addEventListener('start', () => {
    anim = null;
    if (controls.autoRotate){ controls.autoRotate = false; syncRot(); }
    markView('');
  });
  renderer.domElement.addEventListener('dblclick', () => { controls.autoRotate = false; syncRot(); markView('iso'); flyTo('iso'); });

  let lightsOn = true;
  function setLights(on){
    lightsOn = on;
    frontBar.emissiveIntensity = on ? 12 : 0.02;
    rearBar.emissiveIntensity  = on ? 7 : 0.02;
    amberMat.emissiveIntensity = on ? 5 : 0.02;
    spots.forEach(s => { s.intensity = on ? SPOT_I : 0; });
    btnLights.setAttribute('aria-pressed', String(on));
  }
  btnLights.addEventListener('click', () => setLights(!lightsOn));

  const WRAPS = {
    steel: { color: 0xc3c7cc, metalness: 1,    roughness: 0.5,  brushed: true,  clearcoat: 0 },
    black: { color: 0x16171a, metalness: 0.9,  roughness: 0.5,  brushed: true,  clearcoat: 0 },
    white: { color: 0xe9ebee, metalness: 0.55, roughness: 0.34, brushed: false, clearcoat: 0.8 },
    red:   { color: 0x8e0f16, metalness: 0.6,  roughness: 0.3,  brushed: false, clearcoat: 1 },
    blue:  { color: 0x1b3a6b, metalness: 0.6,  roughness: 0.3,  brushed: false, clearcoat: 1 },
  };
  function applyWrap(name){
    const w = WRAPS[name]; if (!w) return;
    bodyMat.color.setHex(w.color); bodyMat.metalness = w.metalness; bodyMat.roughness = w.roughness;
    bodyMat.clearcoat = w.clearcoat; bodyMat.clearcoatRoughness = 0.08;
    const map = w.brushed ? brushed : null;
    if (bodyMat.roughnessMap !== map){ bodyMat.roughnessMap = map; bodyMat.needsUpdate = true; }
    wrapBtns.forEach(b => b.classList.toggle('on', b.dataset.wrap === name));
  }
  wrapBtns.forEach(b => b.addEventListener('click', () => applyWrap(b.dataset.wrap)));
  applyWrap('steel');

  /* ---------- ресайз и цикл ---------- */
  let rz = 0;
  window.addEventListener('resize', () => {
    clearTimeout(rz);
    rz = setTimeout(() => {
      renderer.setSize(W(), H()); composer.setSize(W(), H());
      camera.aspect = W() / H(); camera.updateProjectionMatrix();
    }, 60);
  });

  const clock = new THREE.Clock();
  let shown = false;
  const tmp = new THREE.Spherical();
  function frame(){
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.05);
    if (anim){
      anim.t = Math.min(1, anim.t + dt / anim.dur);
      const e = ease(anim.t);
      tmp.radius = anim.from.radius + (anim.to.radius - anim.from.radius) * e;
      tmp.phi = Math.min(Math.PI / 2 - 0.02, Math.max(0.02, anim.from.phi + (anim.to.phi - anim.from.phi) * e));
      tmp.theta = anim.from.theta + anim.d * e;
      camera.position.setFromSpherical(tmp).add(TARGET);
      if (anim.t >= 1) anim = null;
    }
    controls.update();
    composer.render();
    if (!shown){ shown = true; loader.classList.add('hide'); }
  }
  frame();
}
</script>
</body>
</html>
