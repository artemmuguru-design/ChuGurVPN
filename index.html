<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🌍 3D WORLD — Полная версия</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#73c9ff;font-family:Arial,sans-serif}
#game{position:fixed;inset:0;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#startScreen{position:absolute;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;background:linear-gradient(#73c9ff,#3d9ed4,#2273a6)}
#startScreen h1{margin-bottom:8px;font-size:28px;letter-spacing:3px;font-weight:900}
#startScreen p{margin-bottom:20px;color:#e8f7ff;font-size:13px;text-align:center;padding:0 20px;line-height:1.5}
#startButton{border:none;border-radius:15px;padding:16px 34px;background:white;color:#111;font-size:17px;font-weight:900;box-shadow:0 8px 30px rgba(0,0,0,.3);cursor:pointer}
#startButton.disabled{background:#aaa;color:#555;pointer-events:none;opacity:.7}
#rotateHint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#ffcc00;padding:12px 20px;border-radius:30px;font-size:14px;font-weight:bold;letter-spacing:1px;animation:pulse 2s infinite;text-align:center;width:80%}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
#controls{position:fixed;inset:0;pointer-events:none;z-index:50}
#controls>*{pointer-events:auto}
#joystickArea{position:absolute;left:0;bottom:0;width:50%;height:70%;touch-action:none}
#joystick{position:absolute;left:80px;bottom:100px;width:130px;height:130px;border-radius:50%;background:rgba(0,0,0,.15);border:2px solid rgba(255,255,255,.1);display:none;pointer-events:none;transform:translate(-50%,-50%)}
#joystick.active{display:block}
#stick{position:absolute;left:50%;top:50%;width:54px;height:54px;margin-left:-27px;margin-top:-27px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.15);pointer-events:none}
#droneInteractBtn{position:absolute;bottom:35%;left:50%;transform:translateX(-50%);padding:15px 25px;background:#2ecc71;color:white;border:none;border-radius:10px;font-size:18px;font-weight:900;cursor:pointer;display:none;z-index:55;box-shadow:0 4px 15px rgba(0,0,0,.3)}
#droneUpBtn,#droneDownBtn,#droneExitBtn{position:absolute;right:30px;width:70px;height:70px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.35);color:white;font-size:28px;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:60}
#droneExitBtn{bottom:220px;background:rgba(231,76,60,.5);border-color:rgba(231,76,60,.8);font-size:22px}
#droneUpBtn{bottom:130px;background:rgba(46,204,113,.5);border-color:rgba(46,204,113,.8)}
#droneDownBtn{bottom:40px;background:rgba(52,152,219,.5);border-color:rgba(52,152,219,.8)}
#droneJoystickArea{position:absolute;left:0;bottom:0;width:50%;height:70%;touch-action:none;display:none;z-index:55}
#droneJoystick{position:absolute;left:80px;bottom:100px;width:130px;height:130px;border-radius:50%;background:rgba(0,0,0,.15);border:2px solid rgba(255,255,255,.1);display:none;pointer-events:none;transform:translate(-50%,-50%)}
#droneJoystick.active{display:block}
#droneStick{position:absolute;left:50%;top:50%;width:54px;height:54px;margin-left:-27px;margin-top:-27px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.15);pointer-events:none}
#droneHint{position:absolute;top:20px;left:50%;transform:translateX(-50%);color:white;background:rgba(0,0,0,.7);padding:8px 16px;border-radius:20px;font-size:13px;pointer-events:none;z-index:55;display:none}
.notification{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.9);color:white;padding:20px 40px;border-radius:15px;font-size:18px;font-weight:900;z-index:1000;pointer-events:none;animation:fadeOut 2.5s forwards;text-align:center}
@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
#statusBar{position:fixed;top:10px;left:10px;background:rgba(0,0,0,.7);color:white;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700;z-index:100;pointer-events:none}
#miniMap{position:fixed;right:10px;top:10px;width:140px;height:140px;background:rgba(0,0,0,.6);border-radius:50%;border:2px solid rgba(255,255,255,.3);z-index:100;pointer-events:none;overflow:hidden}
#miniMapCanvas{width:100%;height:100%}
#compass{position:fixed;right:160px;top:10px;background:rgba(0,0,0,.7);color:white;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700;z-index:100;pointer-events:none}
</style>
</head>
<body>
<div id="game">
  <div id="startScreen">
    <h1>🌍 3D WORLD</h1>
    <p>Открытый мир с домами, фермой, военной базой и аэропортом.<br>Управляй дроном, не врежься!</p>
    <button id="startButton" class="disabled">▶ НАЧАТЬ</button>
    <div id="rotateHint">📱 Переверните экран горизонтально</div>
  </div>
  <div id="statusBar">🚶 Пешком</div>
  <div id="compass">N</div>
  <div id="miniMap"><canvas id="miniMapCanvas"></canvas></div>
  <div id="controls">
    <div id="joystickArea"></div>
    <div id="joystick"><div id="stick"></div></div>
    <div id="droneJoystickArea"></div>
    <div id="droneJoystick"><div id="droneStick"></div></div>
    <button id="droneExitBtn">🚪</button>
    <button id="droneUpBtn">⬆</button>
    <button id="droneDownBtn">⬇</button>
  </div>
  <button id="droneInteractBtn">🚁 Сесть в дрон</button>
  <div id="droneHint">Свайп справа — поворот камеры</div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ========= СЦЕНА =========
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 80, 900);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 2000);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('game').appendChild(renderer.domElement);

// ========= СВЕТ =========
scene.add(new THREE.AmbientLight(0x99aacc, 0.6));
scene.add(new THREE.HemisphereLight(0x87CEEB, 0x3a7d44, 1.0));
const sun = new THREE.DirectionalLight(0xffeedd, 2.5);
sun.position.set(100, 120, 50);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 800;
[-300, 300, -300, 300].forEach((v, i) => {
  if (i === 0) sun.shadow.camera.left = v;
  if (i === 1) sun.shadow.camera.right = v;
  if (i === 2) sun.shadow.camera.top = v;
  if (i === 3) sun.shadow.camera.bottom = v;
});
scene.add(sun);
scene.add(sun.target);

// ========= БОЛЬШАЯ ЗЕМЛЯ =========
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(2000, 2000),
  new THREE.MeshStandardMaterial({ color: 0x4CAF50, roughness: 0.9 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Дороги между районами
const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.95 });
function addRoad(x, z, w, d, rotY = 0) {
  const road = new THREE.Mesh(new THREE.BoxGeometry(w, 0.1, d), roadMat);
  road.position.set(x, 0.06, z);
  road.rotation.y = rotY;
  road.receiveShadow = true;
  scene.add(road);
}
addRoad(0, 0, 600, 10);
addRoad(0, 0, 10, 600);
addRoad(150, -150, 300, 10, Math.PI/4);
addRoad(-150, 150, 300, 10, -Math.PI/4);
addRoad(150, 150, 300, 10, -Math.PI/4);
addRoad(-150, -150, 300, 10, Math.PI/4);

// ========= КОЛЛАЙДЕРЫ =========
const colliders = [];
function addStaticBox(x1, y1, z1, x2, y2, z2, tag='static') {
  colliders.push({ type: 'box', getBox: () => new THREE.Box3(new THREE.Vector3(x1,y1,z1), new THREE.Vector3(x2,y2,z2)), tag: tag });
}
function addBoxCollider(mesh, tag='static') {
  colliders.push({ type: 'box', mesh: mesh, getBox: () => new THREE.Box3().setFromObject(mesh), tag: tag });
}
function addCylinderCollider(x, z, r, h, tag='static') {
  colliders.push({ type: 'cylinder', getPosition: () => new THREE.Vector3(x, h/2, z), radius: r, height: h, tag: tag });
}

// ========= ИГРОК (ТОЧНО КАК В ОРИГИНАЛЕ) =========
const player = new THREE.Group();
const skinMat = new THREE.MeshStandardMaterial({ color: 0xd9a066, roughness: 0.6 });
const shirtMat = new THREE.MeshStandardMaterial({ color: 0x3a2fd8, roughness: 0.6 }); // синяя куртка
const redMat = new THREE.MeshStandardMaterial({ color: 0xd42020, roughness: 0.6 });
const pantsMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, roughness: 0.8 });
const hairMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.9 });
const yellowMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.5 });
const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
const mouthMat = new THREE.MeshStandardMaterial({ color: 0x8b2020, roughness: 0.5 });
const pupilMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3 });

// Торс (куртка)
const torso = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.2, 1.3), shirtMat);
torso.position.y = 3.2;
torso.castShadow = true;
player.add(torso);

// Красный воротник
const collarP = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.35, 1.4), redMat);
collarP.position.y = 4.25;
player.add(collarP);

// Красный пояс
const beltP = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.4, 1.4), redMat);
beltP.position.y = 2.15;
player.add(beltP);

// Пряжка
const buckleP = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.1, 12), new THREE.MeshStandardMaterial({ color: 0x801010, roughness: 0.4 }));
buckleP.rotation.x = Math.PI / 2;
buckleP.position.set(0, 2.15, 0.7);
player.add(buckleP);

// Эмблема (жёлтый треугольник)
const triGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.12, 3);
triGeo.rotateX(Math.PI / 2);
triGeo.rotateZ(Math.PI);
const emblemTri = new THREE.Mesh(triGeo, yellowMat);
emblemTri.position.set(0, 3.4, 0.7);
player.add(emblemTri);

// Болты молнии
const bolt1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.5, 0.06), redMat);
bolt1.position.set(-0.08, 3.45, 0.8);
bolt1.rotation.z = 0.5;
player.add(bolt1);
const bolt2 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.4, 0.06), redMat);
bolt2.position.set(0.08, 3.25, 0.8);
bolt2.rotation.z = 0.5;
player.add(bolt2);

// Голова
const head = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.7, 1.6), skinMat);
head.position.y = 5.2;
head.castShadow = true;
player.add(head);

// Волосы
const hairTopP = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.45, 1.7), hairMat);
hairTopP.position.y = 0.9;
head.add(hairTopP);
const hairBackP = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.9, 0.3), hairMat);
hairBackP.position.set(0, 0.4, -0.75);
head.add(hairBackP);
const hairFringe = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.35, 0.25), hairMat);
hairFringe.position.set(0, 0.75, 0.75);
head.add(hairFringe);
const hairL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.7, 1.7), hairMat);
hairL.position.set(-0.9, 0.4, 0);
head.add(hairL);
const hairR = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.7, 1.7), hairMat);
hairR.position.set(0.9, 0.4, 0);
head.add(hairR);

// Рот и зубы
const mouthP = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.35, 0.1), mouthMat);
mouthP.position.set(0, -0.55, 0.8);
head.add(mouthP);
const teethP = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.12, 0.06), whiteMat);
teethP.position.set(0, 0.08, 0.03);
mouthP.add(teethP);

// Глаза
const eyeGroup = new THREE.Group();
eyeGroup.position.set(0, 5.35, 0);
player.add(eyeGroup);
const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), whiteMat);
leftEye.position.set(-0.5, 0.1, 0.8);
eyeGroup.add(leftEye);
const leftPupil = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), pupilMat);
leftPupil.position.set(0, 0, 0.18);
leftEye.add(leftPupil);
const rightEye = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), whiteMat);
rightEye.position.set(0.5, 0.1, 0.8);
eyeGroup.add(rightEye);
const rightPupil = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), pupilMat);
rightPupil.position.set(0, 0, 0.18);
rightEye.add(rightPupil);
const browL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.1), hairMat);
browL.position.set(-0.5, 0.4, 0.8);
eyeGroup.add(browL);
const browR = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.1), hairMat);
browR.position.set(0.5, 0.4, 0.8);
eyeGroup.add(browR);

// КРАСНЫЙ ПЛАЩ
const cape = new THREE.Group();
cape.position.set(0, 4.3, -0.7);
player.add(cape);
const capeCloth = new THREE.Mesh(new THREE.BoxGeometry(2.8, 3.8, 0.12), redMat);
capeCloth.position.y = -1.9;
capeCloth.rotation.x = 0.12;
capeCloth.castShadow = true;
cape.add(capeCloth);

// Руки с красной отделкой
const arms = [];
for (let side of [-1, 1]) {
  const arm = new THREE.Group();
  arm.position.set(side * 1.6, 4.0, 0);
  const sleeve = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.8), shirtMat);
  sleeve.position.y = -0.4;
  sleeve.castShadow = true;
  arm.add(sleeve);
  const trim = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.22, 0.85), redMat);
  trim.position.y = -0.9;
  arm.add(trim);
  const forearm = new THREE.Mesh(new THREE.BoxGeometry(0.55, 1.0, 0.6), skinMat);
  forearm.position.y = -1.5;
  forearm.castShadow = true;
  arm.add(forearm);
  const hand = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.5, 0.6), skinMat);
  hand.position.y = -2.1;
  arm.add(hand);
  player.add(arm);
  arms.push(arm);
}

// Ноги
const legs = [];
for (let side of [-1, 1]) {
  const leg = new THREE.Group();
  leg.position.set(side * 0.65, 2.2, 0);
  const thigh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.6, 0.9), pantsMat);
  thigh.position.y = -0.8;
  thigh.castShadow = true;
  leg.add(thigh);
  const shoe = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.5, 1.6), redMat);
  shoe.position.set(0, -1.8, 0.2);
  shoe.castShadow = true;
  leg.add(shoe);
  player.add(leg);
  legs.push(leg);
}

player.position.set(0, 0, 0);
player.scale.set(0.42, 0.42, 0.42);
scene.add(player);

// ========= ДРОН =========
const DRONE_SPAWN = new THREE.Vector3(4, 0, 4);
const droneGroup = new THREE.Group();
const droneBodyMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.4, metalness: 0.8 });
const droneAccentMat = new THREE.MeshStandardMaterial({ color: 0xff4400, roughness: 0.3, metalness: 0.6, emissive: new THREE.Color(0x220000) });
const dronePropMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.2, metalness: 0.5 });

const droneBody = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 1.6), droneBodyMat);
droneBody.position.y = 0.25;
droneBody.castShadow = true;
droneGroup.add(droneBody);
const droneCam = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 12), new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.1, metalness: 0.9 }));
droneCam.position.set(0, 0.15, 0.85);
droneGroup.add(droneCam);
const droneRing = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.05, 8, 16), droneAccentMat);
droneRing.position.set(0, 0.15, 0.9);
droneRing.rotation.x = Math.PI / 2;
droneGroup.add(droneRing);
const led = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), new THREE.MeshStandardMaterial({ color: 0x00ff00, emissive: 0x00ff00, emissiveIntensity: 1.5 }));
led.position.set(0, 0.45, 0.75);
droneGroup.add(led);

const droneArms = [];
const armData = [
  [0.8, 0.25, 0.8, Math.PI / 4],
  [-0.8, 0.25, 0.8, -Math.PI / 4],
  [0.8, 0.25, -0.8, -Math.PI / 4 + Math.PI],
  [-0.8, 0.25, -0.8, Math.PI / 4 + Math.PI]
];
armData.forEach((data) => {
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 1.2, 8), droneBodyMat);
  arm.position.set(data[0], data[1], data[2]);
  arm.rotation.z = Math.PI / 2;
  arm.rotation.y = data[3];
  arm.castShadow = true;
  droneGroup.add(arm);
  const motor = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.28, 0.3, 12), droneBodyMat);
  motor.position.set(data[0] * 1.6, 0.38, data[2] * 1.6);
  motor.castShadow = true;
  droneGroup.add(motor);
  const propGroup = new THREE.Group();
  propGroup.position.set(data[0] * 1.6, 0.55, data[2] * 1.6);
  propGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.04, 0.18), dronePropMat));
  propGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.04, 0.8), dronePropMat));
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.12, 8), droneAccentMat);
  hub.rotation.x = Math.PI / 2;
  propGroup.add(hub);
  droneGroup.add(propGroup);
  droneArms.push(propGroup);
});

const droneTile = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.08, 2.2), new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 }));
droneTile.position.set(DRONE_SPAWN.x, 0.04, DRONE_SPAWN.z);
scene.add(droneTile);

droneGroup.position.copy(DRONE_SPAWN);
scene.add(droneGroup);

// ========= ДЕРЕВЬЯ =========
function createTree(x, z, scale = 1) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.4 * scale, 0.5 * scale, 3 * scale, 8),
    new THREE.MeshStandardMaterial({ color: 0x6b4f3a, roughness: 0.9 })
  );
  trunk.position.y = 1.5 * scale;
  trunk.castShadow = true;
  g.add(trunk);
  for (let i = 0; i < 3; i++) {
    const leaves = new THREE.Mesh(
      new THREE.ConeGeometry((2 - i * 0.4) * scale, 2 * scale, 8),
      new THREE.MeshStandardMaterial({ color: 0x2d6a4f, roughness: 0.8 })
    );
    leaves.position.y = (3.5 + i * 1.3) * scale;
    leaves.castShadow = true;
    g.add(leaves);
  }
  g.position.set(x, 0, z);
  scene.add(g);
  addCylinderCollider(x, z, 0.8 * scale, 4 * scale, 'tree');
}

// Разбросать деревья по миру (50+ штук)
const treePositions = [];
for (let i = 0; i < 80; i++) {
  const angle = Math.random() * Math.PI * 2;
  const dist = 30 + Math.random() * 500;
  const x = Math.cos(angle) * dist;
  const z = Math.sin(angle) * dist;
  // не ставить слишком близко к центру
  if (Math.abs(x) < 15 && Math.abs(z) < 15) continue;
  const scale = 0.8 + Math.random() * 1.2;
  createTree(x, z, scale);
  treePositions.push({x, z, type: 'tree'});
}

// ========= ДОМА И КВАРТИРЫ =========
function createHouse(x, z, color, rotY = 0, size = 1) {
  const g = new THREE.Group();
  const w = 12 * size, h = 8 * size, d = 10 * size;
  const walls = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 })
  );
  walls.position.y = h / 2;
  walls.castShadow = true;
  walls.receiveShadow = true;
  g.add(walls);
  addBoxCollider(walls, 'house');
  
  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(w * 0.75, 4 * size, 4),
    new THREE.MeshStandardMaterial({ color: 0x8b2020, roughness: 0.6 })
  );
  roof.position.y = h + 2 * size;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  g.add(roof);
  
  const door = new THREE.Mesh(
    new THREE.BoxGeometry(2 * size, 3.5 * size, 0.2),
    new THREE.MeshStandardMaterial({ color: 0x4a2810, roughness: 0.5 })
  );
  door.position.set(0, 1.75 * size, d/2 + 0.05);
  g.add(door);
  
  const windowMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, roughness: 0.1, emissive: 0x224466, emissiveIntensity: 0.3 });
  for (let sx of [-1, 1]) {
    const win = new THREE.Mesh(new THREE.BoxGeometry(1.8 * size, 1.8 * size, 0.2), windowMat);
    win.position.set(sx * 3.5 * size, 5 * size, d/2 + 0.05);
    g.add(win);
    const win2 = new THREE.Mesh(new THREE.BoxGeometry(1.8 * size, 1.8 * size, 0.2), windowMat);
    win2.position.set(sx * 3.5 * size, 5 * size, -d/2 - 0.05);
    g.add(win2);
  }
  
  const chimney = new THREE.Mesh(
    new THREE.BoxGeometry(size, 2 * size, size),
    new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.8 })
  );
  chimney.position.set(3 * size, h + 3 * size, -2 * size);
  chimney.castShadow = true;
  g.add(chimney);
  
  g.position.set(x, 0, z);
  g.rotation.y = rotY;
  scene.add(g);
  return g;
}

function createApartment(x, z, floors, color, rotY = 0) {
  const g = new THREE.Group();
  const w = 14, floorH = 3, d = 12;
  const h = floors * floorH;
  
  const walls = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color: color, roughness: 0.6 })
  );
  walls.position.y = h / 2;
  walls.castShadow = true;
  walls.receiveShadow = true;
  g.add(walls);
  addBoxCollider(walls, 'apartment');
  
  // Окна
  const windowMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, roughness: 0.1, emissive: 0x334466, emissiveIntensity: 0.3 });
  for (let f = 0; f < floors; f++) {
    for (let wx = 0; wx < 4; wx++) {
      const win = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.8, 0.2), windowMat);
      win.position.set(-4.5 + wx * 3, 1.5 + f * floorH, d/2 + 0.05);
      g.add(win);
      const win2 = win.clone();
      win2.position.z = -d/2 - 0.05;
      g.add(win2);
    }
  }
  
  // Крыша
  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(w + 1, 0.5, d + 1),
    new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 })
  );
  roof.position.y = h + 0.25;
  roof.castShadow = true;
  g.add(roof);
  
  g.position.set(x, 0, z);
  g.rotation.y = rotY;
  scene.add(g);
  return g;
}

  windshield.rotation.x = -0.5;
  g.add(windshield);
  
  const rearGlass = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 0.08), glassMat);
  rearGlass.position.set(0, 1.35, -1.45);
  rearGlass.rotation.x = 0.5;
  g.add(rearGlass);
  
  for (let side of [-1, 1]) {
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.22, 0.1), new THREE.MeshStandardMaterial({ color: 0xffffee, emissive: 0xffffaa, emissiveIntensity: 0.5 }));
    head.position.set(side * 0.62, 0.92, 2.31);

    tail.position.set(side * 0.65, 0.95, -2.31);
    g.add(tail);
  }
  
  const grille = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.22, 0.08), chromeMat);
  grille.position.set(0, 0.8, 2.31);

    g.add(wheel);
  }
  
  g.position.set(x, 0, z);
  g.rotation.y = rotY;
  scene.add(g);
  return g;
}

  const shirtMat2 = new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 });

  const hairMat2 = new THREE.MeshStandardMaterial({ color: 0x3a2a10, roughness: 0.9 });
  
  const torso2 = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.2, 1.0), shirtMat2);
  torso2.position.y = 3.2;
  torso2.castShadow = true;
  g.add(torso2);
  
  const head2 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.3, 1.2), skinMat2);
  head2.position.y = 5.0;
  head2.castShadow = true;
  g.add(head2);
  
  const hair2 = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.5, 1.3), hairMat2);
  hair2.position.y = 5.85;
  g.add(hair2);
  
  for (let s of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 12), new THREE.MeshStandardMaterial({ color: 0xffffff }));
    eye.position.set(s * 0.3, 5.1, 0.6);
    g.add(eye);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 10), new THREE.MeshStandardMaterial({ color: 0x222222 }));
    pupil.position.set(s * 0.3, 5.1, 0.74);
    g.add(pupil);
  }
  
  const smile = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, 0.1), new THREE.MeshStandardMaterial({ color: 0x222222 }));
  smile.position.set(0, 4.7, 0.65);
  g.add(smile);
  
  for (let s of [-1, 1]) {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.6, 2.2, 0.6), shirtMat2);
    arm.position.set(s * 1.2, 3.2, 0);
    arm.castShadow = true;
    g.add(arm);
    const hand = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.55, 0.55), skinMat2);
    hand.position.set(s * 1.2, 1.9, 0);
    g.add(hand);
  }
  
  for (let s of [-1, 1]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.7, 2.4, 0.75), pantsMat2);
    leg.position.set(s * 0.55, 1.2, 0);

  g.scale.set(scale, scale, scale);
  g.position.set(x, 0, z);
  g.rotation.y = rotY;
  scene.add(g);
  return g;
}

// ========= ФИЗИКА ИГРОКА =========
const PLAYER_RADIUS = 0.5;
const PLAYER_HEIGHT = 3.0;
const WALK_SPEED = 5.5;
const GRAVITY = 25;
let velocityY = 0, grounded = true;
let moveX = 0, moveZ = 0;
let cameraYaw = 0, cameraPitch = 0.4;
let targetYaw = 0, targetPitch = 0.4;

function isColliding(px, py, pz, tag = 'static') {
  for (let i = 0; i < colliders.length; i++) {
    const col = colliders[i];
    if (col.type === 'box') {
      const box = col.getBox();
      if (px + PLAYER_RADIUS > box.min.x && px - PLAYER_RADIUS < box.max.x &&
          pz + PLAYER_RADIUS > box.min.z && pz - PLAYER_RADIUS < box.max.z) {
        if (py + PLAYER_HEIGHT > box.min.y && py < box.max.y) return true;
      }
    } else if (col.type === 'cylinder') {
      const pos = col.getPosition();
      const dx = px - pos.x, dz = pz - pos.z;
      const r = col.radius + PLAYER_RADIUS;
      if (dx * dx + dz * dz < r * r) {
        if (py + PLAYER_HEIGHT > pos.y - col.height/2 && py < pos.y + col.height/2) return true;
      }
    }
  }
  return false;
}

function getGroundY(px, py, pz) {
  let groundY = 0, onGround = false;
  for (let i = 0; i < colliders.length; i++) {
    const col = colliders[i];
    if (col.type === 'box') {
      const box = col.getBox();
      if (px + PLAYER_RADIUS > box.min.x && px - PLAYER_RADIUS < box.max.x &&
          pz + PLAYER_RADIUS > box.min.z && pz - PLAYER_RADIUS < box.max.z) {
        if (py <= box.max.y && py > box.max.y - 1.0) {
          groundY = Math.max(groundY, box.max.y);
          onGround = true;
        }
      }
    }
  }
  return { groundY, onGround };
}

function updatePlayerPhysics(delta) {
  if (isDroneMode || droneExploded) return;
  let x = moveX, z = moveZ;
  const len = Math.sqrt(x * x + z * z);
  if (len > 1) { x /= len; z /= len; }
  const moving = Math.abs(x) > 0.05 || Math.abs(z) > 0.05;
  if (moving) {
    const forward = new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw));
    const right = new THREE.Vector3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw));
    const dir = new THREE.Vector3().addScaledVector(forward, -z).addScaledVector(right, x);
    if (dir.length() > 0.1) {
      dir.normalize();
      player.position.x += dir.x * WALK_SPEED * delta;
      if (isColliding(player.position.x, player.position.y, player.position.z)) {
        player.position.x -= dir.x * WALK_SPEED * delta;
      }
      player.position.z += dir.z * WALK_SPEED * delta;
      if (isColliding(player.position.x, player.position.y, player.position.z)) {
        player.position.z -= dir.z * WALK_SPEED * delta;
      }
      player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, Math.atan2(dir.x, dir.z), delta * 12);
    }
  }
  velocityY -= GRAVITY * delta;
  player.position.y += velocityY * delta;
  const g = getGroundY(player.position.x, player.position.y, player.position.z);
  if (velocityY <= 0 && player.position.y <= g.groundY && g.onGround) {
    player.position.y = g.groundY;
    velocityY = 0;
    grounded = true;
  } else if (player.position.y <= 0) {
    player.position.y = 0;
    velocityY = 0;
    grounded = true;
  } else grounded = false;

  if (moving && grounded) {
    const t = performance.now() * 0.01;
    const swing = Math.sin(t) * 0.5;
    arms[0].rotation.x = swing;
    arms[1].rotation.x = -swing;
    legs[0].rotation.x = -swing;
    legs[1].rotation.x = swing;
    // Плащ колышется
    capeCloth.rotation.x = 0.12 + Math.sin(t * 1.3) * 0.08;
  } else {
    arms.forEach(a => a.rotation.x *= 0.9);
    legs.forEach(l => l.rotation.x *= 0.9);
    capeCloth.rotation.x *= 0.95;
  }
}

// ========= ФИЗИКА ДРОНА + КОЛЛИЗИИ СО ВСЕМ =========
function checkDroneCollision() {
  if (!isDroneMode) return false;
  const dp = droneGroup.position;
  const DRONE_R = 1.3;
  
  for (let i = 0; i < colliders.length; i++) {
    const col = colliders[i];
    // Пропускаем деревья — сквозь них можно пролететь на высоте
    if (col.tag === 'tree' && dp.y > 3) continue;
    
    if (col.type === 'box') {
      const box = col.getBox();
      if (dp.x + DRONE_R > box.min.x && dp.x - DRONE_R < box.max.x &&
          dp.z + DRONE_R > box.min.z && dp.z - DRONE_R < box.max.z &&
          dp.y + 0.5 > box.min.y && dp.y - 0.3 < box.max.y) {
        if (droneSpeed > 4) return col.tag;
      }
    } else if (col.type === 'cylinder') {
      const pos = col.getPosition();
      const dx = dp.x - pos.x, dz = dp.z - pos.z;
      const r = col.radius + DRONE_R;
      if (dx * dx + dz * dz < r * r) {
        if (dp.y > pos.y - col.height/2 - 0.5 && dp.y < pos.y + col.height/2 + 0.5) {
          if (droneSpeed > 4) return col.tag;
        }
      }
    }
  }
  
  // Удар о землю на большой скорости
  if (dp.y <= 0.3 && droneSpeed > 6) return 'ground';
  return false;
}

function updateDronePhysics(delta) {
  if (!isDroneMode || droneExploded) return;
  let x = droneMoveX, z = droneMoveZ;
  const len = Math.sqrt(x * x + z * z);
  if (len > 1) { x /= len; z /= len; }
  const forward = new THREE.Vector3(-Math.sin(droneYaw), 0, -Math.cos(droneYaw));
  const right = new THREE.Vector3(Math.cos(droneYaw), 0, -Math.sin(droneYaw));
  const dir = new THREE.Vector3().addScaledVector(forward, -z).addScaledVector(right, x);
  if (dir.length() > 0.1) {
    dir.normalize();
    droneGroup.position.x += dir.x * 18.0 * delta;
    droneGroup.position.z += dir.z * 18.0 * delta;
    droneSpeed = 18.0;
  } else {
    droneSpeed *= 0.92;
  }
  if (Math.abs(droneGroup.position.y - droneTargetHeight) > 0.02) {
    const d = droneTargetHeight > droneGroup.position.y ? 1 : -1;
    droneGroup.position.y += d * 5.0 * delta;
    if (Math.abs(droneGroup.position.y - droneTargetHeight) <= 0.05) {
      droneGroup.position.y = droneTargetHeight;
    }
  }
  droneGroup.rotation.y = droneYaw;
  
  const hit = checkDroneCollision();
  if (hit) {
    const names = {
      'house': 'дом', 'apartment': 'многоэтажку', 'farm': 'постройку фермы',
      'tractor': 'трактор', 'car': 'машину', 'tank': 'танк',
      'helicopter': 'вертолёт', 'airplane': 'самолёт', 'playground': 'площадку',
      'ground': 'землю'
    };
    explodeDrone(names[hit] || 'объект');
  }
}

const explosionGroup = new THREE.Group();
explosionGroup.visible = false;
scene.add(explosionGroup);

function explodeDrone(targetName) {
  const pos = droneGroup.position.clone();
  explosionGroup.position.copy(pos);
  explosionGroup.visible = true;
  explosionGroup.userData.life = 0;
  explosionGroup.userData.maxLife = 2.5;
  while (explosionGroup.children.length) explosionGroup.remove(explosionGroup.children[0]);

  const fireball = new THREE.Mesh(
    new THREE.SphereGeometry(2, 16, 16),
    new THREE.MeshStandardMaterial({ color: 0xff5500, emissive: 0xff2200, emissiveIntensity: 2.5, transparent: true, opacity: 1 })
  );
  fireball.userData.isFireball = true;
  explosionGroup.add(fireball);

  const colors = [0xff5500, 0xffaa00, 0xff2200, 0x884400, 0xffffff, 0xffcc00];
  for (let i = 0; i < 180; i++) {
    const size = 0.15 + Math.random() * 0.6;
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(size, 6, 6),
      new THREE.MeshStandardMaterial({
        color: colors[Math.floor(Math.random() * colors.length)],
        emissive: 0xff4400, emissiveIntensity: 1.5, transparent: true, opacity: 1
      })
    );
    p.position.set((Math.random() - 0.5) * 4, Math.random() * 5, (Math.random() - 0.5) * 4);
    p.userData.velocity = new THREE.Vector3(
      (Math.random() - 0.5) * 18, Math.random() * 22 + 5, (Math.random() - 0.5) * 18
    );
    explosionGroup.add(p);
  }

  const smoke = new THREE.Mesh(
    new THREE.SphereGeometry(2.5, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0x333333, transparent: true, opacity: 0.9 })
  );
  smoke.position.y = 1;
  smoke.userData.isSmoke = true;
  explosionGroup.add(smoke);

  droneGroup.visible = false;
  droneExploded = true;
  droneRespawnTimer = DRONE_RESPAWN_TIME;
  exitDroneMode(true);
  showNotification(`💥 Врезался в ${targetName}!\nРеспавн через 3 сек`);
}

function updateExplosion(delta) {
  if (!explosionGroup.visible) return;
  explosionGroup.userData.life += delta;
  if (explosionGroup.userData.life >= explosionGroup.userData.maxLife) {
    explosionGroup.visible = false;
    return;
  }
  const lifeRatio = explosionGroup.userData.life / explosionGroup.userData.maxLife;
  explosionGroup.children.forEach(child => {
    if (child.userData.velocity) {
      child.position.add(child.userData.velocity.clone().multiplyScalar(delta));
      child.userData.velocity.y -= 18 * delta;
    }
    if (child.userData.isSmoke) {
      child.scale.setScalar(1 + lifeRatio * 5);
      child.material.opacity = 0.9 * (1 - lifeRatio);
    }
    if (child.userData.isFireball) {
      child.scale.setScalar(1 + lifeRatio * 3);
      child.material.opacity = 1 - lifeRatio * 0.9;
    }
  });
}

function updateDroneRespawn(delta) {
  if (!droneExploded) return;
  droneRespawnTimer -= delta;
  if (droneRespawnTimer <= 0) {
    droneGroup.position.copy(DRONE_SPAWN);
    droneGroup.position.y = 0.3;
    droneGroup.rotation.set(0, 0, 0);
    droneGroup.visible = true;
    droneExploded = false;
    droneSpeed = 0;
    droneTargetHeight = 0.3;
    showNotification('🚁 Дрон восстановлен!');
  }
}

function updatePlayerCamera(delta) {
  if (isDroneMode) return;
  const smooth = 1 - Math.pow(0.002, delta);
  cameraYaw = THREE.MathUtils.lerp(cameraYaw, targetYaw, smooth);
  cameraPitch = THREE.MathUtils.lerp(cameraPitch, targetPitch, smooth);
  const dist = 7.5;
  const target = new THREE.Vector3(player.position.x, player.position.y + 2.5, player.position.z);
  const offset = new THREE.Vector3(
    Math.sin(cameraYaw) * dist * Math.cos(cameraPitch),
    3.5 + Math.sin(cameraPitch) * dist,
    Math.cos(cameraYaw) * dist * Math.cos(cameraPitch)
  );
  camera.position.lerp(target.clone().add(offset), 1 - Math.pow(0.0005, delta));
  if (camera.position.y < 0.8) camera.position.y = 0.8;
  camera.lookAt(target);
}

function updateDroneCamera(delta) {
  if (!isDroneMode) return;
  const smooth = 1 - Math.pow(0.001, delta);
  droneYaw = THREE.MathUtils.lerp(droneYaw, droneTargetYaw, smooth);
  dronePitch = THREE.MathUtils.lerp(dronePitch, droneTargetPitch, smooth);
  camera.position.copy(droneGroup.position);
  camera.position.y += 0.3;
  camera.lookAt(new THREE.Vector3(
    droneGroup.position.x - Math.sin(droneYaw) * Math.cos(dronePitch),
    droneGroup.position.y + 0.3 + Math.sin(dronePitch),
    droneGroup.position.z - Math.cos(droneYaw) * Math.cos(dronePitch)
  ));
}

function getFocus() {
  return isDroneMode ? droneGroup.position : player.position;
}

// ========= ДЖОЙСТИКИ =========
const MAX_RADIUS = 42;
let joyActive = false, joyId = null, joyCX = 0, joyCY = 0;
let droneJoyActive = false, droneJoyId = null, droneJoyCX = 0, droneJoyCY = 0;

joystickArea.addEventListener('pointerdown', (e) => {
  if (isDroneMode) return;
  e.preventDefault();
  joyCX = e.clientX; joyCY = e.clientY;
  joystick.style.left = joyCX + 'px';
  joystick.style.top = joyCY + 'px';
  joystick.classList.add('active');
  joystick.style.display = 'block';
  joyActive = true;
  joyId = e.pointerId;
  e.target.setPointerCapture(e.pointerId);
  updateJoy(e.clientX, e.clientY);
});

droneJoystickArea.addEventListener('pointerdown', (e) => {
  if (!isDroneMode) return;
  e.preventDefault();
  droneJoyCX = e.clientX; droneJoyCY = e.clientY;
  droneJoystick.style.left = droneJoyCX + 'px';
  droneJoystick.style.top = droneJoyCY + 'px';
  droneJoystick.classList.add('active');
  droneJoystick.style.display = 'block';
  droneJoyActive = true;
  droneJoyId = e.pointerId;
  e.target.setPointerCapture(e.pointerId);
  updateDroneJoy(e.clientX, e.clientY);
});

document.addEventListener('pointermove', (e) => {
  if (joyActive && e.pointerId === joyId) updateJoy(e.clientX, e.clientY);
  if (droneJoyActive && e.pointerId === droneJoyId) updateDroneJoy(e.clientX, e.clientY);
});

document.addEventListener('pointerup', (e) => {
  if (e.pointerId === joyId) {
    joyActive = false; joyId = null;
    joystick.classList.remove('active');
    joystick.style.display = 'none';
    stick.style.transform = 'translate3d(0,0,0)';
    moveX = 0; moveZ = 0;
  }
  if (e.pointerId === droneJoyId) {
    droneJoyActive = false; droneJoyId = null;
    droneJoystick.classList.remove('active');
    droneJoystick.style.display = 'none';
    droneStick.style.transform = 'translate3d(0,0,0)';
    droneMoveX = 0; droneMoveZ = 0;
  }
});

function updateJoy(cx, cy) {
  let dx = cx - joyCX, dy = cy - joyCY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist > MAX_RADIUS) { dx = dx / dist * MAX_RADIUS; dy = dy / dist * MAX_RADIUS; }
  stick.style.transform = `translate3d(${dx}px,${dy}px,0)`;
  moveX = dx / MAX_RADIUS;
  moveZ = dy / MAX_RADIUS;
}
function updateDroneJoy(cx, cy) {
  let dx = cx - droneJoyCX, dy = cy - droneJoyCY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist > MAX_RADIUS) { dx = dx / dist * MAX_RADIUS; dy = dy / dist * MAX_RADIUS; }
  droneStick.style.transform = `translate3d(${dx}px,${dy}px,0)`;
  droneMoveX = dx / MAX_RADIUS;
  droneMoveZ = dy / MAX_RADIUS;
}

droneUpBtn.addEventListener('pointerup', () => droneUpPressed = false);
droneUpBtn.addEventListener('pointerleave', () => droneUpPressed = false);
droneDownBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); droneDownPressed = true; });
droneDownBtn.addEventListener('pointerup', () => droneDownPressed = false);
droneDownBtn.addEventListener('pointerleave', () => droneDownPressed = false);

function updateDroneVertical(delta) {
  if (!isDroneMode) return;
  if (droneUpPressed) droneTargetHeight += 5.0 * delta;
  if (droneDownPressed) droneTargetHeight = Math.max(droneTargetHeight - 5.0 * delta, 0.4);

// Свайп камеры
let camActive = false, camId = null, lastCamX = 0, lastCamY = 0;
let droneCamActive = false, droneCamId = null, dLastCamX = 0, dLastCamY = 0;

document.addEventListener('pointerdown', (e) => {
  if (e.clientX < window.innerWidth * 0.5) return;
  if (e.target.closest('button')) return;
  if (isDroneMode) {
    droneCamActive = true;
    droneCamId = e.pointerId;
    dLastCamX = e.clientX; dLastCamY = e.clientY;
    e.target.setPointerCapture(e.pointerId);
  } else {
    camActive = true;
    camId = e.pointerId;
    lastCamX = e.clientX; lastCamY = e.clientY;
    e.target.setPointerCapture(e.pointerId);
  }
});
document.addEventListener('pointermove', (e) => {
  if (camActive && e.pointerId === camId) {
    targetYaw -= (e.clientX - lastCamX) * 0.005;
    targetPitch = THREE.MathUtils.clamp(targetPitch + (e.clientY - lastCamY) * 0.005, -0.5, 1.2);
    lastCamX = e.clientX; lastCamY = e.clientY;
  }
  if (droneCamActive && e.pointerId === droneCamId) {
    droneTargetYaw -= (e.clientX - dLastCamX) * 0.005;
    droneTargetPitch = THREE.MathUtils.clamp(droneTargetPitch + (e.clientY - dLastCamY) * 0.005, -Math.PI / 2, Math.PI / 2);
    dLastCamX = e.clientX; dLastCamY = e.clientY;
  }
});
document.addEventListener('pointerup', (e) => {
  if (e.pointerId === camId) { camActive = false; camId = null; }
  if (e.pointerId === droneCamId) { droneCamActive = false; droneCamId = null; }
});

// ========= МИНИ-КАРТА =========
function drawMiniMap() {
  const focus = getFocus();
  miniMapCanvas.width = 140;
  miniMapCanvas.height = 140;
  miniCtx.clearRect(0, 0, 140, 140);
  miniCtx.save();
  miniCtx.beginPath();
  miniCtx.arc(70, 70, 65, 0, Math.PI * 2);
  miniCtx.clip();
  miniCtx.fillStyle = '#4CAF50';
  miniCtx.fillRect(0, 0, 140, 140);
  
  const scale = 0.15;
  
  // Дороги
  miniCtx.fillStyle = '#444444';
  miniCtx.fillRect(0, 69, 140, 2);
  miniCtx.fillRect(69, 0, 2, 140);
  
  // Дома
  miniCtx.fillStyle = '#c9876d';
  [
    [130, 150], [170, 160], [150, 190], [200, 130], [110, 180], [190, 200]
  ].forEach(([x, z]) => {
    const mx = (x - focus.x) * scale + 70;
    const mz = (z - focus.z) * scale + 70;
    miniCtx.fillRect(mx - 2, mz - 2, 4, 4);
  });
  
  // Многоэтажки
  miniCtx.fillStyle = '#888899';
  [[250, 150], [280, 180], [250, 220]].forEach(([x, z]) => {
    const mx = (x - focus.x) * scale + 70;
    const mz = (z - focus.z) * scale + 70;
    miniCtx.fillRect(mx - 3, mz - 3, 6, 6);
  });
  
  // Фермы
  miniCtx.fillStyle = '#8B2020';
  [[-180, -220], [-240, -150]].forEach(([x, z]) => {
    const mx = (x - focus.x) * scale + 70;
    const mz = (z - focus.z) * scale + 70;
    miniCtx.fillRect(mx - 3, mz - 3, 6, 6);
  });
  
  // Танки
  miniCtx.fillStyle = '#4b692f';
  [[-220, 50], [-240, 80], [-200, 90]].forEach(([x, z]) => {
    const mx = (x - focus.x) * scale + 70;
    const mz = (z - focus.z) * scale + 70;
    miniCtx.fillRect(mx - 2, mz - 2, 4, 4);
  });
  
  // Вертолёты
  miniCtx.fillStyle = '#556b2f';
  [[-180, 100], [-160, 120]].forEach(([x, z]) => {
    const mx = (x - focus.x) * scale + 70;
    const mz = (z - focus.z) * scale + 70;
    miniCtx.beginPath();
    miniCtx.arc(mx, mz, 2, 0, Math.PI * 2);
    miniCtx.fill();
  });
  
  // Самолёты
  miniCtx.fillStyle = '#ffffff';
  [[280, -80], [300, -60]].forEach(([x, z]) => {
    const mx = (x - focus.x) * scale + 70;
    const mz = (z - focus.z) * scale + 70;
    miniCtx.beginPath();
    miniCtx.arc(mx, mz, 3, 0, Math.PI * 2);
    miniCtx.fill();
  });
  
  // Площадка
  miniCtx.fillStyle = '#7FB3D5';
  const pgx = (200 - focus.x) * scale + 70;
  const pgz = (-180 - focus.z) * scale + 70;
  miniCtx.beginPath();
  miniCtx.arc(pgx, pgz, 4, 0, Math.PI * 2);
  miniCtx.fill();
  
  // Гиганты
  miniCtx.fillStyle = '#ff6600';
  [[60, -30], [-100, -150], [220, 80]].forEach(([x, z]) => {
    const mx = (x - focus.x) * scale + 70;
    const mz = (z - focus.z) * scale + 70;
    miniCtx.beginPath();
    miniCtx.arc(mx, mz, 3, 0, Math.PI * 2);
    miniCtx.fill();
  });
  
  // Машины
  miniCtx.fillStyle = '#ffcc00';
  [[50, 0], [-50, 0], [0, 50], [0, -50], [120, 120], [-120, 120], [80, -80], [-80, 80]].forEach(([x, z]) => {
    const mx = (x - focus.x) * scale + 70;
    const mz = (z - focus.z) * scale + 70;
    miniCtx.fillRect(mx - 1.5, mz - 1.5, 3, 3);
  });
  
  // Игрок
  miniCtx.fillStyle = '#ff0000';
  miniCtx.beginPath();
  miniCtx.arc(70, 70, 4, 0, Math.PI * 2);
  miniCtx.fill();
  
  miniCtx.restore();
}

function updateCompass() {
  const yaw = isDroneMode ? droneYaw : cameraYaw;
  const deg = ((yaw * 180 / Math.PI) % 360 + 360) % 360;
  const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
  const idx = Math.round(deg / 45) % 8;
  compass.textContent = `${dirs[idx]} ${Math.round(deg)}°`;
}

// ========= СТАРТ =========
const startButton = document.getElementById('startButton');
const rotateHint = document.getElementById('rotateHint');

function checkOrientation() {
  if (window.innerWidth > window.innerHeight) {
    startButton.classList.remove('disabled');
    rotateHint.style.display = 'none';
  } else {
    startButton.classList.add('disabled');
    rotateHint.style.display = 'block';
  }
}
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  checkOrientation();
});
checkOrientation();

startButton.addEventListener('click', async () => {
  if (startButton.classList.contains('disabled')) return;
  try {
    if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
    if (screen.orientation?.lock) await screen.orientation.lock('landscape');
  } catch (e) {}
  gameStarted = true;
  document.getElementById('startScreen').style.display = 'none';
});

// ========= ГЛАВНЫЙ ЦИКЛ =========
let lastTime = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const delta = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (gameStarted) {
    const focus = getFocus();
    sun.position.set(focus.x + 100, 120, focus.z + 50);
    sun.target.position.copy(focus);
    sun.target.updateMatrixWorld();

    updateDroneRespawn(delta);
    updateExplosion(delta);

    if (isDroneMode && !droneExploded) {
      updateDronePhysics(delta);
      updateDroneVertical(delta);
      dronePropellerAngle += 0.6;
      droneArms.forEach((prop, i) => {
        prop.rotation.y = dronePropellerAngle * (i % 2 === 0 ? 1 : -1);
      });
      droneGroup.rotation.z = Math.sin(now * 0.003) * 0.05;
      droneGroup.rotation.x = Math.cos(now * 0.0025) * 0.05;
      updateDroneCamera(delta);
    } else {
      updatePlayerPhysics(delta);
      updatePlayerCamera(delta);
      checkDroneDistance();
    }

    // Вращение карусели
    if (carousel) carousel.rotation.y += delta * 0.8;
    
    // Вращение роторов вертолётов
    if (heli1.userData.rotor) heli1.userData.rotor.rotation.y += delta * 15;
    if (heli2.userData.rotor) heli2.userData.rotor.rotation.y -= delta * 12;
    
    drawMiniMap();
    updateCompass();
  }

  renderer.render(scene, camera);
}

animate();
</script>
