<body>

            <button id="closeShop">❌ Закрыть</button>

    </div>

    <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 60, 250);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.getElementById('game').appendChild(renderer.domElement);

        const ambient = new THREE.AmbientLight(0x8899bb, 0.5);
        scene.add(ambient);
        const hemi = new THREE.HemisphereLight(0x87CEEB, 0x3a7d44, 1.2);
        scene.add(hemi);
        const sun = new THREE.DirectionalLight(0xffeedd, 2.8);
        sun.position.set(40, 60, 30);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 1024;
        sun.shadow.mapSize.height = 1024;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 200;
        sun.shadow.camera.left = -60;
        sun.shadow.camera.right = 60;
        sun.shadow.camera.top = 60;
        sun.shadow.camera.bottom = -60;
        sun.shadow.bias = -0.001;
        scene.add(sun);
        scene.add(sun.target);

        const moon = new THREE.Mesh(new THREE.SphereGeometry(5, 32, 32), new THREE.MeshStandardMaterial({ color: 0xf5f5dc, emissive: 0x222233, emissiveIntensity: 0.3, roughness: 0.9 }));
        moon.position.set(-50, 80, -50);
        scene.add(moon);

        const starsGeometry = new THREE.BufferGeometry();
        const posArray = new Float32Array(1000 * 3);
        for(let i = 0; i < 1000 * 3; i++) posArray[i] = (Math.random() - 0.5) * 400;
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starsMaterial = new THREE.PointsMaterial({ size: 0.5, color: 0xffffff, transparent: true, opacity: 0 });
        scene.add(new THREE.Points(starsGeometry, starsMaterial));

        const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ color: 0x4CAF50, roughness: 0.9 }));
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const concreteMat = new THREE.MeshStandardMaterial({ color: 0x9e9e9e, roughness: 0.7 });
        const darkConcreteMat = new THREE.MeshStandardMaterial({ color: 0x7a7a7a, roughness: 0.65 });
        const metalMat = new THREE.MeshStandardMaterial({ color: 0xc0c0c0, roughness: 0.2, metalness: 0.9 });
        const graniteMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.5 });
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.6 });
        const treeTrunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4f3a, roughness: 0.9 });
        const treeLeavesMat = new THREE.MeshStandardMaterial({ color: 0x2d6a4f, roughness: 0.8 });
        const rockMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.9, flatShading: true });
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.95 });
        const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.9 });
        const lampHeadMat = new THREE.MeshStandardMaterial({ color: 0xffffcc, emissive: 0xffdd88, emissiveIntensity: 0, roughness: 0.3 });

        // Материалы для детской площадки
        const playRedMat = new THREE.MeshStandardMaterial({color: 0xE74C3C, roughness: 0.5});
        const playYellowMat = new THREE.MeshStandardMaterial({color: 0xF1C40F, roughness: 0.5});
        const playBlueMat = new THREE.MeshStandardMaterial({color: 0x3498DB, roughness: 0.5});
        const playGreenMat = new THREE.MeshStandardMaterial({color: 0x2ECC71, roughness: 0.5});
        const playMetalMat = new THREE.MeshStandardMaterial({color: 0xBDC3C7, roughness: 0.3, metalness: 0.7});
        const playSandMat = new THREE.MeshStandardMaterial({color: 0xE8C872, roughness: 0.95});
        const playWoodMat = new THREE.MeshStandardMaterial({color: 0xA0522D, roughness: 0.7});

        const colliders = [];
        function addBoxCollider(mesh) { colliders.push({ type: 'box', mesh: mesh, getBox: () => new THREE.Box3().setFromObject(mesh) }); }
        function addCylinderCollider(mesh, radius, height) { colliders.push({ type: 'cylinder', mesh: mesh, radius: radius, height: height, getPosition: () => mesh.getWorldPosition(new THREE.Vector3()) }); }
        function addSphereCollider(mesh, radius) { colliders.push({ type: 'sphere', mesh: mesh, radius: radius, getPosition: () => mesh.getWorldPosition(new THREE.Vector3()) }); }
        function addStaticCylinder(x, z, radius, height) { colliders.push({ type: 'cylinder', radius: radius, height: height, getPosition: () => new THREE.Vector3(x, height/2, z) }); }
        function addStaticBox(x1,y1,z1,x2,y2,z2){ const b = new THREE.Box3(new THREE.Vector3(x1,y1,z1), new THREE.Vector3(x2,y2,z2)); colliders.push({ type: 'box', getBox: () => b }); }
        function addBuildingCollider(x, z, w, h, d, rotY) {
            const cos = Math.abs(Math.cos(rotY)), sin = Math.abs(Math.sin(rotY));
            const hw = (w * cos + d * sin) / 2;
            const hd = (w * sin + d * cos) / 2;
            addStaticBox(x - hw, 0, z - hd, x + hw, h, z + hd);
        }

        function mat4(x,y,z, ry=0, sx=1,sy=1,sz=1, rx=0, rz=0){
            const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,rz));
            return new THREE.Matrix4().compose(new THREE.Vector3(x,y,z), q, new THREE.Vector3(sx,sy,sz));
        }
        function rotOffset(ry, lx, lz){ return [lx*Math.cos(ry)+lz*Math.sin(ry), -lx*Math.sin(ry)+lz*Math.cos(ry)]; }
        function createInstanced(geo, mat, matrices, colors=null, castShadow=false){
            if (matrices.length === 0) return null;
            const im = new THREE.InstancedMesh(geo, mat, matrices.length);
            matrices.forEach((m,i)=> im.setMatrixAt(i,m));
            if (colors) { colors.forEach((c,i)=> im.setColorAt(i,c)); im.instanceColor.needsUpdate = true; }
            im.castShadow = castShadow;
            im.receiveShadow = true;
            im.instanceMatrix.needsUpdate = true;
            scene.add(im);
            return im;
        }
        const unitBox = new THREE.BoxGeometry(1,1,1);

        const PLATFORM_SIZE = 68;
        const HALF_SIZE = 34;

        const platform = new THREE.Mesh(new THREE.BoxGeometry(PLATFORM_SIZE, 0.5, PLATFORM_SIZE), concreteMat);
        platform.position.set(0, 0.25, 0);
        platform.receiveShadow = true;
        platform.castShadow = true;
        scene.add(platform);
        addBoxCollider(platform);

        for (let side of [-1, 1]) {
            const border1 = new THREE.Mesh(new THREE.BoxGeometry(PLATFORM_SIZE, 0.8, 0.5), concreteMat);
            border1.position.set(0, 0.65, side * HALF_SIZE);
            border1.castShadow = true;
            scene.add(border1);
            addBoxCollider(border1);
            const border2 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.8, PLATFORM_SIZE), concreteMat);
            border2.position.set(side * HALF_SIZE, 0.65, 0);
            border2.castShadow = true;
            scene.add(border2);
            addBoxCollider(border2);
        }

        const bowlGroup = new THREE.Group();
        bowlGroup.position.set(-12, 0.5, -12);
        scene.add(bowlGroup);
        const bowl = new THREE.Mesh(new THREE.SphereGeometry(3, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), darkConcreteMat);
        bowl.scale.y = 0.5;
        bowl.receiveShadow = true;
        bowlGroup.add(bowl);
        addSphereCollider(bowl, 3);

        const mannyPad = new THREE.Mesh(new THREE.BoxGeometry(6, 0.4, 3), graniteMat);
        mannyPad.position.set(-20, 0.7, 15);
        mannyPad.castShadow = true;
        scene.add(mannyPad);
        addBoxCollider(mannyPad);

        const stairsGroup = new THREE.Group();
        stairsGroup.position.set(0, 0.5, 20);
        scene.add(stairsGroup);
        for (let i = 0; i < 4; i++) {
            const step = new THREE.Mesh(new THREE.BoxGeometry(8, 0.5, 2), darkConcreteMat);
            step.position.set(0, i * 0.5 + 0.25, i * 2);
            step.castShadow = true;
            stairsGroup.add(step);
            addBoxCollider(step);
        }
        const slideRail = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 10, 12), metalMat);
        slideRail.rotation.x = Math.atan2(2, 8);
        slideRail.position.set(0, 3, 4);
        stairsGroup.add(slideRail);
        addCylinderCollider(slideRail, 0.2, 10);

        const funbox = new THREE.Mesh(new THREE.BoxGeometry(4, 1.5, 4), woodMat);
        funbox.position.set(15, 1, -15);
        funbox.castShadow = true;
        scene.add(funbox);
        addBoxCollider(funbox);

        const pyramidGroup = new THREE.Group();
        pyramidGroup.position.set(-15, 0.5, -20);
        scene.add(pyramidGroup);
        const pyramidBase = new THREE.Mesh(new THREE.BoxGeometry(5, 1, 5), darkConcreteMat);
        pyramidBase.position.y = 0.5;
        pyramidGroup.add(pyramidBase);
        addBoxCollider(pyramidBase);
        const pyramidTop = new THREE.Mesh(new THREE.BoxGeometry(3, 1.5, 3), concreteMat);
        pyramidTop.position.y = 1.75;
        pyramidGroup.add(pyramidTop);
        addBoxCollider(pyramidTop);

        const dancerGroup = new THREE.Group();
        dancerGroup.position.set(-25, 2.0, -25);
        scene.add(dancerGroup);

        function createSegment(width, height, depth, color, emissive = 0x000000, roughness = 0.4, metalness = 0.7) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), new THREE.MeshStandardMaterial({ color: color, emissive: new THREE.Color(emissive), roughness: roughness, metalness: metalness }));
            mesh.castShadow = true;
            return mesh;
        }

        const number6Group = new THREE.Group();
        number6Group.position.set(-0.9, 0, 0);
        dancerGroup.add(number6Group);
        const segW = 0.4, segD = 0.4, hSeg = 1.2, wTop = 1.1, wMid = 1.1, wBot = 1.2;
        const yTop = 0.75, yMid = 0.0, yBot = -0.75;
        const color6 = 0xff8800, emissive6 = 0x331100;
        const top6 = createSegment(wTop, 0.3, segD, color6, emissive6); top6.position.set(0.35, yTop, 0); number6Group.add(top6);
        const mid6 = createSegment(wMid, 0.3, segD, color6, emissive6); mid6.position.set(0.35, yMid, 0); number6Group.add(mid6);
        const bot6 = createSegment(wBot, 0.3, segD, color6, emissive6); bot6.position.set(0.35, yBot, 0); number6Group.add(bot6);
        const leftTop6 = createSegment(segW, hSeg, segD, color6, emissive6); leftTop6.position.set(0.0, 0.35, 0); number6Group.add(leftTop6);
        const leftBot6 = createSegment(segW, hSeg, segD, color6, emissive6); leftBot6.position.set(0.0, -0.35, 0); number6Group.add(leftBot6);
        const rightBot6 = createSegment(segW, hSeg, segD, color6, emissive6); rightBot6.position.set(0.7, -0.35, 0); number6Group.add(rightBot6);

        const number7Group = new THREE.Group();
        number7Group.position.set(1.1, 0, 0);
        dancerGroup.add(number7Group);
        const color7 = 0x44aaff, emissive7 = 0x002244;
        const top7 = createSegment(1.3, 0.3, segD, color7, emissive7); top7.position.set(0.15, yTop + 0.1, 0); number7Group.add(top7);
        const diagonalSegments = 5, diagStartX = 0.65, diagEndX = -0.35, diagStartY = 0.45, diagEndY = -0.55;
        for (let i = 0; i < diagonalSegments; i++) {

        function createGlowSphere(radius, color, position, parent, emissiveIntensity = 1.0) {

        const mapRoads = [];

        // === ИСПРАВЛЕНИЕ #3: система проверки, чтобы дома не стояли друг в друге ===

            const hz = (w*sin + d*cos)/2;
            const m = 2;
            for (const b of placedBuildings) {
                if (Math.abs(x - b.x) < hx + b.hx + m && Math.abs(z - b.z) < hz + b.hz + m) return false;

        const benchSeatM = [], benchBackM = [], benchLegM = [];
        [[28,20,Math.PI/2], [-28,20,-Math.PI/2], [20,-28,0], [-20,-28,Math.PI],

        function startDroneSound() {
            try {
                if (!droneAudio.ctx) droneAudio.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (droneAudio.ctx.state === 'suspended') droneAudio.ctx.resume();
                droneAudio.gain = droneAudio.ctx.createGain();
                droneAudio.gain.gain.value = 0.12;
                droneAudio.gain.connect(droneAudio.ctx.destination);
                droneAudio.oscs = [];
                [70, 140, 210].forEach((freq, i) => {
                    const osc = droneAudio.ctx.createOscillator();
                    osc.type = i === 0 ? 'sawtooth' : 'square';
                    osc.frequency.value = freq;
                    const g = droneAudio.ctx.createGain();
                    g.gain.value = 0.4 / (i + 1);
                    osc.connect(g);
                    g.connect(droneAudio.gain);
                    osc.start();
                    droneAudio.oscs.push(osc);
                });
            } catch (e) { console.log('Audio not supported'); }
        }
        function stopDroneSound() {
            try {
                droneAudio.oscs.forEach(o => o.stop());
                droneAudio.oscs = [];
                if (droneAudio.gain) droneAudio.gain.disconnect();
                droneAudio.gain = null;
            } catch (e) {}
        }
        function updateDroneSound() {
            if (!droneAudio.gain || droneAudio.oscs.length === 0) return;
            const activity = (Math.abs(droneMoveX) + Math.abs(droneMoveZ)) * 0.5 + (droneUpPressed || droneDownPressed ? 1 : 0);
            const base = 70 + activity * 40;
            droneAudio.oscs[0].frequency.setTargetAtTime(base, droneAudio.ctx.currentTime, 0.1);
            droneAudio.oscs[1].frequency.setTargetAtTime(base * 2, droneAudio.ctx.currentTime, 0.1);
            droneAudio.oscs[2].frequency.setTargetAtTime(base * 3, droneAudio.ctx.currentTime, 0.1);
        }

        function updateTrickSystem(delta) {
            if (!gameStarted || !isSkating || isDroneMode || !isOnSkatePark()) return;

            if (trickTimer >= nextTrickTime && !isPerformingTrick) {
                performRandomTrick();
                trickTimer = 0;
                nextTrickTime = 10 + Math.random()*10;
            }
            if (isPerformingTrick) {
                trickAnimationTime -= delta;
                if (currentTrick === 'backflip') player.rotation.x += delta * 8;
                else if (currentTrick === 'frontflip') player.rotation.x -= delta * 8;
                else if (currentTrick === 'kickflip') player.rotation.z += delta * 12;
                if (trickAnimationTime <= 0) {
                    isPerformingTrick = false;
                    player.rotation.x = 0;
                    player.rotation.z = 0;

        function checkDroneCollision() {
            if (!isDroneMode) return false;
            const dronePos = droneGroup.position.clone();
            dronePos.y += 0.3;
            if (dronePos.y < 0.3 && droneSpeed > 8.0) return true;
            for (let i = 0; i < colliders.length; i++) {
                const col = colliders[i];
                if (col.type === 'box') {
                    const box = col.getBox();
                    if (dronePos.x + 1.2 > box.min.x && dronePos.x - 1.2 < box.max.x &&
                        dronePos.z + 1.2 > box.min.z && dronePos.z - 1.2 < box.max.z) {
                        if (dronePos.y + 1.2 > box.min.y && dronePos.y < box.max.y) {
                            if (droneSpeed > 6.0) return true;
                        }
                    }
                } else if (col.type === 'cylinder') {
                    const pos = col.getPosition();
                    const dx = dronePos.x - pos.x, dz = dronePos.z - pos.z;
                    const radius = col.radius + 1.0;
                    if (dx*dx + dz*dz < radius*radius) {
                        const top = pos.y + col.height/2, bottom = pos.y - col.height/2;
                        if (dronePos.y > bottom && dronePos.y < top && droneSpeed > 6.0) return true;
                    }
                } else if (col.type === 'sphere') {
                    const pos = col.getPosition();
                    const dx = dronePos.x - pos.x, dz = dronePos.z - pos.z;
                    const radius = col.radius + 1.0;
                    if (dx*dx + dz*dz < radius*radius) {
                        if (dronePos.y > pos.y - col.radius && dronePos.y < pos.y + col.radius && droneSpeed > 6.0) return true;
                    }
                }
            }
            return false;
        }

        function updateDronePhysics(delta) {
            if (!gameStarted || !isDroneMode) return;
            let x = droneMoveX, z = droneMoveZ;
            const len = Math.sqrt(x*x + z*z);
            if (len > 1) { x /= len; z /= len; }
            const forward = new THREE.Vector3(-Math.sin(droneYaw), 0, -Math.cos(droneYaw));
            const right = new THREE.Vector3(Math.cos(droneYaw), 0, -Math.sin(droneYaw));
            const dir = new THREE.Vector3().addScaledVector(forward, -z).addScaledVector(right, x);
            if (dir.length() > 0.1) {
                dir.normalize();
                droneGroup.position.x += dir.x * 12.0 * delta;
                droneGroup.position.z += dir.z * 12.0 * delta;
                droneSpeed = 12.0;
            } else droneSpeed *= 0.95;
            if (Math.abs(droneGroup.position.y - droneTargetHeight) > 0.01) {
                const direction = droneTargetHeight > droneGroup.position.y ? 1 : -1;
                droneGroup.position.y += direction * 5.0 * delta;
                if (Math.abs(droneGroup.position.y - droneTargetHeight) <= 0.05) droneGroup.position.y = droneTargetHeight;
            }
            droneGroup.rotation.y = droneYaw;
            if (checkDroneCollision()) exitDroneMode(true);
        }

        function updateDroneCamera(delta) {
            if (!isDroneMode) return;
            const smooth = 1 - Math.pow(0.001, delta);
            droneYaw = THREE.MathUtils.lerp(droneYaw, droneTargetYaw, smooth);
            dronePitch = THREE.MathUtils.lerp(dronePitch, droneTargetPitch, smooth);
            camera.position.copy(droneGroup.position);
            camera.position.y += 0.3;
            camera.lookAt(new THREE.Vector3(
                droneGroup.position.x - Math.sin(droneYaw)*Math.cos(dronePitch),
                droneGroup.position.y + 0.3 + Math.sin(dronePitch),
                droneGroup.position.z - Math.cos(droneYaw)*Math.cos(dronePitch)
            ));
        }

        function updateDroneAnimation() {
            dronePropellerAngle += 0.5;

        }

        let grounded = true, velocityY = 0, moveX = 0, moveZ = 0;
        let cameraYaw = 0, cameraPitch = 0.4, targetYaw = 0, targetPitch = 0.4;
        const GRAVITY = 25, JUMP_FORCE = 9, WALK_SPEED = 5.5, SKATE_SPEED = 12.0, PLAYER_RADIUS = 0.4, PLAYER_HEIGHT = 2.0;
        const keys = {};
        let isSkating = false, walkTime = 0;

        function isColliding(px, py, pz) {
            for (let i = 0; i < colliders.length; i++) {
                const col = colliders[i];
                if (col.type === 'box') {
                    const box = col.getBox();
                    if (px + PLAYER_RADIUS > box.min.x && px - PLAYER_RADIUS < box.max.x &&
                        pz + PLAYER_RADIUS > box.min.z && pz - PLAYER_RADIUS < box.max.z) {
                        if (py + PLAYER_HEIGHT > box.min.y && py < box.max.y) return true;
                    }
                } else if (col.type === 'cylinder') {
                    const pos = col.getPosition();
                    const dx = px - pos.x, dz = pz - pos.z;
                    const radius = col.radius + PLAYER_RADIUS;
                    if (dx*dx + dz*dz < radius*radius) {
                        const top = pos.y + col.height/2, bottom = pos.y - col.height/2;
                        if (py + PLAYER_HEIGHT > bottom && py < top) return true;
                    }
                } else if (col.type === 'sphere') {
                    const pos = col.getPosition();
                    const dx = px - pos.x, dz = pz - pos.z;
                    const radius = col.radius + PLAYER_RADIUS;
                    if (dx*dx + dz*dz < radius*radius) {
                        if (py + PLAYER_HEIGHT > pos.y - col.radius && py < pos.y + col.radius) return true;
                    }
                }
            }
            return false;
        }

        function getGroundY(px, py, pz) {
            let groundY = 0, onGround = false;
            if (Math.abs(px) < HALF_SIZE && Math.abs(pz) < HALF_SIZE) { groundY = 0.5; onGround = true; }
            for (let i = 0; i < colliders.length; i++) {
                const col = colliders[i];
                if (col.type === 'box') {
                    const box = col.getBox();
                    if (px + PLAYER_RADIUS > box.min.x && px - PLAYER_RADIUS < box.max.x &&
                        pz + PLAYER_RADIUS > box.min.z && pz - PLAYER_RADIUS < box.max.z) {
                        if (py <= box.max.y && py > box.max.y - 1.0) { groundY = Math.max(groundY, box.max.y); onGround = true; }
                    }
                } else if (col.type === 'sphere') {
                    const pos = col.getPosition();
                    const dx = px - pos.x, dz = pz - pos.z;
                    if (dx*dx + dz*dz < (col.radius+0.1)*(col.radius+0.1)) {
                        const top = pos.y + col.radius;
                        if (py <= top && py > top - 2.0) { groundY = Math.max(groundY, top); onGround = true; }
                    }
                }
            }
            return { groundY, onGround };
        }

        function updatePlayerPhysics(delta) {
            if (!gameStarted || isDroneMode) return;
            let x = moveX, z = moveZ;
            if (keys['w']) z = -1;
            if (keys['s']) z = 1;
            if (keys['a']) x = -1;
            if (keys['d']) x = 1;
            const len = Math.sqrt(x*x + z*z);
            if (len > 1) { x /= len; z /= len; }
            const moving = Math.abs(x) > 0.05 || Math.abs(z) > 0.05;
            const currentSpeed = isSkating ? SKATE_SPEED : WALK_SPEED;
            if (moving && !isPerformingTrick) {
                const forward = new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw));
                const right = new THREE.Vector3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw));
                const dir = new THREE.Vector3().addScaledVector(forward, -z).addScaledVector(right, x);
                if (dir.length() > 0.1) {
                    dir.normalize();
                    player.position.x += dir.x * currentSpeed * delta;
                    if (isColliding(player.position.x, player.position.y, player.position.z)) player.position.x -= dir.x * currentSpeed * delta;
                    player.position.z += dir.z * currentSpeed * delta;
                    if (isColliding(player.position.x, player.position.y, player.position.z)) player.position.z -= dir.z * currentSpeed * delta;
                    player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, Math.atan2(dir.x, dir.z), delta * 12);
                }
            }
            if (questActive && isSkating && moving) {
                skateTime += delta;
                questBox.textContent = `📋 Задание #1: Покатайтесь ${Math.floor(skateTime)}/20 сек`;
                if (skateTime >= 20) questBox.textContent = '✅ Задание выполнено! Поговорите с НПС';
            }
            velocityY -= GRAVITY * delta;
            player.position.y += velocityY * delta;
            const groundInfo = getGroundY(player.position.x, player.position.y, player.position.z);
            if (velocityY <= 0 && player.position.y <= groundInfo.groundY && groundInfo.onGround) {
                player.position.y = groundInfo.groundY; velocityY = 0; grounded = true;
            } else if (player.position.y <= 0) {
                player.position.y = 0; velocityY = 0; grounded = true;
            } else grounded = false;
        }

        function jump() {

        function toggleSkateboard() {

        function animateCharacter(delta) {

                arms[0].position.set(-1.5, 3.8, 0.5); arms[0].rotation.x = -0.8; arms[0].rotation.z = 0.3; arms[0].rotation.y = -0.5;
            } else if (isSkating && !moving) {
                head.position.y = 5.3; eyeGroup.position.y = 5.45;
                torso.rotation.y = 0; torso.rotation.z = 0; torso.position.y = 3.3;
                legs[1].position.set(0.5, 2.5, 0); legs[1].rotation.y = 0;

                legs[0].position.set(-0.65, 2.2, 0); legs[1].position.set(0.65, 2.2, 0);
                legs[0].rotation.y = 0; legs[1].rotation.y = 0; legs[0].rotation.x = 0; legs[1].rotation.x = 0;
                arms[0].position.set(-1.6, 4.0, 0); arms[1].position.set(1.6, 4.0, 0);
                arms[0].rotation.set(0,0,0); arms[1].rotation.set(0,0,0);
                if (moving && grounded && !isPerformingTrick) {
                    walkTime += delta * 10;
                    const swing = Math.sin(walkTime) * 0.5;
                    for (let i = 0; i < arms.length; i++) arms[i].rotation.x = swing * (i === 0 ? -1 : 1);
                    for (let i = 0; i < legs.length; i++) legs[i].rotation.x = -swing * (i === 0 ? -1 : 1);
                    torso.position.y = 3.2 + Math.abs(Math.sin(walkTime * 2)) * 0.05;
                }
            }
        }

        function updatePlayerCamera(delta) {
            if (isDroneMode) return;
            const smooth = 1 - Math.pow(0.002, delta);
            cameraYaw = THREE.MathUtils.lerp(cameraYaw, targetYaw, smooth);
            cameraPitch = THREE.MathUtils.lerp(cameraPitch, targetPitch, smooth);
            const dist = isSkating ? 9.0 : 7.5;
            const target = new THREE.Vector3(player.position.x, player.position.y + 2.5, player.position.z);
            const offset = new THREE.Vector3(
                Math.sin(cameraYaw) * dist * Math.cos(cameraPitch),
                3.5 + Math.sin(cameraPitch) * dist,
                Math.cos(cameraYaw) * dist * Math.cos(cameraPitch)
            );
            camera.position.lerp(target.clone().add(offset), 1 - Math.pow(0.0005, delta));
            if (camera.position.y < 0.8) camera.position.y = 0.8;
            camera.lookAt(target);
        }

        let joystickActive = false, joyPointerId = null, joyCenterX = 0, joyCenterY = 0;
        const MAX_RADIUS = 42;
        joystickArea.addEventListener('pointerdown', (e) => {
            if (isDroneMode) return;
            e.preventDefault();
            joyCenterX = e.clientX; joyCenterY = e.clientY;
            joystick.style.left = joyCenterX + 'px'; joystick.style.top = joyCenterY + 'px';
            joystick.classList.add('active'); joystick.style.display = 'block';
            joystickActive = true; joyPointerId = e.pointerId;
            e.target.setPointerCapture(e.pointerId);
            updateJoystick(e.clientX, e.clientY);
        });
        document.addEventListener('pointermove', (e) => { if (joystickActive && e.pointerId === joyPointerId) updateJoystick(e.clientX, e.clientY); });
        document.addEventListener('pointerup', (e) => {
            if (e.pointerId !== joyPointerId) return;
            joystickActive = false; joyPointerId = null;
            joystick.classList.remove('active'); joystick.style.display = 'none';
            stick.style.transform = 'translate3d(0,0,0)';
            moveX = 0; moveZ = 0;
        });
        function updateJoystick(clientX, clientY) {
            let dx = clientX - joyCenterX, dy = clientY - joyCenterY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > MAX_RADIUS) { dx = dx/dist*MAX_RADIUS; dy = dy/dist*MAX_RADIUS; }
            stick.style.transform = `translate3d(${dx}px,${dy}px,0)`;
            moveX = dx / MAX_RADIUS; moveZ = dy / MAX_RADIUS;
        }

        let droneJoystickActive = false, droneJoyPointerId = null, droneJoyCenterX = 0, droneJoyCenterY = 0;
        droneJoystickArea.addEventListener('pointerdown', (e) => {
            if (!isDroneMode) return;
            e.preventDefault();
            droneJoyCenterX = e.clientX; droneJoyCenterY = e.clientY;
            droneJoystick.style.left = droneJoyCenterX + 'px'; droneJoystick.style.top = droneJoyCenterY + 'px';
            droneJoystick.classList.add('active'); droneJoystick.style.display = 'block';
            droneJoystickActive = true; droneJoyPointerId = e.pointerId;
            e.target.setPointerCapture(e.pointerId);
            updateDroneJoystick(e.clientX, e.clientY);
        });
        document.addEventListener('pointermove', (e) => { if (droneJoystickActive && e.pointerId === droneJoyPointerId) updateDroneJoystick(e.clientX, e.clientY); });
        document.addEventListener('pointerup', (e) => {
            if (e.pointerId !== droneJoyPointerId) return;
            droneJoystickActive = false; droneJoyPointerId = null;
            droneJoystick.classList.remove('active'); droneJoystick.style.display = 'none';
            droneStick.style.transform = 'translate3d(0,0,0)';
            droneMoveX = 0; droneMoveZ = 0;
        });
        function updateDroneJoystick(clientX, clientY) {
            let dx = clientX - droneJoyCenterX, dy = clientY - droneJoyCenterY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > MAX_RADIUS) { dx = dx/dist*MAX_RADIUS; dy = dy/dist*MAX_RADIUS; }
            droneStick.style.transform = `translate3d(${dx}px,${dy}px,0)`;
            droneMoveX = dx / MAX_RADIUS; droneMoveZ = dy / MAX_RADIUS;
        }

        let droneUpPressed = false, droneDownPressed = false;
        droneUpBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); droneUpPressed = true; });
        droneUpBtn.addEventListener('pointerup', () => droneUpPressed = false);
        droneUpBtn.addEventListener('pointerleave', () => droneUpPressed = false);
        droneDownBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); droneDownPressed = true; });
        droneDownBtn.addEventListener('pointerup', () => droneDownPressed = false);
        droneDownBtn.addEventListener('pointerleave', () => droneDownPressed = false);

        function updateDroneVertical(delta) {
            if (!isDroneMode) return;
            if (droneUpPressed) droneTargetHeight += 5.0 * delta;
            if (droneDownPressed) droneTargetHeight = Math.max(droneTargetHeight - 5.0 * delta, 0.7);
        }

        let droneCameraActive = false, droneCamPointerId = null, droneLastCamX = 0, droneLastCamY = 0;
        document.addEventListener('pointerdown', (e) => {
            if (!isDroneMode) return;
            if (e.clientX > window.innerWidth*0.5 && !e.target.closest('#droneUpBtn') && !e.target.closest('#droneDownBtn') && !e.target.closest('#droneExitBtn')) {
                droneCameraActive = true; droneCamPointerId = e.pointerId;
                droneLastCamX = e.clientX; droneLastCamY = e.clientY;
                e.target.setPointerCapture(e.pointerId);
            }
        });
        document.addEventListener('pointermove', (e) => {
            if (!droneCameraActive || e.pointerId !== droneCamPointerId) return;
            droneTargetYaw -= (e.clientX - droneLastCamX) * 0.005;
            droneTargetPitch = THREE.MathUtils.clamp(droneTargetPitch + (e.clientY - droneLastCamY) * 0.005, -Math.PI/2, Math.PI/2);
            droneLastCamX = e.clientX; droneLastCamY = e.clientY;
        });
        document.addEventListener('pointerup', (e) => { if (e.pointerId === droneCamPointerId) { droneCameraActive = false; droneCamPointerId = null; } });

        let cameraActive = false, camPointerId = null, lastCamX = 0, lastCamY = 0;
        document.addEventListener('pointerdown', (e) => {
            if (isDroneMode) return;
            if (e.clientX > window.innerWidth*0.5 && !e.target.closest('#skateBtn') && !e.target.closest('#jumpBtn') && !e.target.closest('#interactBtn') && !e.target.closest('#shopInteractBtn') && !e.target.closest('#droneInteractBtn') && !e.target.closest('#dialogNext') && !e.target.closest('#closeShop') && !e.target.closest('.shopItem')) {
                cameraActive = true; camPointerId = e.pointerId;
                lastCamX = e.clientX; lastCamY = e.clientY;
                e.target.setPointerCapture(e.pointerId);
            }
        });
        document.addEventListener('pointermove', (e) => {
            if (!cameraActive || e.pointerId !== camPointerId) return;
            targetYaw -= (e.clientX - lastCamX) * 0.005;
            targetPitch = THREE.MathUtils.clamp(targetPitch + (e.clientY - lastCamY) * 0.005, -0.5, 3.3);
            lastCamX = e.clientX; lastCamY = e.clientY;
        });
        document.addEventListener('pointerup', (e) => { if (e.pointerId === camPointerId) { cameraActive = false; camPointerId = null; } });

        jumpBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });
        skateBtn.addEventListener('click', toggleSkateboard);
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            keys[key] = true;
            if (key === ' ' || e.code === 'Space') { e.preventDefault(); jump(); }
            if (key === 'q') toggleSkateboard();
        });
        document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        startButton.addEventListener('click', async () => {
            if (startButton.classList.contains('disabled')) return;
            try {
                if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
                if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
            } catch (e) {}
            gameStarted = true;
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('loading').style.display = 'none';
        });

        function resize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            checkOrientation();
        }
        window.addEventListener('resize', resize);

        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            let delta = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;
            const elapsedTime = now * 0.001;

            if (gameStarted) updateSunFollow();

            if (gameStarted) {
                updateTimeCycle(delta);
                updateNPCAnimation(delta, elapsedTime);
                if (isDroneMode) {
                    updateDronePhysics(delta);
                    updateDroneVertical(delta);
                    updateDroneAnimation();
                    updateDroneCamera(delta);
                    updateDroneSound();
                } else {
                    updatePlayerPhysics(delta);
                    updateTrickSystem(delta);
                    animateCharacter(delta);
                    updatePlayerCamera(delta);
                    checkNPCDistance();
                    checkShopDistance();
                    checkDroneDistance();
                    if (tutorialComplete) scoreBoard.style.display = isOnSkatePark() ? 'flex' : 'none';
                    secrets.forEach(s => {
                        if (!s.found && player.position.distanceTo(s.pos) < 2.2) {
                            s.found = true;
                            s.mesh.visible = false;
                            score += s.bonus;
                            updateScoreDisplay();
                            showNotification(`🎁 Секретная локация! +${s.bonus.toLocaleString()} очков`);
                        }
                    });
                }
                drawMiniMap();
            }

            if (spinningCarousel) spinningCarousel.rotation.y += delta * 0.8;

            dancerGroup.position.y = 2.0 + Math.sin(elapsedTime * 8) * 0.25;
            dancerGroup.rotation.y = Math.sin(elapsedTime * 0.8) * 0.4;
            dancerGroup.rotation.z = Math.sin(elapsedTime * 4) * 0.15;
            dancerGroup.rotation.x = Math.sin(elapsedTime * 6) * 0.1;
            number6Group.rotation.z = Math.sin(elapsedTime * 10) * 0.3;
            number7Group.rotation.z = Math.sin(elapsedTime * 9 + 2) * 0.25;
            number7Group.position.y = Math.cos(elapsedTime * 13) * 0.15;

            const pulseScale = 1 + Math.sin(now * 0.005) * 0.25;
            indicator.scale.setScalar(pulseScale);
            indicatorGlow.scale.setScalar(pulseScale * 1.2);

            secrets.forEach(s => {
                if (!s.found) {
                    s.mesh.position.y = s.pos.y + Math.sin(elapsedTime * 3) * 0.2;
                    s.mesh.rotation.y = elapsedTime * 2;
                }
            });

            if (explosionGroup.visible) {
                explosionGroup.userData.life += delta;
                if (explosionGroup.userData.life >= explosionGroup.userData.maxLife) explosionGroup.visible = false;
                else {
                    const lifeRatio = explosionGroup.userData.life / explosionGroup.userData.maxLife;
                    explosionGroup.children.forEach(child => {
                        if (child.userData.velocity) {
                            child.position.add(child.userData.velocity.clone().multiplyScalar(delta));
                            child.userData.velocity.y -= 15 * delta;
                        }
                        if (child.userData.isSmoke) { child.scale.setScalar(1 + lifeRatio * 5); child.material.opacity = 0.9 * (1 - lifeRatio); }
                        if (child.userData.isFireball) { child.scale.setScalar(1 + lifeRatio * 3); child.material.opacity = 1 - lifeRatio * 0.8; }
                        if (child.userData.isRing) { child.scale.setScalar(1 + lifeRatio * 8); child.material.opacity = 0.8 * (1 - lifeRatio); }
                        if (child.userData.isSpark) child.material.opacity = 1 - lifeRatio;
                    });
                }
            }

            renderer.render(scene, camera);
        }

        document.getElementById('loading').style.display = 'none';
        animate();
        console.log('🚶 3D WALK — Скейт-парк с городом готов!');
    </script>
</body>
