<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>🚁 Дрон + 2 Дома + Гигант</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#73c9ff;font-family:Arial,sans-serif}
#game{position:fixed;inset:0;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#startScreen{position:absolute;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;background:linear-gradient(#73c9ff,#3d9ed4,#2273a6)}
#startScreen h1{margin-bottom:8px;font-size:30px;letter-spacing:3px;font-weight:900}
#startScreen p{margin-bottom:25px;color:#e8f7ff;font-size:14px}
#startButton{border:none;border-radius:15px;padding:16px 34px;background:white;color:#111;font-size:17px;font-weight:900;box-shadow:0 8px 30px rgba(0,0,0,.3);cursor:pointer}
#startButton:active{transform:scale(.95)}
#startButton.disabled{background:#aaa;color:#555;pointer-events:none;opacity:.7}
#rotateHint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#ffcc00;padding:12px 20px;border-radius:30px;font-size:16px;font-weight:bold;letter-spacing:1px;animation:pulse 2s infinite;text-align:center;width:80%}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
#controls{position:fixed;inset:0;pointer-events:none;z-index:50}
#controls>*{pointer-events:auto}
#joystickArea{position:absolute;left:0;bottom:0;width:50%;height:70%;touch-action:none}
#joystick{position:absolute;left:80px;bottom:100px;width:130px;height:130px;border-radius:50%;background:rgba(0,0,0,.15);border:2px solid rgba(255,255,255,.1);backdrop-filter:blur(4px);display:none;pointer-events:none;transform:translate(-50%,-50%)}
#joystick.active{display:block}
#stick{position:absolute;left:50%;top:50%;width:54px;height:54px;margin-left:-27px;margin-top:-27px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.15);box-shadow:0 0 30px rgba(0,0,0,.2);pointer-events:none}
#droneInteractBtn{position:absolute;bottom:35%;left:50%;transform:translateX(-50%);padding:15px 25px;background:#2ecc71;color:white;border:none;border-radius:10px;font-size:18px;font-weight:900;cursor:pointer;display:none;pointer-events:auto;z-index:55;box-shadow:0 4px 15px rgba(0,0,0,.3)}
#droneUpBtn,#droneDownBtn,#droneExitBtn{position:absolute;right:30px;width:70px;height:70px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.35);color:white;font-size:28px;display:none;align-items:center;justify-content:center;backdrop-filter:blur(8px);cursor:pointer;z-index:60;pointer-events:auto;user-select:none}
#droneExitBtn{bottom:220px;background:rgba(231,76,60,.5);border-color:rgba(231,76,60,.8);font-size:22px}
#droneUpBtn{bottom:130px;background:rgba(46,204,113,.5);border-color:rgba(46,204,113,.8)}
#droneDownBtn{bottom:40px;background:rgba(52,152,219,.5);border-color:rgba(52,152,219,.8)}
#droneUpBtn:active,#droneDownBtn:active,#droneExitBtn:active{background:rgba(255,255,255,.3);transform:scale(.92)}
#droneJoystickArea{position:absolute;left:0;bottom:0;width:50%;height:70%;touch-action:none;display:none;z-index:55}
#droneJoystick{position:absolute;left:80px;bottom:100px;width:130px;height:130px;border-radius:50%;background:rgba(0,0,0,.15);border:2px solid rgba(255,255,255,.1);backdrop-filter:blur(4px);display:none;pointer-events:none;transform:translate(-50%,-50%)}
#droneJoystick.active{display:block}
#droneStick{position:absolute;left:50%;top:50%;width:54px;height:54px;margin-left:-27px;margin-top:-27px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.15);box-shadow:0 0 30px rgba(0,0,0,.2);pointer-events:none}
#droneHint{position:absolute;top:20px;left:50%;transform:translateX(-50%);color:white;background:rgba(0,0,0,.7);padding:8px 16px;border-radius:20px;font-size:14px;pointer-events:none;z-index:55;display:none}
.notification{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.9);color:white;padding:20px 40px;border-radius:15px;font-size:20px;font-weight:900;z-index:1000;pointer-events:none;animation:fadeOut 2s forwards}
@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
#statusBar{position:fixed;top:10px;left:10px;background:rgba(0,0,0,.7);color:white;padding:10px 18px;border-radius:10px;font-size:16px;font-weight:700;z-index:100;pointer-events:none}

<script type="module">
import * as THREE from 'three';

// ========= СЦЕНА =========
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 60, 400);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 800);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('game').appendChild(renderer.domElement);

// ========= СВЕТ =========
scene.add(new THREE.AmbientLight(0x99aacc, 0.55));
const hemi = new THREE.HemisphereLight(0x87CEEB, 0x3a7d44, 1.0);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffeedd, 2.5);
sun.position.set(40, 80, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 400;
sun.shadow.camera.left = -120;
sun.shadow.camera.right = 120;
sun.shadow.camera.top = 120;
sun.shadow.camera.bottom = -120;
scene.add(sun);
scene.add(sun.target);

// ========= БОЛЬШОЕ ПОЛЕ =========
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1000, 1000, 32, 32),
  new THREE.MeshStandardMaterial({ color: 0x4CAF50, roughness: 0.9 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ========= КОЛЛАЙДЕРЫ =========
const colliders = [];
function addBoxCollider(mesh) {
  colliders.push({ type: 'box', mesh: mesh, getBox: () => new THREE.Box3().setFromObject(mesh) });
}
function addStaticBox(x1, y1, z1, x2, y2, z2) {
  colliders.push({ type: 'box', getBox: () => new THREE.Box3(new THREE.Vector3(x1, y1, z1), new THREE.Vector3(x2, y2, z2)), isHouse: true });
}

// ========= ИГРОК (маленький человечек) =========
const player = new THREE.Group();
const skinMat = new THREE.MeshStandardMaterial({ color: 0xd9a066, roughness: 0.6 });
const shirtMat = new THREE.MeshStandardMaterial({ color: 0x3a2fd8, roughness: 0.6 });
const pantsMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, roughness: 0.8 });
const hairMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.9 });
const shoeMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 });

// Тело
const torso = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.2, 0.6), shirtMat);
torso.position.y = 1.6;
torso.castShadow = true;
player.add(torso);
// Голова
const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.65, 0.6), skinMat);
head.position.y = 2.55;
head.castShadow = true;
player.add(head);
// Волосы
const hair = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.25, 0.65), hairMat);
hair.position.y = 2.95;
player.add(hair);
// Руки
const arms = [];
for (let s of [-1, 1]) {
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.1, 0.3), shirtMat);
  arm.position.set(s * 0.65, 1.6, 0);
  arm.castShadow = true;
  player.add(arm);
  arms.push(arm);
}
// Ноги
const legs = [];
for (let s of [-1, 1]) {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.35, 1.1, 0.4), pantsMat);
  leg.position.set(s * 0.3, 0.55, 0);
  leg.castShadow = true;
  player.add(leg);
  legs.push(leg);
}
// Ботинки
for (let s of [-1, 1]) {
  const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.55), shoeMat);
  shoe.position.set(s * 0.3, 0.08, 0.05);
  player.add(shoe);
}

player.position.set(0, 0, 0);
scene.add(player);

// ========= БОЛЬШОЙ 3D ЧЕЛОВЕК (ГИГАНТ) =========
const giant = new THREE.Group();
const giantScale = 8; // в 8 раз больше игрока

const giantSkin = new THREE.MeshStandardMaterial({ color: 0xe8b890, roughness: 0.7 });
const giantShirt = new THREE.MeshStandardMaterial({ color: 0xcc2222, roughness: 0.7 });
const giantPants = new THREE.MeshStandardMaterial({ color: 0x1a1a5a, roughness: 0.8 });
const giantHair = new THREE.MeshStandardMaterial({ color: 0x3a2a10, roughness: 0.9 });

// Тело гиганта
const giantTorso = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.2, 1.0), giantShirt);
giantTorso.position.y = 3.2;
giantTorso.castShadow = true;
giant.add(giantTorso);
// Голова
const giantHead = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.3, 1.2), giantSkin);
giantHead.position.y = 5.0;
giantHead.castShadow = true;
giant.add(giantHead);
// Волосы
const giantHairTop = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.5, 1.3), giantHair);
giantHairTop.position.y = 5.85;
giant.add(giantHairTop);
// Глаза
for (let s of [-1, 1]) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 12), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  eye.position.set(s * 0.3, 5.1, 0.6);
  giant.add(eye);
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 10), new THREE.MeshStandardMaterial({ color: 0x222222 }));
  pupil.position.set(s * 0.3, 5.1, 0.74);
  giant.add(pupil);
}
// Улыбка
const smile = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, 0.1), new THREE.MeshStandardMaterial({ color: 0x222222 }));
smile.position.set(0, 4.7, 0.65);
giant.add(smile);
// Руки
for (let s of [-1, 1]) {
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.6, 2.2, 0.6), giantShirt);
  arm.position.set(s * 1.2, 3.2, 0);
  arm.castShadow = true;
  giant.add(arm);
  const hand = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.55, 0.55), giantSkin);
  hand.position.set(s * 1.2, 1.9, 0);
  giant.add(hand);
}
// Ноги
for (let s of [-1, 1]) {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.7, 2.4, 0.75), giantPants);
  leg.position.set(s * 0.55, 1.2, 0);
  leg.castShadow = true;
  giant.add(leg);
  const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.3, 1.1), new THREE.MeshStandardMaterial({ color: 0x111111 }));
  shoe.position.set(s * 0.55, 0.15, 0.15);
  giant.add(shoe);
}

giant.scale.set(giantScale, giantScale, giantScale);
giant.position.set(35, 0, -25); // стоит в поле
scene.add(giant);

// ========= 2 ДОМА С КОЛЛИЗИЕЙ =========
const houses = [];
function createHouse(x, z, color, rotY = 0) {
  const house = new THREE.Group();
  // Основание
  const walls = new THREE.Mesh(
    new THREE.BoxGeometry(12, 8, 10),
    new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 })
  );
  walls.position.y = 4;
  walls.castShadow = true;
  walls.receiveShadow = true;
  house.add(walls);
  // Крыша
  const roofGeo = new THREE.ConeGeometry(9, 4, 4);
  const roof = new THREE.Mesh(roofGeo, new THREE.MeshStandardMaterial({ color: 0x8b2020, roughness: 0.6 }));
  roof.position.y = 10;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  house.add(roof);
  // Дверь
  const door = new THREE.Mesh(
    new THREE.BoxGeometry(2, 3.5, 0.2),
    new THREE.MeshStandardMaterial({ color: 0x4a2810, roughness: 0.5 })
  );
  door.position.set(0, 1.75, 5.05);
  house.add(door);
  // Окна
  const windowMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, roughness: 0.1, emissive: 0x224466, emissiveIntensity: 0.3 });
  for (let s of [-1, 1]) {
    const win = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.8, 0.2), windowMat);
    win.position.set(s * 3.5, 5, 5.05);
    house.add(win);
  }
  // Труба
  const chimney = new THREE.Mesh(
    new THREE.BoxGeometry(1, 2, 1),
    new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.8 })
  );
  chimney.position.set(3, 11, -2);
  chimney.castShadow = true;
  house.add(chimney);

  house.position.set(x, 0, z);
  house.rotation.y = rotY;
  scene.add(house);
  houses.push(house);
  addBoxCollider(walls);
  return house;
}

createHouse(-30, 0, 0xd4a574, 0);        // дом 1 — бежевый
createHouse(0, -40, 0x7fa8c9, Math.PI / 2); // дом 2 — голубой

// Деревья вокруг для атмосферы
for (let i = 0; i < 40; i++) {
  const angle = Math.random() * Math.PI * 2;
  const dist = 60 + Math.random() * 120;
  const x = Math.cos(angle) * dist;
  const z = Math.sin(angle) * dist;
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.4, 0.5, 3, 8),
    new THREE.MeshStandardMaterial({ color: 0x6b4f3a, roughness: 0.9 })
  );
  trunk.position.y = 1.5;
  trunk.castShadow = true;
  tree.add(trunk);
  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(2, 4, 8),
    new THREE.MeshStandardMaterial({ color: 0x2d6a4f, roughness: 0.8 })
  );
  leaves.position.y = 4.5;
  leaves.castShadow = true;
  tree.add(leaves);
  tree.position.set(x, 0, z);
  scene.add(tree);
}

// ========= ДРОН =========
const DRONE_SPAWN = new THREE.Vector3(4, 0, 4); // где лежит дрон рядом с игроком
const droneGroup = new THREE.Group();
const droneBodyMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.4, metalness: 0.8 });
const droneAccentMat = new THREE.MeshStandardMaterial({ color: 0xff4400, roughness: 0.3, metalness: 0.6, emissive: new THREE.Color(0x220000) });
const dronePropMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.2, metalness: 0.5 });

// Корпус
const droneBody = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 1.6), droneBodyMat);
droneBody.position.y = 0.25;
droneBody.castShadow = true;
droneGroup.add(droneBody);
// Камера
const droneCam = new THREE.Mesh(
  new THREE.SphereGeometry(0.22, 12, 12),
  new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.1, metalness: 0.9 })
);
droneCam.position.set(0, 0.15, 0.85);
droneGroup.add(droneCam);
// Красное кольцо
const droneRing = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.05, 8, 16), droneAccentMat);
droneRing.position.set(0, 0.15, 0.9);
droneRing.rotation.x = Math.PI / 2;
droneGroup.add(droneRing);
// LED спереди
const led = new THREE.Mesh(
  new THREE.SphereGeometry(0.08, 8, 8),
  new THREE.MeshStandardMaterial({ color: 0x00ff00, emissive: 0x00ff00, emissiveIntensity: 1.5 })
);
led.position.set(0, 0.45, 0.75);
droneGroup.add(led);

// Пропеллеры
const droneArms = [];
const armData = [
  [0.8, 0.25, 0.8, Math.PI / 4],
  [-0.8, 0.25, 0.8, -Math.PI / 4],
  [0.8, 0.25, -0.8, -Math.PI / 4 + Math.PI],
  [-0.8, 0.25, -0.8, Math.PI / 4 + Math.PI]
];
armData.forEach((data) => {
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 1.2, 8), droneBodyMat);
  arm.position.set(data[0], data[1], data[2]);
  arm.rotation.z = Math.PI / 2;
  arm.rotation.y = data[3];
  arm.castShadow = true;
  droneGroup.add(arm);

  const motor = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.28, 0.3, 12), droneBodyMat);
  motor.position.set(data[0] * 1.6, 0.38, data[2] * 1.6);
  motor.castShadow = true;
  droneGroup.add(motor);

  const propGroup = new THREE.Group();
  propGroup.position.set(data[0] * 1.6, 0.55, data[2] * 1.6);
  const blade1 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.04, 0.18), dronePropMat);
  propGroup.add(blade1);
  const blade2 = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.04, 0.8), dronePropMat);
  propGroup.add(blade2);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.12, 8), droneAccentMat);
  hub.rotation.x = Math.PI / 2;
  propGroup.add(hub);
  droneGroup.add(propGroup);
  droneArms.push(propGroup);
});

// Площадка под дроном
const droneTile = new THREE.Mesh(
  new THREE.BoxGeometry(2.2, 0.08, 2.2),
  new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 })
);
droneTile.position.set(DRONE_SPAWN.x, 0.04, DRONE_SPAWN.z);
scene.add(droneTile);

droneGroup.position.copy(DRONE_SPAWN);
scene.add(droneGroup);

// ========= СОСТОЯНИЕ =========
let gameStarted = false;
let isDroneMode = false;
let droneMoveX = 0, droneMoveZ = 0;
let droneYaw = 0, dronePitch = 0;
let droneTargetYaw = 0, droneTargetPitch = 0;
let droneTargetHeight = 0.3;
let droneSpeed = 0;
let dronePropellerAngle = 0;
let droneUpPressed = false, droneDownPressed = false;
let droneExploded = false;
let droneRespawnTimer = 0;
const DRONE_RESPAWN_TIME = 3.0; // 3 секунды до респавна

// ========= UI =========
const statusBar = document.getElementById('statusBar');
const droneInteractBtn = document.getElementById('droneInteractBtn');
const droneUpBtn = document.getElementById('droneUpBtn');
const droneDownBtn = document.getElementById('droneDownBtn');
const droneExitBtn = document.getElementById('droneExitBtn');
const droneJoystickArea = document.getElementById('droneJoystickArea');
const droneJoystick = document.getElementById('droneJoystick');
const droneStick = document.getElementById('droneStick');
const droneHint = document.getElementById('droneHint');
const joystickArea = document.getElementById('joystickArea');
const joystick = document.getElementById('joystick');
const stick = document.getElementById('stick');

function showNotification(message) {
  const n = document.createElement('div');
  n.className = 'notification';
  n.textContent = message;
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 2000);
}

// ========= ФИЗИКА ИГРОКА =========
const PLAYER_RADIUS = 0.5;
const PLAYER_HEIGHT = 3.0;
const WALK_SPEED = 5.0;
const GRAVITY = 25;
const JUMP_FORCE = 9;
let velocityY = 0, grounded = true;
let moveX = 0, moveZ = 0;
let cameraYaw = 0, cameraPitch = 0.4;
let targetYaw = 0, targetPitch = 0.4;

function isColliding(px, py, pz) {
  for (let i = 0; i < colliders.length; i++) {
    const col = colliders[i];
    if (col.type === 'box') {
      const box = col.getBox();
      if (px + PLAYER_RADIUS > box.min.x && px - PLAYER_RADIUS < box.max.x &&
          pz + PLAYER_RADIUS > box.min.z && pz - PLAYER_RADIUS < box.max.z) {
        if (py + PLAYER_HEIGHT > box.min.y && py < box.max.y) return true;
      }
    }
  }
  return false;
}

function getGroundY(px, py, pz) {
  let groundY = 0, onGround = false;
  for (let i = 0; i < colliders.length; i++) {
    const col = colliders[i];
    if (col.type === 'box') {
      const box = col.getBox();
      if (px + PLAYER_RADIUS > box.min.x && px - PLAYER_RADIUS < box.max.x &&
          pz + PLAYER_RADIUS > box.min.z && pz - PLAYER_RADIUS < box.max.z) {
        if (py <= box.max.y && py > box.max.y - 1.0) {
          groundY = Math.max(groundY, box.max.y);
          onGround = true;
        }
      }
    }
  }
  return { groundY, onGround };
}

function updatePlayerPhysics(delta) {
  if (isDroneMode || droneExploded) return;
  let x = moveX, z = moveZ;
  const len = Math.sqrt(x * x + z * z);
  if (len > 1) { x /= len; z /= len; }
  const moving = Math.abs(x) > 0.05 || Math.abs(z) > 0.05;
  if (moving) {
    const forward = new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw));
    const right = new THREE.Vector3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw));
    const dir = new THREE.Vector3().addScaledVector(forward, -z).addScaledVector(right, x);
    if (dir.length() > 0.1) {
      dir.normalize();
      player.position.x += dir.x * WALK_SPEED * delta;
      if (isColliding(player.position.x, player.position.y, player.position.z)) {
        player.position.x -= dir.x * WALK_SPEED * delta;
      }
      player.position.z += dir.z * WALK_SPEED * delta;
      if (isColliding(player.position.x, player.position.y, player.position.z)) {
        player.position.z -= dir.z * WALK_SPEED * delta;
      }
      player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, Math.atan2(dir.x, dir.z), delta * 12);
    }
  }
  velocityY -= GRAVITY * delta;
  player.position.y += velocityY * delta;
  const g = getGroundY(player.position.x, player.position.y, player.position.z);
  if (velocityY <= 0 && player.position.y <= g.groundY && g.onGround) {
    player.position.y = g.groundY;
    velocityY = 0;
    grounded = true;
  } else if (player.position.y <= 0) {
    player.position.y = 0;
    velocityY = 0;
    grounded = true;
  } else grounded = false;

  // Анимация ходьбы
  if (moving && grounded) {
    const t = performance.now() * 0.01;
    const swing = Math.sin(t) * 0.5;
    arms[0].rotation.x = swing;
    arms[1].rotation.x = -swing;
    legs[0].rotation.x = -swing;
    legs[1].rotation.x = swing;
  } else {
    arms.forEach(a => a.rotation.x *= 0.9);
    legs.forEach(l => l.rotation.x *= 0.9);
  }
}

// ========= ФИЗИКА ДРОНА =========
function checkDroneHouseCollision() {
  if (!isDroneMode) return false;
  const dp = droneGroup.position;
  // Проверка только с домами
  for (const house of houses) {
    const box = new THREE.Box3().setFromObject(house);
    if (dp.x + 1.2 > box.min.x && dp.x - 1.2 < box.max.x &&
        dp.z + 1.2 > box.min.z && dp.z - 1.2 < box.max.z &&
        dp.y + 0.6 > box.min.y && dp.y - 0.3 < box.max.y) {
      // Дополнительная проверка — скорость должна быть заметной
      if (droneSpeed > 4) return true;
    }
  }
  // Если упал на землю слишком быстро
  if (dp.y <= 0.3 && droneSpeed > 6) return true;
  return false;
}

function updateDronePhysics(delta) {
  if (!isDroneMode || droneExploded) return;
  let x = droneMoveX, z = droneMoveZ;
  const len = Math.sqrt(x * x + z * z);
  if (len > 1) { x /= len; z /= len; }
  const forward = new THREE.Vector3(-Math.sin(droneYaw), 0, -Math.cos(droneYaw));
  const right = new THREE.Vector3(Math.cos(droneYaw), 0, -Math.sin(droneYaw));
  const dir = new THREE.Vector3().addScaledVector(forward, -z).addScaledVector(right, x);
  if (dir.length() > 0.1) {
    dir.normalize();
    droneGroup.position.x += dir.x * 14.0 * delta;
    droneGroup.position.z += dir.z * 14.0 * delta;
    droneSpeed = 14.0;
  } else {
    droneSpeed *= 0.92;
  }
  // Вертикаль
  if (Math.abs(droneGroup.position.y - droneTargetHeight) > 0.02) {
    const dir2 = droneTargetHeight > droneGroup.position.y ? 1 : -1;
    droneGroup.position.y += dir2 * 5.0 * delta;
    if (Math.abs(droneGroup.position.y - droneTargetHeight) <= 0.05) {
      droneGroup.position.y = droneTargetHeight;
    }
  }
  droneGroup.rotation.y = droneYaw;

  // Проверка столкновения с домами
  if (checkDroneHouseCollision()) {
    explodeDrone();
  }
}

// ========= ВЗРЫВ ДРОНА =========
const explosionGroup = new THREE.Group();
explosionGroup.visible = false;
scene.add(explosionGroup);

function explodeDrone() {
  const pos = droneGroup.position.clone();
  explosionGroup.position.copy(pos);
  explosionGroup.visible = true;
  explosionGroup.userData.life = 0;
  explosionGroup.userData.maxLife = 2.5;
  while (explosionGroup.children.length) explosionGroup.remove(explosionGroup.children[0]);

  // Огненный шар
  const fireball = new THREE.Mesh(
    new THREE.SphereGeometry(1.5, 16, 16),
    new THREE.MeshStandardMaterial({
      color: 0xff5500, emissive: 0xff2200, emissiveIntensity: 2.5,
      roughness: 0.2, transparent: true, opacity: 1
    })
  );
  fireball.userData.isFireball = true;
  explosionGroup.add(fireball);

  // Частицы
  const colors = [0xff5500, 0xffaa00, 0xff2200, 0x884400, 0xffffff, 0xffcc00, 0xff8800];
  for (let i = 0; i < 150; i++) {
    const size = 0.15 + Math.random() * 0.5;
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(size, 6, 6),
      new THREE.MeshStandardMaterial({
        color: colors[Math.floor(Math.random() * colors.length)],
        emissive: 0xff4400, emissiveIntensity: 1.5,
        roughness: 0.2, transparent: true, opacity: 1
      })
    );
    p.position.set((Math.random() - 0.5) * 3, Math.random() * 4, (Math.random() - 0.5) * 3);
    p.userData.velocity = new THREE.Vector3(
      (Math.random() - 0.5) * 15,
      Math.random() * 20 + 5,
      (Math.random() - 0.5) * 15
    );
    explosionGroup.add(p);
  }

  // Дым
  const smoke = new THREE.Mesh(
    new THREE.SphereGeometry(2, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9, transparent: true, opacity: 0.9 })
  );
  smoke.position.y = 1;
  smoke.userData.isSmoke = true;
  explosionGroup.add(smoke);

  // Скрыть дрон, включить таймер респавна
  droneGroup.visible = false;
  droneExploded = true;
  droneRespawnTimer = DRONE_RESPAWN_TIME;
  exitDroneMode(true);
  showNotification('💥 Дрон врезался в дом!');
}

function updateExplosion(delta) {
  if (!explosionGroup.visible) return;
  explosionGroup.userData.life += delta;
  if (explosionGroup.userData.life >= explosionGroup.userData.maxLife) {
    explosionGroup.visible = false;
    return;
  }
  const lifeRatio = explosionGroup.userData.life / explosionGroup.userData.maxLife;
  explosionGroup.children.forEach(child => {
    if (child.userData.velocity) {
      child.position.add(child.userData.velocity.clone().multiplyScalar(delta));
      child.userData.velocity.y -= 15 * delta;
    }
    if (child.userData.isSmoke) {
      child.scale.setScalar(1 + lifeRatio * 5);
      child.material.opacity = 0.9 * (1 - lifeRatio);
    }
    if (child.userData.isFireball) {
      child.scale.setScalar(1 + lifeRatio * 3);
      child.material.opacity = 1 - lifeRatio * 0.9;
    }
  });
}

function updateDroneRespawn(delta) {
  if (!droneExploded) return;
  droneRespawnTimer -= delta;
  if (droneRespawnTimer <= 0) {
    // Респавн
    droneGroup.position.copy(DRONE_SPAWN);
    droneGroup.position.y = 0.3;
    droneGroup.rotation.set(0, 0, 0);
    droneGroup.visible = true;
    droneExploded = false;
    droneSpeed = 0;
    droneTargetHeight = 0.3;
    droneRespawnTimer = 0;
    showNotification('🚁 Дрон восстановлен!');
  }
}

// ========= УПРАВЛЕНИЕ РЕЖИМАМИ =========
function enterDroneMode() {
  if (droneExploded) return;
  isDroneMode = true;
  droneInteractBtn.style.display = 'none';
  droneUpBtn.style.display = 'flex';
  droneDownBtn.style.display = 'flex';
  droneExitBtn.style.display = 'flex';
  droneJoystickArea.style.display = 'block';
  droneJoystick.style.display = 'block';
  joystickArea.style.display = 'none';
  joystick.style.display = 'none';
  player.visible = false;
  droneGroup.position.y = 1.5;
  droneTargetHeight = 1.5;
  droneYaw = 0;
  dronePitch = 0;
  droneTargetYaw = 0;
  droneTargetPitch = 0;
  droneSpeed = 0;
  droneHint.style.display = 'block';
  setTimeout(() => droneHint.style.display = 'none', 4000);
  statusBar.textContent = '🚁 Режим: дрон';
  showNotification('🚁 Вы сели за дрон!');
}

function exitDroneMode(fromExplosion = false) {
  isDroneMode = false;
  droneUpBtn.style.display = 'none';
  droneDownBtn.style.display = 'none';
  droneExitBtn.style.display = 'none';
  droneJoystickArea.style.display = 'none';
  droneJoystick.style.display = 'none';
  joystickArea.style.display = 'block';
  joystick.style.display = 'none';
  player.visible = true;
  if (!fromExplosion) {
    // Вернуть дрон на место
    droneGroup.position.copy(DRONE_SPAWN);
    droneGroup.position.y = 0.3;
    droneTargetHeight = 0.3;
    droneSpeed = 0;
    showNotification('🚶 Вернулись к игроку');
  }
  statusBar.textContent = '🚶 Режим: пешком';
}

droneInteractBtn.addEventListener('click', enterDroneMode);
droneExitBtn.addEventListener('click', () => exitDroneMode(false));

function checkDroneDistance() {
  if (isDroneMode || droneExploded) {
    droneInteractBtn.style.display = 'none';
    return;
  }
  const dist = player.position.distanceTo(droneGroup.position);
  droneInteractBtn.style.display = dist < 5 ? 'block' : 'none';
}

// ========= КАМЕРА =========
function updatePlayerCamera(delta) {
  if (isDroneMode) return;
  const smooth = 1 - Math.pow(0.002, delta);
  cameraYaw = THREE.MathUtils.lerp(cameraYaw, targetYaw, smooth);
  cameraPitch = THREE.MathUtils.lerp(cameraPitch, targetPitch, smooth);
  const dist = 7.0;
  const target = new THREE.Vector3(player.position.x, player.position.y + 2.5, player.position.z);
  const offset = new THREE.Vector3(
    Math.sin(cameraYaw) * dist * Math.cos(cameraPitch),
    3.5 + Math.sin(cameraPitch) * dist,
    Math.cos(cameraYaw) * dist * Math.cos(cameraPitch)
  );
  camera.position.lerp(target.clone().add(offset), 1 - Math.pow(0.0005, delta));
  if (camera.position.y < 0.8) camera.position.y = 0.8;
  camera.lookAt(target);
}

function updateDroneCamera(delta) {
  if (!isDroneMode) return;
  const smooth = 1 - Math.pow(0.001, delta);
  droneYaw = THREE.MathUtils.lerp(droneYaw, droneTargetYaw, smooth);
  dronePitch = THREE.MathUtils.lerp(dronePitch, droneTargetPitch, smooth);
  camera.position.copy(droneGroup.position);
  camera.position.y += 0.3;
  camera.lookAt(new THREE.Vector3(
    droneGroup.position.x - Math.sin(droneYaw) * Math.cos(dronePitch),
    droneGroup.position.y + 0.3 + Math.sin(dronePitch),
    droneGroup.position.z - Math.cos(droneYaw) * Math.cos(dronePitch)
  ));
}

// ========= ДЖОЙСТИКИ И СВАЙПЫ =========
const MAX_RADIUS = 42;
let joyActive = false, joyId = null, joyCX = 0, joyCY = 0;

joystickArea.addEventListener('pointerdown', (e) => {
  if (isDroneMode) return;
  e.preventDefault();
  joyCX = e.clientX; joyCY = e.clientY;
  joystick.style.left = joyCX + 'px';
  joystick.style.top = joyCY + 'px';
  joystick.classList.add('active');
  joystick.style.display = 'block';
  joyActive = true;
  joyId = e.pointerId;
  e.target.setPointerCapture(e.pointerId);
  updateJoy(e.clientX, e.clientY);
});

let droneJoyActive = false, droneJoyId = null, droneJoyCX = 0, droneJoyCY = 0;

droneJoystickArea.addEventListener('pointerdown', (e) => {
  if (!isDroneMode) return;
  e.preventDefault();
  droneJoyCX = e.clientX; droneJoyCY = e.clientY;
  droneJoystick.style.left = droneJoyCX + 'px';
  droneJoystick.style.top = droneJoyCY + 'px';
  droneJoystick.classList.add('active');
  droneJoystick.style.display = 'block';
  droneJoyActive = true;
  droneJoyId = e.pointerId;
  e.target.setPointerCapture(e.pointerId);
  updateDroneJoy(e.clientX, e.clientY);
});

document.addEventListener('pointermove', (e) => {
  if (joyActive && e.pointerId === joyId) updateJoy(e.clientX, e.clientY);
  if (droneJoyActive && e.pointerId === droneJoyId) updateDroneJoy(e.clientX, e.clientY);
});

document.addEventListener('pointerup', (e) => {
  if (e.pointerId === joyId) {
    joyActive = false; joyId = null;
    joystick.classList.remove('active');
    joystick.style.display = 'none';
    stick.style.transform = 'translate3d(0,0,0)';
    moveX = 0; moveZ = 0;
  }
  if (e.pointerId === droneJoyId) {
    droneJoyActive = false; droneJoyId = null;
    droneJoystick.classList.remove('active');
    droneJoystick.style.display = 'none';
    droneStick.style.transform = 'translate3d(0,0,0)';
    droneMoveX = 0; droneMoveZ = 0;
  }
});

function updateJoy(cx, cy) {
  let dx = cx - joyCX, dy = cy - joyCY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist > MAX_RADIUS) { dx = dx / dist * MAX_RADIUS; dy = dy / dist * MAX_RADIUS; }
  stick.style.transform = `translate3d(${dx}px,${dy}px,0)`;
  moveX = dx / MAX_RADIUS;
  moveZ = dy / MAX_RADIUS;
}
function updateDroneJoy(cx, cy) {
  let dx = cx - droneJoyCX, dy = cy - droneJoyCY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist > MAX_RADIUS) { dx = dx / dist * MAX_RADIUS; dy = dy / dist * MAX_RADIUS; }
  droneStick.style.transform = `translate3d(${dx}px,${dy}px,0)`;
  droneMoveX = dx / MAX_RADIUS;
  droneMoveZ = dy / MAX_RADIUS;
}

// Кнопки вверх/вниз
droneUpBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); droneUpPressed = true; });
droneUpBtn.addEventListener('pointerup', () => droneUpPressed = false);
droneUpBtn.addEventListener('pointerleave', () => droneUpPressed = false);
droneDownBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); droneDownPressed = true; });
droneDownBtn.addEventListener('pointerup', () => droneDownPressed = false);
droneDownBtn.addEventListener('pointerleave', () => droneDownPressed = false);

function updateDroneVertical(delta) {
  if (!isDroneMode) return;
  if (droneUpPressed) droneTargetHeight += 5.0 * delta;
  if (droneDownPressed) droneTargetHeight = Math.max(droneTargetHeight - 5.0 * delta, 0.4);
}

// Свайп камеры
let camActive = false, camId = null, lastCamX = 0, lastCamY = 0;
let droneCamActive = false, droneCamId = null, dLastCamX = 0, dLastCamY = 0;

document.addEventListener('pointerdown', (e) => {
  if (e.clientX < window.innerWidth * 0.5) return;
  if (e.target.closest('button')) return;
  if (isDroneMode) {
    droneCamActive = true;
    droneCamId = e.pointerId;
    dLastCamX = e.clientX; dLastCamY = e.clientY;
    e.target.setPointerCapture(e.pointerId);
  } else {
    camActive = true;
    camId = e.pointerId;
    lastCamX = e.clientX; lastCamY = e.clientY;
    e.target.setPointerCapture(e.pointerId);
  }
});
document.addEventListener('pointermove', (e) => {
  if (camActive && e.pointerId === camId) {
    targetYaw -= (e.clientX - lastCamX) * 0.005;
    targetPitch = THREE.MathUtils.clamp(targetPitch + (e.clientY - lastCamY) * 0.005, -0.5, 1.2);
    lastCamX = e.clientX; lastCamY = e.clientY;
  }
  if (droneCamActive && e.pointerId === droneCamId) {
    droneTargetYaw -= (e.clientX - dLastCamX) * 0.005;
    droneTargetPitch = THREE.MathUtils.clamp(droneTargetPitch + (e.clientY - dLastCamY) * 0.005, -Math.PI / 2, Math.PI / 2);
    dLastCamX = e.clientX; dLastCamY = e.clientY;
  }
});
document.addEventListener('pointerup', (e) => {
  if (e.pointerId === camId) { camActive = false; camId = null; }
  if (e.pointerId === droneCamId) { droneCamActive = false; droneCamId = null; }
});

// ========= ЗАПУСК =========
const startButton = document.getElementById('startButton');
const rotateHint = document.getElementById('rotateHint');

function checkOrientation() {
  if (window.innerWidth > window.innerHeight) {
    startButton.classList.remove('disabled');
    rotateHint.style.display = 'none';
  } else {
    startButton.classList.add('disabled');
    rotateHint.style.display = 'block';
  }
}
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  checkOrientation();
});
window.addEventListener('orientationchange', checkOrientation);
checkOrientation();

startButton.addEventListener('click', async () => {
  if (startButton.classList.contains('disabled')) return;
  try {
    if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
    if (screen.orientation?.lock) await screen.orientation.lock('landscape');
  } catch (e) {}
  gameStarted = true;
  document.getElementById('startScreen').style.display = 'none';
});

// ========= ГЛАВНЫЙ ЦИКЛ =========
let lastTime = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const delta = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (gameStarted) {
    sun.position.set(getFocus().x + 40, 80, getFocus().z + 30);
    sun.target.position.copy(getFocus());
    sun.target.updateMatrixWorld();

    updateDroneRespawn(delta);
    updateExplosion(delta);

    if (isDroneMode && !droneExploded) {
      updateDronePhysics(delta);
      updateDroneVertical(delta);
      updateDroneAnimation();
      updateDroneCamera(delta);
    } else {
      updatePlayerPhysics(delta);
      updatePlayerCamera(delta);
      checkDroneDistance();
    }
  }

  // Покачивание дрона если летит
  if (isDroneMode && droneGroup.visible) {
    droneGroup.rotation.z = Math.sin(now * 0.003) * 0.05;
    droneGroup.rotation.x = Math.cos(now * 0.0025) * 0.05;
  }

  // Покачивание гиганта (он просто стоит и "дышит")
  giant.position.y = Math.sin(now * 0.0008) * 0.15;

  renderer.render(scene, camera);
}

function getFocus() {
  return isDroneMode ? droneGroup.position : player.position;
}

function updateDroneAnimation() {
  dronePropellerAngle += 0.6;
  droneArms.forEach((prop, i) => {
    prop.rotation.y = dronePropellerAngle * (i % 2 === 0 ? 1 : -1);
  });
}

animate();
</script>
