<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <title>3D WALK — Military Base Update</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #73c9ff; font-family: Arial, sans-serif; }
        #game { position: fixed; inset: 0; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        #loading { position: absolute; inset: 0; z-index: 900; display: flex; align-items: center; justify-content: center; color: white; background: #73c9ff; font-size: 17px; }
        #startScreen { position: absolute; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; background: linear-gradient(#73c9ff, #3d9ed4, #2273a6); }
        #startScreen h1 { margin-bottom: 8px; font-size: 30px; letter-spacing: 3px; font-weight: 900; }
        #startScreen p { margin-bottom: 25px; color: #e8f7ff; font-size: 14px; }
        #startButton { border: none; border-radius: 15px; padding: 16px 34px; background: white; color: #111; font-size: 17px; font-weight: 900; box-shadow: 0 8px 30px rgba(0,0,0,.3); cursor: pointer; }
        #startButton:active { transform: scale(.95); }
        #startButton.disabled { background: #aaa; color: #555; pointer-events: none; opacity: 0.7; }
        #rotateHint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.8); color: #ffcc00; padding: 12px 20px; border-radius: 30px; font-size: 16px; font-weight: bold; letter-spacing: 1px; animation: pulse 2s infinite; text-align: center; width: 80%; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        #controls { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
        #controls>* { pointer-events: auto; }
        #joystickArea { position: absolute; left: 0; bottom: 0; width: 50%; height: 70%; touch-action: none; }
        #jumpBtn { position: absolute; right: 30px; bottom: 40px; width: 85px; height: 85px; border-radius: 50%; border: 3px solid rgba(255,255,255,.4); background: rgba(255,255,255,.15); color: white; font-size: 36px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); box-shadow: 0 6px 25px rgba(0,0,0,.4); cursor: pointer; transition: all .1s; z-index: 60; }
        #jumpBtn:active { transform: scale(.85); background: rgba(255,255,255,.35); }
        #skateBtn { position: absolute; left: 30px; top: 50%; transform: translateY(-50%); width: 70px; height: 70px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: white; font-size: 36px; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); box-shadow: 0 4px 20px rgba(0,0,0,.3); cursor: pointer; transition: all .15s; }
        #skateBtn:active { transform: translateY(-50%) scale(.88); background: rgba(255,255,255,.2); }
        #skateBtn.active { background: rgba(76,175,80,.5); border-color: rgba(76,175,80,.8); }
        #joystick { position: absolute; left: 80px; bottom: 100px; width: 130px; height: 130px; border-radius: 50%; background: rgba(0,0,0,.15); border: 2px solid rgba(255,255,255,.1); backdrop-filter: blur(4px); display: none; pointer-events: none; transform: translate(-50%,-50%); }
        #joystick.active { display: block; }
        #stick { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin-left: -27px; margin-top: -27px; border-radius: 50%; background: rgba(255,255,255,.25); border: 2px solid rgba(255,255,255,.15); box-shadow: 0 0 30px rgba(0,0,0,.2); pointer-events: none; }
        #interactBtn { position: absolute; bottom: 30%; left: 50%; transform: translateX(-50%); padding: 15px 25px; background: #e74c3c; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: 900; cursor: pointer; display: none; pointer-events: auto; z-index: 55; }
        #shopInteractBtn { position: absolute; bottom: 30%; left: 50%; transform: translateX(-50%); padding: 15px 25px; background: #f39c12; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: 900; cursor: pointer; display: none; pointer-events: auto; z-index: 55; }
        #dialogBox { position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%); width: 85%; max-width: 500px; background: rgba(0,0,0,.9); color: white; padding: 20px; border-radius: 15px; display: none; pointer-events: auto; z-index: 60; }
        #dialogText { font-size: 16px; line-height: 1.5; margin-bottom: 15px; white-space: pre-line; }
        #dialogNext { float: right; padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        #questBox { position: absolute; right: 10px; top: 65px; background: rgba(0,0,0,.7); color: white; padding: 10px 15px; border-radius: 8px; display: none; pointer-events: none; font-size: 14px; z-index: 55; font-weight: 700; }
        #miniMap { position: fixed; left: 10px; bottom: 10px; width: 120px; height: 120px; background: rgba(0,0,0,.7); border-radius: 50%; border: 2px solid rgba(255,255,255,.3); z-index: 100; pointer-events: none; display: none; overflow: hidden; }
        #miniMapCanvas { width: 100%; height: 100%; }
        #scoreBoard { position: fixed; left: 10px; bottom: 140px; z-index: 100; display: none; align-items: center; gap: 8px; background: rgba(0,0,0,.7); padding: 8px 12px; border-radius: 8px; pointer-events: none; }
        #scoreEmoji { font-size: 24px; }
        #scoreText { color: white; font-size: 16px; font-weight: 900; min-width: 80px; }
        #statusEmoji { font-size: 24px; }
        #shopPanel { position: absolute; inset: 0; background: rgba(0,0,0,.85); z-index: 70; display: none; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; }
        #shopPanel h2 { color: #f39c12; margin-bottom: 20px; font-size: 28px; }
        .shopItem { background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.2); border-radius: 10px; padding: 15px; margin: 10px; cursor: pointer; transition: all .2s; width: 250px; text-align: center; }
        .shopItem:hover { background: rgba(255,255,255,.2); border-color: #f39c12; }
        .shopItem h3 { color: white; margin-bottom: 5px; }
        .shopItem p { color: #f39c12; font-weight: 900; }
        #closeShop { margin-top: 20px; padding: 10px 30px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
        .notification { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,.9); color: white; padding: 20px 40px; border-radius: 15px; font-size: 20px; font-weight: 900; z-index: 1000; pointer-events: none; animation: fadeOut 2s forwards; }
        @keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
        #droneInteractBtn { position: absolute; bottom: 35%; left: 50%; transform: translateX(-50%); padding: 15px 25px; background: #2ecc71; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: 900; cursor: pointer; display: none; pointer-events: auto; z-index: 55; }
        #droneUpBtn, #droneDownBtn, #droneExitBtn { position: absolute; right: 30px; width: 70px; height: 70px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(0,0,0,.35); color: white; font-size: 28px; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); cursor: pointer; z-index: 60; pointer-events: auto; user-select: none; }
        #droneExitBtn { bottom: 220px; background: rgba(231,76,60,.5); border-color: rgba(231,76,60,.8); font-size: 22px; }
        #droneUpBtn { bottom: 130px; }
        #droneDownBtn { bottom: 40px; }
        #droneUpBtn:active, #droneDownBtn:active, #droneExitBtn:active { background: rgba(255,255,255,.3); }
        #droneJoystickArea { position: absolute; left: 0; bottom: 0; width: 50%; height: 70%; touch-action: none; display: none; z-index: 55; }
        #droneJoystick { position: absolute; left: 80px; bottom: 100px; width: 130px; height: 130px; border-radius: 50%; background: rgba(0,0,0,.15); border: 2px solid rgba(255,255,255,.1); backdrop-filter: blur(4px); display: none; pointer-events: none; transform: translate(-50%,-50%); }
        #droneJoystick.active { display: block; }
        #droneStick { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin-left: -27px; margin-top: -27px; border-radius: 50%; background: rgba(255,255,255,.25); border: 2px solid rgba(255,255,255,.15); box-shadow: 0 0 30px rgba(0,0,0,.2); pointer-events: none; }
        #droneHint { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: white; background: rgba(0,0,0,.7); padding: 8px 16px; border-radius: 20px; font-size: 14px; pointer-events: none; z-index: 55; display: none; }
        #timeDisplay { position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,.75); color: white; padding: 10px 18px; border-radius: 10px; font-size: 20px; font-weight: 900; z-index: 100; pointer-events: none; font-family: 'Courier New', monospace; box-shadow: 0 2px 10px rgba(0,0,0,.3); letter-spacing: 2px; }
        
        /* Car Controls */
        #carEnterBtn { position: absolute; bottom: 30%; left: 50%; transform: translateX(-50%); padding: 15px 25px; background: #3498db; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: 900; cursor: pointer; display: none; pointer-events: auto; z-index: 55; }
        #carExitBtn { position: absolute; right: 40px; bottom: 300px; width: 70px; height: 70px; border-radius: 50%; border: 2px solid rgba(231,76,60,.8); background: rgba(231,76,60,.5); color: white; font-size: 22px; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); cursor: pointer; z-index: 60; pointer-events: auto; }
        #carExitBtn:active { background: rgba(255,255,255,.3); }
        #gasPedal, #brakePedal { position: absolute; right: 30px; border: 5px solid #fff; border-radius: 20px; cursor: pointer; display: none; z-index: 60; pointer-events: auto; box-shadow: 0 4px 20px rgba(0,0,0,.35); }
        #gasPedal { bottom: 165px; width: 95px; height: 165px; background: repeating-linear-gradient(to bottom, rgba(46,204,113,.9) 0 20px, rgba(46,204,113,.55) 20px 24px); }
        #brakePedal { bottom: 35px; width: 85px; height: 115px; background: repeating-linear-gradient(to bottom, rgba(231,76,60,.9) 0 16px, rgba(231,76,60,.55) 16px 20px); }
        #gasPedal:active, #brakePedal:active { transform: scale(.92); filter: brightness(1.25); }
        #steerLeftBtn, #steerRightBtn { position: absolute; bottom: 40px; width: 92px; height: 92px; border-radius: 50%; border: 5px solid #fff; background: radial-gradient(circle at 50% 25%, #8ec3f7, #2f6fd0 70%); color: white; font-size: 42px; display: none; align-items: center; justify-content: center; cursor: pointer; z-index: 60; pointer-events: auto; box-shadow: 0 4px 20px rgba(0,0,0,.35); }
        #steerLeftBtn { left: 30px; }
        #steerRightBtn { left: 140px; }
        #steerLeftBtn:active, #steerRightBtn:active { transform: scale(.9); }
    </style>
</head>
<body>
    <div id="game">
        <div id="loading">Загрузка...</div>
        <div id="startScreen">
            <h1>🚶 3D WALK</h1>
            <p>Скейт-парк + Военная база v2.0</p>
            <button id="startButton">▶ НАЧАТЬ ИГРАТЬ</button>
        </div>
        <div id="timeDisplay">12:00</div>
        <div id="controls">
            <div id="joystickArea"></div>
            <button id="jumpBtn" aria-label="Прыжок">⬆</button>
            <button id="skateBtn" aria-label="Сесть на скейт">🛹</button>
            <div id="joystick"><div id="stick"></div></div>
            <div id="droneJoystickArea"></div>
            <div id="droneJoystick"><div id="droneStick"></div></div>
            <button id="droneExitBtn" aria-label="Выйти из дрона">🚁</button>
            <button id="droneUpBtn" aria-label="Дрон вверх">⬆</button>
            <button id="droneDownBtn" aria-label="Дрон вниз">⬇</button>
            
            <!-- Car Controls -->
            <button id="steerLeftBtn" aria-label="Поворот влево">◀</button>
            <button id="steerRightBtn" aria-label="Поворот вправо">▶</button>
            <button id="gasPedal" aria-label="Педаль газа"></button>
            <button id="brakePedal" aria-label="Педаль тормоза и заднего хода"></button>
            <button id="carExitBtn" aria-label="Выйти из машины">🚗</button>
        </div>
        <button id="interactBtn">💬 Поговорить</button>
        <button id="shopInteractBtn">🛒 Магазин</button>
        <button id="droneInteractBtn">🚁 Сесть за дрон</button>
        <button id="carEnterBtn" aria-label="Сесть в машину">🚗 Сесть в машину</button>
        <div id="droneHint">🔄 Полный обзор 360° — свайпайте в любом направлении</div>
        <div id="dialogBox"><div id="dialogText"></div><button id="dialogNext">➡ Далее</button></div>
        <div id="questBox">📋 Задание #1: Покатайтесь 20 сек</div>
        <div id="miniMap"><canvas id="miniMapCanvas"></canvas></div>
        <div id="scoreBoard"><span id="scoreEmoji"></span><span id="scoreText">0</span><span id="statusEmoji"></span></div>
        <div id="shopPanel">
            <h2>🛒 МАГАЗИН</h2>
            <div class="shopItem" data-item="red"><h3>Красный скейт</h3><p>1,000 очков</p></div>
            <div class="shopItem" data-item="blue"><h3>Синий скейт</h3><p>5,000 очков</p></div>
            <div class="shopItem" data-item="gold"><h3>Золотой скейт</h3><p>42,000 очков</p></div>
            <button id="closeShop">❌ Закрыть</button>
        </div>
    </div>

    <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>

    <script type="module">
        import * as THREE from 'three';

        // Инициализация сцены, камеры и рендерера
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 60, 500);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 800);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        document.getElementById('game').appendChild(renderer.domElement);

        // Освещение
        const ambient = new THREE.AmbientLight(0x8899bb, 0.5);
        scene.add(ambient);
        const hemi = new THREE.HemisphereLight(0x87CEEB, 0x3a7d44, 1.0);
        scene.add(hemi);
        const sun = new THREE.DirectionalLight(0xffeedd, 2.5);
        sun.position.set(40, 60, 30);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 300;
        sun.shadow.camera.left = -100;
        sun.shadow.camera.right = 100;
        sun.shadow.camera.top = 100;
        sun.shadow.camera.bottom = -100;
        sun.bias = -0.001;
        scene.add(sun);
        scene.add(sun.target);

        const moon = new THREE.Mesh(new THREE.SphereGeometry(5, 32, 32), new THREE.MeshStandardMaterial({ color: 0xf5f5dc, emissive: 0x222233, emissiveIntensity: 0.4, roughness: 0.9 }));
        moon.position.set(-50, 80, -50);
        scene.add(moon);

        const starsGeometry = new THREE.BufferGeometry();
        const posArray = new Float32Array(1500 * 3);
        for(let i = 0; i < 1500 * 3; i++) posArray[i] = (Math.random() - 0.5) * 600;
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starsMaterial = new THREE.PointsMaterial({ size: 0.6, color: 0xffffff, transparent: true, opacity: 0 });
        scene.add(new THREE.Points(starsGeometry, starsMaterial));

        // Земля и платформа
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({ color: 0x3b5e2b, roughness: 1.0 }));
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const concreteMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.8 });
        const darkConcreteMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.7 });
        const metalMat = new THREE.MeshStandardMaterial({ color: 0xb0b0b0, roughness: 0.3, metalness: 0.8 });
        const graniteMat = new THREE.MeshStandardMaterial({ color: 0xa8a890, roughness: 0.6 });
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x6b4f3a, roughness: 0.7 });
        const treeTrunkMat = new THREE.MeshStandardMaterial({ color: 0x523826, roughness: 0.95 });
        const treeLeavesMat = new THREE.MeshStandardMaterial({ color: 0x2e4c35, roughness: 0.9 });
        const rockMat = new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.9, flatShading: true });
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.95 });
        const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.9 });
        const lampHeadMat = new THREE.MeshStandardMaterial({ color: 0xffffee, emissive: 0xffdd88, emissiveIntensity: 0, roughness: 0.3 });

        const playRedMat = new THREE.MeshStandardMaterial({color: 0xD32F2F, roughness: 0.5});
        const playYellowMat = new THREE.MeshStandardMaterial({color: 0xFBC02D, roughness: 0.5});
        const playBlueMat = new THREE.MeshStandardMaterial({color: 0x1976D2, roughness: 0.5});
        const playGreenMat = new THREE.MeshStandardMaterial({color: 0x388E3C, roughness: 0.5});
        const playMetalMat = new THREE.MeshStandardMaterial({color: 0x90A4AE, roughness: 0.4, metalness: 0.6});
        const playSandMat = new THREE.MeshStandardMaterial({color: 0xE6C288, roughness: 0.95});
        const playWoodMat = new THREE.MeshStandardMaterial({color: 0x795548, roughness: 0.7});
        const fenceMat = new THREE.MeshStandardMaterial({color: 0xFF7043, roughness: 0.6});

        // Military Materials
        const militaryWallMat = new THREE.MeshStandardMaterial({ color: 0x5d6d46, roughness: 0.85 });
        const militaryRoofMat = new THREE.MeshStandardMaterial({ color: 0x3e4a30, roughness: 0.9 });
        const barbedWireMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.4, metalness: 0.6 });
        const crateMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.8 });
        const barrelMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.3, metalness: 0.5 });
        const signMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });

        const colliders = [];
        function addBoxCollider(mesh) { colliders.push({ type: 'box', mesh: mesh, getBox: () => new THREE.Box3().setFromObject(mesh) }); }
        function addCylinderCollider(mesh, radius, height) { colliders.push({ type: 'cylinder', mesh: mesh, radius: radius, height: height, getPosition: () => mesh.getWorldPosition(new THREE.Vector3()) }); }
        function addSphereCollider(mesh, radius) { colliders.push({ type: 'sphere', mesh: mesh, radius: radius, getPosition: () => mesh.getWorldPosition(new THREE.Vector3()) }); }
        function addStaticCylinder(x, z, radius, height) { colliders.push({ type: 'cylinder', radius: radius, height: height, getPosition: () => new THREE.Vector3(x, height/2, z) }); }
        function addStaticBox(x1,y1,z1,x2,y2,z2){ const b = new THREE.Box3(new THREE.Vector3(x1,y1,z1), new THREE.Vector3(x2,y2,z2)); colliders.push({ type: 'box', getBox: () => b }); }
        function addBuildingCollider(x, z, w, h, d, rotY) {
            const cos = Math.abs(Math.cos(rotY)), sin = Math.abs(Math.sin(rotY));
            const hw = (w * cos + d * sin) / 2;
            const hd = (w * sin + d * cos) / 2;
            addStaticBox(x - hw, 0, z - hd, x + hw, h, z + hd);
        }

        function mat4(x,y,z, ry=0, sx=1,sy=1,sz=1, rx=0, rz=0){
            const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,rz));
            return new THREE.Matrix4().compose(new THREE.Vector3(x,y,z), q, new THREE.Vector3(sx,sy,sz));
        }
        function rotOffset(ry, lx, lz){ return [lx*Math.cos(ry)+lz*Math.sin(ry), -lx*Math.sin(ry)+lz*Math.cos(ry)]; }
        function createInstanced(geo, mat, matrices, colors=null, castShadow=false){
            if (matrices.length === 0) return null;
            const im = new THREE.InstancedMesh(geo, mat, matrices.length);
            matrices.forEach((m,i)=> im.setMatrixAt(i,m));
            if (colors) { colors.forEach((c,i)=> im.setColorAt(i,c)); im.instanceColor.needsUpdate = true; }
            im.castShadow = castShadow;
            im.receiveShadow = true;
            im.instanceMatrix.needsUpdate = true;
            scene.add(im);
            return im;
        }
        const unitBox = new THREE.BoxGeometry(1,1,1);

        const PLATFORM_SIZE = 68;
        const HALF_SIZE = 34;

        const platform = new THREE.Mesh(new THREE.BoxGeometry(PLATFORM_SIZE, 0.5, PLATFORM_SIZE), concreteMat);
        platform.position.set(0, 0.25, 0);
        platform.receiveShadow = true;
        platform.castShadow = true;
        scene.add(platform);
        addBoxCollider(platform);

        for (let side of [-1, 1]) {
            const border1 = new THREE.Mesh(new THREE.BoxGeometry(PLATFORM_SIZE, 0.8, 0.5), concreteMat);
            border1.position.set(0, 0.65, side * HALF_SIZE);
            border1.castShadow = true;
            scene.add(border1);
            addBoxCollider(border1);
            const border2 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.8, PLATFORM_SIZE), concreteMat);
            border2.position.set(side * HALF_SIZE, 0.65, 0);
            border2.castShadow = true;
            scene.add(border2);
            addBoxCollider(border2);
        }

        // Скейт-парк элементы
        const bowlGroup = new THREE.Group();
        bowlGroup.position.set(-12, 0.5, -12);
        scene.add(bowlGroup);
        const bowl = new THREE.Mesh(new THREE.SphereGeometry(3, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), darkConcreteMat);
        bowl.scale.y = 0.5;
        bowl.receiveShadow = true;
        bowlGroup.add(bowl);
        addSphereCollider(bowl, 3);

        const mannyPad = new THREE.Mesh(new THREE.BoxGeometry(6, 0.4, 3), graniteMat);
        mannyPad.position.set(-20, 0.7, 15);
        mannyPad.castShadow = true;
        scene.add(mannyPad);
        addBoxCollider(mannyPad);

        const stairsGroup = new THREE.Group();
        stairsGroup.position.set(0, 0.5, 20);
        scene.add(stairsGroup);
        for (let i = 0; i < 4; i++) {
            const step = new THREE.Mesh(new THREE.BoxGeometry(8, 0.5, 2), darkConcreteMat);
            step.position.set(0, i * 0.5 + 0.25, i * 2);
            step.castShadow = true;
            stairsGroup.add(step);
            addBoxCollider(step);
        }
        const slideRail = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 10, 12), metalMat);

            const hz = (w*sin + d*cos)/2;
            const m = 2;
            for (const b of placedBuildings) {
                if (Math.abs(x - b.x) < hx + b.hx + m && Math.abs(z - b.z) < hz + b.hz + m) return false;
            }

        function startDroneSound() {
            try {
                if (!droneAudio.ctx) droneAudio.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (droneAudio.ctx.state === 'suspended') droneAudio.ctx.resume();
                droneAudio.gain = droneAudio.ctx.createGain();
                droneAudio.gain.gain.value = 0.12;
                droneAudio.gain.connect(droneAudio.ctx.destination);
                droneAudio.oscs = [];
                [70, 140, 210].forEach((freq, i) => {
                    const osc = droneAudio.ctx.createOscillator();
                    osc.type = i === 0 ? 'sawtooth' : 'square';
                    osc.frequency.value = freq;
                    const g = droneAudio.ctx.createGain();
                    g.gain.value = 0.4 / (i + 1);
                    osc.connect(g);
                    g.connect(droneAudio.gain);
                    osc.start();
                    droneAudio.oscs.push(osc);
                });
            } catch (e) { console.log('Audio not supported'); }
        }
        function stopDroneSound() {
            try {
                droneAudio.oscs.forEach(o => o.stop());
                droneAudio.oscs = [];
                if (droneAudio.gain) droneAudio.gain.disconnect();
                droneAudio.gain = null;
            } catch (e) {}
        }
        function updateDroneSound() {
            if (!droneAudio.gain || droneAudio.oscs.length === 0) return;

            const base = 70 + activity * 40;
            droneAudio.oscs[0].frequency.setTargetAtTime(base, droneAudio.ctx.currentTime, 0.1);
            droneAudio.oscs[1].frequency.setTargetAtTime(base * 2, droneAudio.ctx.currentTime, 0.1);
            droneAudio.oscs[2].frequency.setTargetAtTime(base * 3, droneAudio.ctx.currentTime, 0.1);
        }

        function drawMiniMap() {
            const focus = getFocusPos();
            miniMapCanvas.width = 120;
            miniMapCanvas.height = 120;
            miniCtx.clearRect(0, 0, 120, 120);
            miniCtx.save();
            miniCtx.beginPath();
            miniCtx.arc(60, 60, 55, 0, Math.PI*2);
            miniCtx.clip();
            miniCtx.fillStyle = '#4CAF50';
            miniCtx.fillRect(0, 0, 120, 120);
            const scale = 0.3;
            miniCtx.fillStyle = '#555555';
            mapRoads.forEach(r => {
                const dx = (r.x - focus.x) * scale + 60;
                const dz = (r.z - focus.z) * scale + 60;
                miniCtx.save();
                miniCtx.translate(dx, dz);
                miniCtx.rotate(-(r.rot || 0));
                miniCtx.fillRect(-r.w*scale/2, -r.d*scale/2, r.w*scale, r.d*scale);
                miniCtx.restore();
            });
            miniCtx.fillStyle = '#8B7D6B';
            mapBuildings.forEach(b => {
                const dx = (b.x - focus.x) * scale + 60;
                const dz = (b.z - focus.z) * scale + 60;
                miniCtx.save();
                miniCtx.translate(dx, dz);
                miniCtx.rotate(-(b.rot || 0));
                miniCtx.fillRect(-b.w*scale/2, -b.d*scale/2, b.w*scale, b.d*scale);
                miniCtx.restore();
            });
            const spx = (0 - focus.x) * scale + 60;
            const spz = (0 - focus.z) * scale + 60;

            const rightX = Math.cos(carYaw), rightZ = -Math.sin(carYaw);
            const fwdX = Math.sin(carYaw), fwdZ = Math.cos(carYaw);
            const candidates = [
                [carGroup.position.x + rightX * 2.8, carGroup.position.z + rightZ * 2.8],
                [carGroup.position.x - rightX * 2.8, carGroup.position.z - rightZ * 2.8],
                [carGroup.position.x + fwdX * 4.2, carGroup.position.z + fwdZ * 4.2],
                [carGroup.position.x - fwdX * 4.2, carGroup.position.z - fwdZ * 4.2]
            ];
            let px = candidates[0][0], pz = candidates[0][1];
            for (const c of candidates) { if (!isColliding(c[0], 0, c[1])) { px = c[0]; pz = c[1]; break; } }
            const g = getGroundY(px, 0, pz);
            player.position.set(px, g.groundY, pz);
            velocityY = 0;
            player.visible = true;
            showNotification('🚶 Вы вышли из машины');
        }

        function carPointCollides(px, pz) {
            const R = 1.1;
            for (let i = 0; i < colliders.length; i++) {
                const col = colliders[i];
                if (col.isCar) continue;
                if (col.type === 'box') {
                    const box = col.getBox();
                    if (box.max.y < 0.4) continue;
                    if (px + R > box.min.x && px - R < box.max.x && pz + R > box.min.z && pz - R < box.max.z) return true;
                } else if (col.type === 'cylinder') {
                    const pos = col.getPosition();
                    const r = col.radius + R;
                    const dx = px - pos.x, dz = pz - pos.z;
                    if (dx * dx + dz * dz < r * r) return true;
                } else if (col.type === 'sphere') {
                    const pos = col.getPosition();
                    const r = col.radius + R;
                    const dx = px - pos.x, dz = pz - pos.z;
                    if (dx * dx + dz * dz < r * r) return true;
                }
            }
            return false;
        }
        function isCarColliding(x, z) {
            const fx = Math.sin(carYaw), fz = Math.cos(carYaw);
            return carPointCollides(x + fx * 1.8, z + fz * 1.8) || carPointCollides(x - fx * 1.8, z - fz * 1.8) || carPointCollides(x, z);
        }

        function updateCarPhysics(delta) {
            if (!gameStarted || !isCarMode) return;
            if (gasPressed) carSpeed += CAR_ACCEL * delta;
            else if (brakePressed) carSpeed -= CAR_BRAKE * delta;
            else if (carSpeed > 0) carSpeed = Math.max(0, carSpeed - CAR_FRICTION * delta);
            else carSpeed = Math.min(0, carSpeed + CAR_FRICTION * delta);
            carSpeed = THREE.MathUtils.clamp(carSpeed, CAR_MAX_REVERSE, CAR_MAX_SPEED);
            steerInput = (steerLeftPressed ? 1 : 0) + (steerRightPressed ? -1 : 0);
            const speedFactor = THREE.MathUtils.clamp(Math.abs(carSpeed) / 8, 0, 1);
            carYaw += steerInput * CAR_TURN_RATE * speedFactor * delta * (carSpeed >= 0 ? 1 : -1);
            const fx = Math.sin(carYaw), fz = Math.cos(carYaw);
            const nx = carGroup.position.x + fx * carSpeed * delta;
            const nz = carGroup.position.z + fz * carSpeed * delta;
            if (!isCarColliding(nx, nz)) { carGroup.position.x = nx; carGroup.position.z = nz; }
            else carSpeed *= -0.2;
            carGroup.rotation.y = carYaw;
            for (const w of carWheelSpin) w.rotation.x += (carSpeed * delta) / 0.45;
            const targetSteer = steerInput * 0.42;
            for (const g of carSteerGroups) g.rotation.y = THREE.MathUtils.lerp(g.rotation.y, targetSteer, Math.min(1, delta * 8));
        }

        function updateCarCamera(delta) {
            if (!isCarMode) return;
            const smooth = 1 - Math.pow(0.002, delta);
            carCamYaw = THREE.MathUtils.lerp(carCamYaw, carCamTargetYaw, smooth);
            carCamPitch = THREE.MathUtils.lerp(carCamPitch, carCamTargetPitch, smooth);
            const dist = 9.0;
            const heightOffset = Math.sin(carCamPitch) * dist;
            const horizDist = Math.cos(carCamPitch) * dist;
            const camX = carGroup.position.x - Math.sin(carCamYaw) * horizDist;
            const camZ = carGroup.position.z - Math.cos(carCamYaw) * horizDist;
            const camY = carGroup.position.y + 2.5 + heightOffset;
            camera.position.set(camX, camY, camZ);
            camera.lookAt(carGroup.position.x, carGroup.position.y + 1.5, carGroup.position.z);
        }

        function checkDroneCollision() {
            if (!isDroneMode) return false;
            const dronePos = droneGroup.position.clone();
            dronePos.y += 0.3;
            if (dronePos.y < 0.3 && droneSpeed > 8.0) return true;
            for (let i = 0; i < colliders.length; i++) {
                const col = colliders[i];
                if (col.type === 'box') {
                    const box = col.getBox();
                    if (dronePos.x + 1.2 > box.min.x && dronePos.x - 1.2 < box.max.x &&
                        dronePos.z + 1.2 > box.min.z && dronePos.z - 1.2 < box.max.z) {
                        if (dronePos.y + 1.2 > box.min.y && dronePos.y < box.max.y) {
                            if (droneSpeed > 6.0) return true;
                        }
                    }
                } else if (col.type === 'cylinder') {
                    const pos = col.getPosition();
                    const dx = dronePos.x - pos.x, dz = dronePos.z - pos.z;
                    const radius = col.radius + 1.0;
                    if (dx*dx + dz*dz < radius*radius) {
                        const top = pos.y + col.height/2, bottom = pos.y - col.height/2;
                        if (dronePos.y > bottom && dronePos.y < top && droneSpeed > 6.0) return true;
                    }
                } else if (col.type === 'sphere') {
                    const pos = col.getPosition();
                    const dx = dronePos.x - pos.x, dz = dronePos.z - pos.z;
                    const radius = col.radius + 1.0;
                    if (dx*dx + dz*dz < radius*radius) {
                        if (dronePos.y > pos.y - col.radius && dronePos.y < pos.y + col.radius && droneSpeed > 6.0) return true;
                    }
                }
            }
            return false;
        }

        function updateDronePhysics(delta) {
            if (!gameStarted || !isDroneMode) return;
            let x = droneMoveX, z = droneMoveZ;
            const len = Math.sqrt(x*x + z*z);
            if (len > 1) { x /= len; z /= len; }
            const forward = new THREE.Vector3(-Math.sin(droneYaw), 0, -Math.cos(droneYaw));
            const right = new THREE.Vector3(Math.cos(droneYaw), 0, -Math.sin(droneYaw));
            const dir = new THREE.Vector3().addScaledVector(forward, -z).addScaledVector(right, x);
            if (dir.length() > 0.1) {
                dir.normalize();
                droneGroup.position.x += dir.x * 12.0 * delta;
                droneGroup.position.z += dir.z * 12.0 * delta;
                droneSpeed = 12.0;
            } else droneSpeed *= 0.95;
            if (Math.abs(droneGroup.position.y - droneTargetHeight) > 0.01) {
                const direction = droneTargetHeight > droneGroup.position.y ? 1 : -1;
                droneGroup.position.y += direction * 5.0 * delta;
                if (Math.abs(droneGroup.position.y - droneTargetHeight) <= 0.05) droneGroup.position.y = droneTargetHeight;
            }
            droneGroup.rotation.y = droneYaw;
            if (checkDroneCollision()) exitDroneMode(true);
        }

        function updateDroneCamera(delta) {

            droneYaw = THREE.MathUtils.lerp(droneYaw, droneTargetYaw, smooth);
            dronePitch = THREE.MathUtils.lerp(dronePitch, droneTargetPitch, smooth);
            camera.position.copy(droneGroup.position);

                droneGroup.position.y + 0.3 + Math.sin(dronePitch),
                droneGroup.position.z - Math.cos(droneYaw)*Math.cos(dronePitch)
            ));
        }

        function isColliding(px, py, pz) {
            for (let i = 0; i < colliders.length; i++) {
                const col = colliders[i];
                if (col.type === 'box') {
                    const box = col.getBox();
                    if (px + PLAYER_RADIUS > box.min.x && px - PLAYER_RADIUS < box.max.x &&
                        pz + PLAYER_RADIUS > box.min.z && pz - PLAYER_RADIUS < box.max.z) {
                        if (py + PLAYER_HEIGHT > box.min.y && py < box.max.y) return true;
                    }
                } else if (col.type === 'cylinder') {
                    const pos = col.getPosition();
                    const dx = px - pos.x, dz = pz - pos.z;
                    const radius = col.radius + PLAYER_RADIUS;
                    if (dx*dx + dz*dz < radius*radius) {
                        const top = pos.y + col.height/2, bottom = pos.y - col.height/2;
                        if (py + PLAYER_HEIGHT > bottom && py < top) return true;
                    }
                } else if (col.type === 'sphere') {
                    const pos = col.getPosition();
                    const dx = px - pos.x, dz = pz - pos.z;
                    const radius = col.radius + PLAYER_RADIUS;
                    if (dx*dx + dz*dz < radius*radius) {
                        if (py + PLAYER_HEIGHT > pos.y - col.radius && py < pos.y + col.radius) return true;
                    }
                }
            }
            return false;
        }

        function getGroundY(px, py, pz) {
            let groundY = 0, onGround = false;
            if (Math.abs(px) < HALF_SIZE && Math.abs(pz) < HALF_SIZE) { groundY = 0.5; onGround = true; }
            for (let i = 0; i < colliders.length; i++) {
                const col = colliders[i];
                if (col.type === 'box') {
                    const box = col.getBox();
                    if (px + PLAYER_RADIUS > box.min.x && px - PLAYER_RADIUS < box.max.x &&
                        pz + PLAYER_RADIUS > box.min.z && pz - PLAYER_RADIUS < box.max.z) {
                        if (py <= box.max.y && py > box.max.y - 1.0) { groundY = Math.max(groundY, box.max.y); onGround = true; }
                    }
                } else if (col.type === 'sphere') {
                    const pos = col.getPosition();
                    const dx = px - pos.x, dz = pz - pos.z;
                    if (dx*dx + dz*dz < (col.radius+0.1)*(col.radius+0.1)) {
                        const top = pos.y + col.radius;
                        if (py <= top && py > top - 2.0) { groundY = Math.max(groundY, top); onGround = true; }
                    }
                }
            }
            return { groundY, onGround };
        }

        function updatePlayerPhysics(delta) {
            if (!gameStarted || isDroneMode || isCarMode) return;
            let x = moveX, z = moveZ;
            if (keys['w']) z = -1;
            if (keys['s']) z = 1;
            if (keys['a']) x = -1;
            if (keys['d']) x = 1;
            const len = Math.sqrt(x*x + z*z);
            if (len > 1) { x /= len; z /= len; }
            const moving = Math.abs(x) > 0.05 || Math.abs(z) > 0.05;
            const currentSpeed = isSkating ? SKATE_SPEED : WALK_SPEED;
            if (moving && !isPerformingTrick) {
                const forward = new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw));
                const right = new THREE.Vector3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw));
                const dir = new THREE.Vector3().addScaledVector(forward, -z).addScaledVector(right, x);
                if (dir.length() > 0.1) {
                    dir.normalize();
                    player.position.x += dir.x * currentSpeed * delta;
                    if (isColliding(player.position.x, player.position.y, player.position.z)) player.position.x -= dir.x * currentSpeed * delta;
                    player.position.z += dir.z * currentSpeed * delta;
                    if (isColliding(player.position.x, player.position.y, player.position.z)) player.position.z -= dir.z * currentSpeed * delta;
                    player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, Math.atan2(dir.x, dir.z), delta * 12);
                }
            }
            if (questActive && isSkating && moving) {
                skateTime += delta;
                questBox.textContent = `📋 Задание #1: Покатайтесь ${Math.floor(skateTime)}/20 сек`;
                if (skateTime >= 20) questBox.textContent = '✅ Задание выполнено! Поговорите с НПС';
            }
            velocityY -= GRAVITY * delta;
            player.position.y += velocityY * delta;
            const groundInfo = getGroundY(player.position.x, player.position.y, player.position.z);
            if (velocityY <= 0 && player.position.y <= groundInfo.groundY && groundInfo.onGround) {
                player.position.y = groundInfo.groundY; velocityY = 0; grounded = true;
            } else if (player.position.y <= 0) {
                player.position.y = 0; velocityY = 0; grounded = true;
            } else grounded = false;
        }

                    torso.position.y = 3.2 + Math.abs(Math.sin(walkTime * 2)) * 0.05;

        function updatePlayerCamera(delta) {
            if (isDroneMode || isCarMode) return;

        function createEpicExplosion(pos) {
            explosionGroup.position.copy(pos);
            explosionGroup.visible = true;
            explosionGroup.userData.life = 0;
            
            // Удаляем старые частицы
            while (explosionGroup.children.length > 0) {
                const child = explosionGroup.children[0];
                explosionGroup.remove(child);
                if (child.geometry) child.geometry.dispose();
                if (child.material) child.material.dispose();
            }
            
            // Создаем новые частицы
            const colors = [0xff4500, 0xff0000, 0xffd700, 0xffffff, 0x8b0000];
            for (let i = 0; i < 15; i++) {
                const size = 0.2 + Math.random() * 0.5;
                const geo = new THREE.SphereGeometry(size, 8, 8);
                const mat = new THREE.MeshStandardMaterial({
                    color: colors[Math.floor(Math.random() * colors.length)],
                    emissive: new THREE.Color(colors[Math.floor(Math.random() * colors.length)]),
                    emissiveIntensity: 2,
                    roughness: 0.3,
                    transparent: true,
                    opacity: 1
                });
                const sphere = new THREE.Mesh(geo, mat);
                sphere.position.set((Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.5);
                sphere.userData.velocity = new THREE.Vector3((Math.random() - 0.5) * 15, Math.random() * 12, (Math.random() - 0.5) * 15);
                sphere.userData.isFireball = true;
                explosionGroup.add(sphere);
            }
            for (let i = 0; i < 5; i++) {
                const geo = new THREE.TorusGeometry(0.3, 0.05, 8, 16);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    emissive: 0xffffff,
                    emissiveIntensity: 2,
                    transparent: true,
                    opacity: 0.8
                });
                const ring = new THREE.Mesh(geo, mat);
                ring.userData.isRing = true;
                explosionGroup.add(ring);
            }
            for (let i = 0; i < 10; i++) {
                const geo = new THREE.SphereGeometry(0.3, 8, 8);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0x555555,
                    roughness: 0.9,
                    transparent: true,
                    opacity: 0.9
                });

                spark.position.set((Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.2);
                spark.userData.velocity = new THREE.Vector3((Math.random() - 0.5) * 20, Math.random() * 15, (Math.random() - 0.5) * 20);
                spark.userData.isSpark = true;
                explosionGroup.add(spark);

        // НПС (тренер)
        const npcGroup = new THREE.Group();
        npcGroup.position.set(15, 0.5, 15);
        npcGroup.rotation.y = Math.PI;
        scene.add(npcGroup);
        const npcSkinMat = new THREE.MeshStandardMaterial({ color: 0xf4c28a, roughness: 0.55 });
        const npcSkinDarkMat = new THREE.MeshStandardMaterial({ color: 0xd9a878, roughness: 0.6 });
        const npcHairMat = new THREE.MeshStandardMaterial({ color: 0x2a1810, roughness: 0.9 });
        const npcShirtMat = new THREE.MeshStandardMaterial({ color: 0xe85d2f, roughness: 0.6 });
        const npcPantsMat = new THREE.MeshStandardMaterial({ color: 0x2d3a55, roughness: 0.75 });
        const npcShoeMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5 });
        const npcShoeAccentMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
        const npcEyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
        const npcEyeMat = new THREE.MeshStandardMaterial({ color: 0x3a2810, roughness: 0.2 });
        const npcPupilMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.1 });
        const npcMouthMat = new THREE.MeshStandardMaterial({ color: 0x8b3a2a, roughness: 0.4 });
        const npcBrowMat = new THREE.MeshStandardMaterial({ color: 0x2a1810, roughness: 0.8 });
        const npcBackpackMat = new THREE.MeshStandardMaterial({ color: 0x3a5a8a, roughness: 0.7 });
        const npcBeltMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5 });
        const npcGoldMat = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.3, metalness: 0.8 });

        for (let side of [-1, 1]) {
            const thigh = new THREE.Mesh(new THREE.BoxGeometry(0.55, 1.2, 0.55), npcPantsMat);
            thigh.position.set(side*0.4, 0.9, 0); thigh.castShadow = true; npcGroup.add(thigh);
            const shin = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.1, 0.5), npcPantsMat);
            shin.position.set(side*0.4, 0.2, 0); npcGroup.add(shin);
            const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.35, 0.9), npcShoeMat);
            shoe.position.set(side*0.4, -0.15, 0.1); npcGroup.add(shoe);
            const sole = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.08, 0.92), new THREE.MeshStandardMaterial({color: 0x333333}));

            for (let i = 0; i < 3; i++) {
                const lace = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.04, 0.04), npcShoeAccentMat);
                lace.position.set(side*0.4, 0.05, 0.15 + i*0.12); npcGroup.add(lace);
            }
        }
        const npcBelt = new THREE.Mesh(new THREE.BoxGeometry(1.55, 0.2, 1.05), npcBeltMat);
        npcBelt.position.y = 1.55; npcGroup.add(npcBelt);
        const npcBuckle = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.18, 0.05), npcGoldMat);
        npcBuckle.position.set(0, 1.55, 0.55); npcGroup.add(npcBuckle);
        const npcBody = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.0, 1.0), npcShirtMat);
        npcBody.position.y = 2.65; npcBody.castShadow = true; npcGroup.add(npcBody);
        const npcCollar = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 0.15, 16), new THREE.MeshStandardMaterial({color: 0xc04820}));
        npcCollar.position.y = 3.7; npcGroup.add(npcCollar);
        const npcShirtStripe = new THREE.Mesh(new THREE.BoxGeometry(1.62, 0.15, 0.02), new THREE.MeshStandardMaterial({color: 0xffffff}));
        npcShirtStripe.position.set(0, 2.8, 0.51); npcGroup.add(npcShirtStripe);
        const npcArms = [];
        for (let side of [-1, 1]) {
            const armGroup = new THREE.Group();
            armGroup.position.set(side * 1.0, 3.4, 0);
            const shoulder = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.5, 0.55), npcShirtMat);
            shoulder.position.y = 0.1;
            const forearm = new THREE.Mesh(new THREE.BoxGeometry(0.38, 1.0, 0.38), npcSkinMat);
            forearm.position.y = -0.8;
            const hand = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.45, 0.3), npcSkinMat);
            hand.position.y = -1.5;
            armGroup.add(shoulder); armGroup.add(forearm); armGroup.add(hand);
            npcGroup.add(armGroup);
            npcArms.push(armGroup);
            if (side === -1) {
                const watch = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.2, 0.42), new THREE.MeshStandardMaterial({color: 0x111111}));
                watch.position.y = -0.5;
                armGroup.add(watch);
                const watchFace = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.05, 0.3), new THREE.MeshStandardMaterial({color: 0x00ff88, emissive: 0x00ff88, emissiveIntensity: 0.5}));
                watchFace.position.set(0, -0.5, 0.22);
                armGroup.add(watchFace);
            }
        }
        const npcNeck = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 0.3, 12), npcSkinMat);
        npcNeck.position.y = 3.8; npcGroup.add(npcNeck);
        const npcHeadRef = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.4, 1.3), npcSkinMat);
        npcHeadRef.position.y = 4.6; npcHeadRef.castShadow = true; npcGroup.add(npcHeadRef);
        const npcJaw = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.4, 1.1), npcSkinMat);
        npcJaw.position.y = 4.0; npcGroup.add(npcJaw);
        const npcHairTop = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.3, 1.35), npcHairMat);
        npcHairTop.position.y = 5.35; npcGroup.add(npcHairTop);
        const npcHairBack = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.8, 0.2), npcHairMat);
        npcHairBack.position.set(0, 4.9, -0.6); npcGroup.add(npcHairBack);
        const npcHairSide1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 1.2), npcHairMat);
        npcHairSide1.position.set(-0.6, 5.0, 0); npcGroup.add(npcHairSide1);
        const npcHairSide2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 1.2), npcHairMat);
        npcHairSide2.position.set(0.6, 5.0, 0); npcGroup.add(npcHairSide2);
        for (let side of [-1, 1]) {
            const ear = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.35, 0.25), npcSkinDarkMat);
            ear.position.set(side*0.72, 4.6, 0); npcGroup.add(ear);
            const eyeWhite = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 12), npcEyeWhiteMat);
            eyeWhite.position.set(side*0.3, 4.7, 0.65); npcGroup.add(eyeWhite);
            const iris = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 12), npcEyeMat);
            iris.position.set(side*0.3, 4.7, 0.75); npcGroup.add(iris);
            const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), npcPupilMat);
            pupil.position.set(side*0.3, 4.7, 0.82); npcGroup.add(pupil);
            const brow = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.08, 0.1), npcBrowMat);
            brow.position.set(side*0.3, 4.95, 0.68); brow.rotation.z = side * -0.15; npcGroup.add(brow);
        }
        const npcNose = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.35, 0.25), npcSkinDarkMat);
        npcNose.position.set(0, 4.45, 0.75); npcGroup.add(npcNose);
        const npcNoseTip = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), npcSkinDarkMat);
        npcNoseTip.position.set(0, 4.3, 0.8); npcGroup.add(npcNoseTip);
        const npcMouth = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.08, 0.05), npcMouthMat);
        npcMouth.position.set(0, 4.1, 0.68); npcGroup.add(npcMouth);
        for (let side of [-1, 1]) {
            const mc = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.06, 0.05), npcMouthMat);
            mc.position.set(side*0.22, 4.12, 0.68); npcGroup.add(mc);
        }
        const npcBackpack = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.6), npcBackpackMat);
        npcBackpack.position.set(0, 2.8, -0.8); npcGroup.add(npcBackpack);
        const npcBackpackPocket = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 0.1), new THREE.MeshStandardMaterial({color: 0x2a4a7a}));
        npcBackpackPocket.position.set(0, 2.4, -1.1); npcGroup.add(npcBackpackPocket);
        for (let side of [-1, 1]) {
            const strap = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.8, 0.1), npcBackpackMat);
            strap.position.set(side*0.45, 2.9, -0.4); strap.rotation.x = -0.1; npcGroup.add(strap);
        }
        const npcZipper = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1.3, 0.05), npcGoldMat);
        npcZipper.position.set(0, 2.8, -1.08); npcGroup.add(npcZipper);
        const npcSkateGroup = new THREE.Group();
        npcSkateGroup.position.set(1.2, 2.0, 0.3);
        npcSkateGroup.rotation.z = 0.2;
        npcSkateGroup.rotation.y = Math.PI / 4;
        npcGroup.add(npcSkateGroup);
        const npcSkateDeck = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.12, 2.2), new THREE.MeshStandardMaterial({ color: 0xff6600, roughness: 0.4 }));
        npcSkateGroup.add(npcSkateDeck);
        for (let side of [-1, 1]) for (let front of [-1, 1]) {
            const npcWheel = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.2, 12), new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.3}));
            npcWheel.rotation.x = Math.PI / 2;
            npcWheel.position.set(side*0.4, -0.15, front*0.85);
            npcSkateGroup.add(npcWheel);
        }
        const indicator = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffff00, emissiveIntensity: 0.8 }));
        indicator.position.y = 6.2;
        npcGroup.add(indicator);
        const indicatorGlow = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffff00, emissiveIntensity: 0.4, transparent: true, opacity: 0.3 }));
        indicatorGlow.position.y = 6.2;
        npcGroup.add(indicatorGlow);

        let npcAnimState = 'idle';
        let npcStateTimer = 3;
        function updateNPCAnimation(delta, time) {
            npcStateTimer -= delta;
            if (npcStateTimer <= 0) {
                const states = ['idle', 'wave', 'clap', 'nod', 'idle'];
                npcAnimState = states[Math.floor(Math.random() * states.length)];
                npcStateTimer = 3 + Math.random() * 4;
            }
            const t = time;
            if (npcAnimState === 'wave') {
                npcArms[1].rotation.z = -2.5 + Math.sin(t * 8) * 0.4;
                npcArms[1].rotation.x = 0;
                npcArms[0].rotation.set(0, 0, 0);
                npcHeadRef.rotation.z = Math.sin(t * 4) * 0.1;
            } else if (npcAnimState === 'clap') {
                const clapPhase = Math.abs(Math.sin(t * 6));
                npcArms[0].rotation.z = 0.8 - clapPhase * 0.7;
                npcArms[1].rotation.z = -0.8 + clapPhase * 0.7;
                npcArms[0].rotation.x = -0.5;
                npcArms[1].rotation.x = -0.5;
                npcHeadRef.rotation.set(0, 0, 0);
            } else if (npcAnimState === 'nod') {
                npcHeadRef.rotation.x = Math.sin(t * 5) * 0.2;
                npcArms[0].rotation.set(0, 0, 0);
                npcArms[1].rotation.set(0, 0, 0);
            } else {
                npcArms[0].rotation.set(Math.sin(t * 2) * 0.05, 0, 0);
                npcArms[1].rotation.set(-Math.sin(t * 2) * 0.05, 0, 0);
                npcHeadRef.rotation.set(0, Math.sin(t * 1.5) * 0.15, 0);
            }
        }

        const dancerGroup = new THREE.Group();
        dancerGroup.position.set(-25, 2.0, -25);
        scene.add(dancerGroup);

        function createSegment(width, height, depth, color, emissive = 0x000000, roughness = 0.4, metalness = 0.7) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), new THREE.MeshStandardMaterial({ color: color, emissive: new THREE.Color(emissive), roughness: roughness, metalness: metalness }));
            mesh.castShadow = true;
            return mesh;
        }

        const number6Group = new THREE.Group();
        number6Group.position.set(-0.9, 0, 0);
        dancerGroup.add(number6Group);
        const segW = 0.4, segD = 0.4, hSeg = 1.2, wTop = 1.1, wMid = 1.1, wBot = 1.2;
        const yTop = 0.75, yMid = 0.0, yBot = -0.75;
        const color6 = 0xff8800, emissive6 = 0x331100;
        const top6 = createSegment(wTop, 0.3, segD, color6, emissive6); top6.position.set(0.35, yTop, 0); number6Group.add(top6);
        const mid6 = createSegment(wMid, 0.3, segD, color6, emissive6); mid6.position.set(0.35, yMid, 0); number6Group.add(mid6);
        const bot6 = createSegment(wBot, 0.3, segD, color6, emissive6); bot6.position.set(0.35, yBot, 0); number6Group.add(bot6);
        const leftTop6 = createSegment(segW, hSeg, segD, color6, emissive6); leftTop6.position.set(0.0, 0.35, 0); number6Group.add(leftTop6);
        const leftBot6 = createSegment(segW, hSeg, segD, color6, emissive6); leftBot6.position.set(0.0, -0.35, 0); number6Group.add(leftBot6);
        const rightBot6 = createSegment(segW, hSeg, segD, color6, emissive6); rightBot6.position.set(0.7, -0.35, 0); number6Group.add(rightBot6);

        const number7Group = new THREE.Group();
        number7Group.position.set(1.1, 0, 0);
        dancerGroup.add(number7Group);
        const color7 = 0x44aaff, emissive7 = 0x002244;
        const top7 = createSegment(1.3, 0.3, segD, color7, emissive7); top7.position.set(0.15, yTop + 0.1, 0); number7Group.add(top7);
        const diagonalSegments = 5, diagStartX = 0.65, diagEndX = -0.35, diagStartY = 0.45, diagEndY = -0.55;
        for (let i = 0; i < diagonalSegments; i++) {
            const t = i / (diagonalSegments - 1);
            const diagSeg = createSegment(0.35, 0.3, segD, color7, emissive7);
            diagSeg.position.set(diagStartX + (diagEndX - diagStartX) * t, diagStartY + (diagEndY - diagStartY) * t, 0);
            diagSeg.rotation.z = Math.PI / 4;
            number7Group.add(diagSeg);
        }
        const tail7 = createSegment(0.4, 0.25, segD, color7, emissive7); tail7.position.set(-0.35, -0.7, 0); number7Group.add(tail7);
        const rightLeg7 = createSegment(0.4, 1.4, segD, color7, emissive7); rightLeg7.position.set(0.65, -0.2, 0); number7Group.add(rightLeg7);

        function createGlowSphere(radius, color, position, parent, emissiveIntensity = 1.0) {
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(radius, 32, 32), new THREE.MeshStandardMaterial({ color: color, emissive: new THREE.Color(color).multiplyScalar(emissiveIntensity), roughness: 0.2, metalness: 0.1 }));
            sphere.position.set(position.x, position.y, position.z);
            parent.add(sphere);
            return sphere;
        }
        createGlowSphere(0.15, 0xffdd00, {x: 0.2, y: 0.6, z: 0.25}, number6Group, 1.5);
        createGlowSphere(0.15, 0xffdd00, {x: 0.2, y: 0.2, z: 0.25}, number6Group, 1.5);
        createGlowSphere(0.15, 0x00ffff, {x: 0.3, y: 0.3, z: 0.25}, number7Group, 1.5);
        createGlowSphere(0.15, 0x00ffff, {x: -0.1, y: 0.1, z: 0.25}, number7Group, 1.5);

        // Анимация и основной цикл
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            let delta = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;
            const elapsedTime = now * 0.001;

            if (gameStarted) updateSunFollow();
            if (gameStarted) {
                updateTimeCycle(delta);
                updateNPCAnimation(delta, elapsedTime);
                
                const focus = getFocusPos();
                const distToGate = focus.distanceTo(new THREE.Vector3(gateX, 0, gateZ));
                if (distToGate < 30 && !isGateOpen) {
                    gateInteractTimer += delta;
                    if (gateInteractTimer > 1.0) openBaseGate();
                }
                if (isGateOpen) {
                    baseGateLeft.position.x = THREE.MathUtils.lerp(baseGateLeft.position.x, gateX - 14, delta * 2);
                    baseGateRight.position.x = THREE.MathUtils.lerp(baseGateRight.position.x, gateX + 14, delta * 2);
                    baseBarrierL.rotation.x = THREE.MathUtils.lerp(baseBarrierL.rotation.x, -Math.PI / 2.2, delta * 2);
                    baseBarrierR.rotation.x = THREE.MathUtils.lerp(baseBarrierR.rotation.x, -Math.PI / 2.2, delta * 2);
                } else {
                    baseGateLeft.position.x = THREE.MathUtils.lerp(baseGateLeft.position.x, gateX - 7, delta * 2);
                    baseGateRight.position.x = THREE.MathUtils.lerp(baseGateRight.position.x, gateX + 7, delta * 2);
                    baseBarrierL.rotation.x = THREE.MathUtils.lerp(baseBarrierL.rotation.x, 0, delta * 2);
                    baseBarrierR.rotation.x = THREE.MathUtils.lerp(baseBarrierR.rotation.x, 0, delta * 2);
                }

                if (isDroneMode) {
                    updateDronePhysics(delta);
                    updateDroneVertical(delta);
                    updateDroneAnimation();
                    updateDroneCamera(delta);
                    updateDroneSound();
                } else if (isCarMode) {
                    updateCarPhysics(delta);
                    updateCarCamera(delta);
                } else {
                    updatePlayerPhysics(delta);
                    updateTrickSystem(delta);
                    animateCharacter(delta);
                    updatePlayerCamera(delta);
                    checkNPCDistance();
                    checkShopDistance();
                    checkDroneDistance();
                    checkCarDistance();
                    if (tutorialComplete) scoreBoard.style.display = isOnSkatePark() ? 'flex' : 'none';
                    secrets.forEach(s => {
                        if (!s.found && player.position.distanceTo(s.pos) < 2.2) {
                            s.found = true;
                            s.mesh.visible = false;
                            score += s.bonus;
                            updateScoreDisplay();
                            showNotification(`🌟 Секретная локация! +${s.bonus.toLocaleString()} очков`);
                        }
                    });
                }
                drawMiniMap();
            }

            if (spinningCarousel) spinningCarousel.rotation.y += delta * 0.8;
            dancerGroup.position.y = 2.0 + Math.sin(elapsedTime * 8) * 0.25;
            dancerGroup.rotation.y = Math.sin(elapsedTime * 0.8) * 0.4;
            dancerGroup.rotation.z = Math.sin(elapsedTime * 4) * 0.15;
            dancerGroup.rotation.x = Math.sin(elapsedTime * 6) * 0.1;
            number6Group.rotation.z = Math.sin(elapsedTime * 10) * 0.3;
            number7Group.rotation.z = Math.sin(elapsedTime * 9 + 2) * 0.25;
            number7Group.position.y = Math.cos(elapsedTime * 13) * 0.15;
            const pulseScale = 1 + Math.sin(now * 0.005) * 0.25;
            indicator.scale.setScalar(pulseScale);
            indicatorGlow.scale.setScalar(pulseScale * 1.2);
            secrets.forEach(s => {
                if (!s.found) {
                    s.mesh.position.y = s.pos.y + Math.sin(elapsedTime * 3) * 0.2;
                    s.mesh.rotation.y = elapsedTime * 2;
                }
            });

            if (explosionGroup.visible) {
                explosionGroup.userData.life += delta;
                if (explosionGroup.userData.life >= explosionGroup.userData.maxLife) explosionGroup.visible = false;
                else {
                    const lifeRatio = explosionGroup.userData.life / explosionGroup.userData.maxLife;
                    explosionGroup.children.forEach(child => {
                        if (child.userData.velocity) {
                            child.position.add(child.userData.velocity.clone().multiplyScalar(delta));
                            child.userData.velocity.y -= 15 * delta;
                        }
                        if (child.userData.isSmoke) { child.scale.setScalar(1 + lifeRatio * 5); child.material.opacity = 0.9 * (1 - lifeRatio); }
                        if (child.userData.isFireball) { child.scale.setScalar(1 + lifeRatio * 3); child.material.opacity = 1 - lifeRatio * 0.8; }
                        if (child.userData.isRing) { child.scale.setScalar(1 + lifeRatio * 8); child.material.opacity = 0.8 * (1 - lifeRatio); }
                        if (child.userData.isSpark) child.material.opacity = 1 - lifeRatio;
                    });
                }
            }

            renderer.render(scene, camera);
        }

        document.getElementById('loading').style.display = 'none';
        animate();
        console.log('🚶 3D WALK — Military Base v2.0 Ready!');
    </script>
