<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ГРАНЬ — 3D мастерская</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{background:#0f1626;color:#e8eefb;font-family:'Rubik',system-ui,sans-serif;font-size:15px;
    -webkit-user-select:none;user-select:none}
  #scene{position:fixed;inset:0;z-index:0}
  #scene canvas{display:block;touch-action:none;cursor:grab}
  #vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(60% 40% at 50% 0%, rgba(90,170,255,.09), transparent 70%),
      radial-gradient(120% 95% at 50% 42%, transparent 55%, rgba(5,9,18,.62) 100%)}

  #bar{position:fixed;top:14px;left:14px;right:14px;z-index:20;display:flex;align-items:center;gap:10px;
    flex-wrap:wrap;padding:10px 16px;border:1px solid #26324e;border-radius:16px;
    background:rgba(15,21,36,.92);box-shadow:0 12px 40px rgba(0,0,0,.45)}
  .brand{display:flex;align-items:center;gap:11px;margin-right:6px}
  .brand svg{width:30px;height:30px;filter:drop-shadow(0 3px 8px rgba(255,164,52,.35))}
  .brand-name{font-family:'Russo One',sans-serif;font-size:19px;letter-spacing:2px;color:#ffd08a}
  .brand-sub{display:block;font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:#7d90b4}
  .grow{flex:1}
  .chip{padding:7px 13px;border:1px solid #2b3a5e;border-radius:999px;background:#141d31;color:#8ea3c4;
    font-size:13px;white-space:nowrap}
  .chip b{color:#ffd08a;font-weight:600}

  .btn{display:inline-flex;align-items:center;gap:8px;font:600 14px 'Rubik',sans-serif;padding:10px 16px;
    border-radius:11px;border:1px solid transparent;cursor:pointer;touch-action:manipulation;
    transition:transform .18s, box-shadow .18s, background .18s, border-color .18s}
  .btn svg{width:17px;height:17px;flex:none}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(0) scale(.97)}
  .btn:focus-visible{outline:2px solid #ffd08a;outline-offset:2px}
  .btn-menu{background:#161d2e;color:#ffd08a;border-color:#2c3a58;padding:10px}
  .btn-menu:hover{background:#1d2740}
  .btn-create{background:linear-gradient(160deg,#ffc25e,#ff9a2b);color:#2a1703;box-shadow:0 6px 20px rgba(255,158,46,.35)}
  .btn-create:hover{box-shadow:0 10px 26px rgba(255,158,46,.5)}
  .btn-color{background:#1c1a30;color:#d9c8ff;border-color:#3d3468}
  .btn-color:hover{background:#272244}
  .btn-copy{background:#132427;color:#7fe8d8;border-color:#2a5a55}
  .btn-copy:hover{background:#183238}
  .btn-del{background:#251620;color:#ff8d9d;border-color:#57293a;padding:10px}
  .btn-del:hover{background:#341c2a}
  .btn-repo{background:#1d2a1d;color:#9fe89f;border-color:#3a5a3a}
  .btn-repo:hover{background:#253725}
  .btn-save{background:#152440;color:#7fdcff;border-color:#2b4a6e}
  .btn-save:hover{background:#1b2f52;box-shadow:0 8px 22px rgba(80,190,255,.22)}
  .btn-full{background:#161d2e;color:#c7d3ea;border-color:#2c3a58}
  .btn-full:hover{background:#1d2740}
  .btn-color.active{border-color:#ffb454;box-shadow:0 0 0 2px rgba(255,180,84,.35), 0 6px 18px rgba(255,158,46,.25)}
  .btn-copy.active{border-color:#38e0c6;box-shadow:0 0 0 2px rgba(56,224,198,.35), 0 6px 18px rgba(56,224,198,.22)}
  .btn-del.active{border-color:#ff4d5e;box-shadow:0 0 0 2px rgba(255,77,94,.4), 0 6px 18px rgba(255,77,94,.25)}
  #colorDot{width:13px;height:13px;border-radius:50%;background:#ffb454;border:1.5px solid rgba(255,255,255,.45);flex:none}
  #btnFull .i-exit{display:none}
  body.fs #btnFull .i-enter{display:none}
  body.fs #btnFull .i-exit{display:block}

  #menuBack{position:fixed;inset:0;background:rgba(4,8,16,.5);z-index:39;opacity:0;visibility:hidden;transition:.25s}
  #menuBack.open{opacity:1;visibility:visible}
  #menu{position:fixed;top:0;left:0;bottom:0;width:min(320px,86vw);z-index:40;background:#121a2b;
    border-right:1px solid #2c3c60;box-shadow:20px 0 60px rgba(0,0,0,.5);transform:translateX(-105%);
    transition:transform .28s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;padding:16px}
  #menu.open{transform:none}
  .menu-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .menu-head span{font-family:'Russo One',sans-serif;font-size:17px;color:#ffe0b0;letter-spacing:1px}
  .menu-actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .menu-actions button{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    font:600 13px 'Rubik',sans-serif;padding:10px 8px;border-radius:10px;cursor:pointer;
    border:1px solid transparent;transition:.18s}
  .ma-new{background:#1d2a1d;color:#9fe89f;border-color:#3a5a3a}
  .ma-new:hover{background:#253725}
  .ma-as{background:#152440;color:#7fdcff;border-color:#2b4a6e}
  .ma-as:hover{background:#1b2f52}
  .ma-im{background:#241d30;color:#d9c8ff;border-color:#3d3468}
  .ma-im:hover{background:#2d2540}
  #repoList{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:8px;padding-right:2px}
  .repo-row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#1a2440;
    border:1px solid #2b3a5e;border-radius:10px;padding:10px 12px}
  .repo-name{font-size:14px;color:#dfe8fa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .repo-btns{display:flex;gap:6px}
  .repo-btn{padding:6px 10px;border-radius:8px;cursor:pointer;font:600 12px 'Rubik',sans-serif;border:1px solid transparent;transition:.15s}
  .repo-btn.load{background:#152440;color:#7fdcff;border-color:#2b4a6e}
  .repo-btn.load:hover{background:#1b2f52}
  .repo-btn.del{background:#251620;color:#ff8d9d;border-color:#57293a;min-width:34px}
  .repo-btn.del.arm{background:#57293a;color:#fff;border-color:#ff4d5e}
  .repo-empty{color:#8ea3c4;font-size:13px;text-align:center;padding:24px 8px;line-height:1.5}

  .modal-back{position:absolute;inset:0;background:rgba(4,8,16,.68);backdrop-filter:blur(4px);opacity:0;transition:opacity .25s}
  #nameModal,#exportModal{position:fixed;inset:0;z-index:55;display:grid;place-items:center;visibility:hidden;transition:visibility 0s .25s}
  #nameModal.open,#exportModal.open{visibility:visible;transition:none}
  #nameModal.open .modal-back,#exportModal.open .modal-back{opacity:1}
  #nameModal .modal-card,#exportModal .modal-card{position:relative;width:min(400px,92vw);background:linear-gradient(180deg,#182136,#121a2b);
    border:1px solid #2c3c60;border-radius:18px;padding:26px 24px;box-shadow:0 30px 80px rgba(0,0,0,.55);
    transform:translateY(16px) scale(.95);opacity:0;transition:.28s cubic-bezier(.2,.9,.3,1.2)}
  #nameModal.open .modal-card,#exportModal.open .modal-card{transform:none;opacity:1}
  #nameModal h2,#exportModal h2{font-family:'Russo One',sans-serif;font-size:19px;color:#ffe0b0;margin-bottom:8px}
  #repoNameInput{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #33456e;background:#0f1626;
    color:#eaf1ff;font:500 15px 'Rubik',sans-serif;outline:none;margin:10px 0 16px}
  #repoNameInput:focus{border-color:#ffb454}
  .name-row{display:flex;gap:10px}
  .name-row .btn{flex:1;justify-content:center}
  .export-grid{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .exp-opt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;
    background:#1a2440;border:1px solid #2b3a5e;border-radius:12px;padding:13px 15px;cursor:pointer;
    color:#dfe8fa;font-family:'Rubik',sans-serif;transition:.18s}
  .exp-opt:hover{transform:translateY(-3px);border-color:#ffb454;box-shadow:0 12px 26px rgba(0,0,0,.4)}
  .exp-opt b{font-size:15px;color:#ffd08a}
  .exp-opt small{color:#8ea3c4;font-size:12px}

  #palette{position:fixed;top:84px;right:14px;z-index:30;width:302px;background:#131b2e;border:1px solid #2c3c60;
    border-radius:14px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.5);
    opacity:0;visibility:hidden;transform:translateY(-10px) scale(.97);transition:.22s}
  #palette.open{opacity:1;visibility:visible;transform:none}
  .pal-head{display:flex;justify-content:space-between;align-items:center;font-family:'Russo One',sans-serif;
    font-size:14px;color:#ffe0b0;margin-bottom:13px}
  .pal-x{width:28px;height:28px;border-radius:8px;background:#202c48;border:1px solid #33456e;color:#9fb2d6;font-size:13px;cursor:pointer;transition:.15s}
  .pal-x:hover{background:#3d2030;color:#ff9aa8}
  .swatches{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .sw{width:100%;aspect-ratio:1;border-radius:50%;cursor:pointer;padding:0;border:2px solid rgba(255,255,255,.14);
    transition:transform .15s, border-color .15s, box-shadow .15s}
  .sw:hover{transform:scale(1.18);border-color:rgba(255,255,255,.75)}
  .sw.sel{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.28)}
  .custom-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;color:#8ea3c4;font-size:13.5px}
  .custom-row input{width:60px;height:30px;border:none;background:none;cursor:pointer;padding:0}

  #welcome{position:fixed;left:50%;top:57%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;
    text-align:center;transition:opacity .6s;animation:floaty 3.6s ease-in-out infinite}
  #welcome.hide{opacity:0}
  #welcome .w-pill{display:inline-block;padding:13px 24px;border:1px solid #33456e;border-radius:14px;
    background:rgba(16,23,40,.85);color:#d9e4f8;font-size:15px;box-shadow:0 16px 44px rgba(0,0,0,.45)}
  #welcome b{color:#ffd08a}
  @keyframes floaty{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-58%)}}

  #modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;visibility:hidden;transition:visibility 0s .28s}
  #modal.open{visibility:visible;transition:none}
  #modal.open .modal-back{opacity:1}
  .modal-card{position:relative;width:min(640px,92vw);background:linear-gradient(180deg,#182136,#121a2b);
    border:1px solid #2c3c60;border-radius:18px;padding:30px 28px 26px;box-shadow:0 30px 80px rgba(0,0,0,.55);
    transform:translateY(18px) scale(.94);opacity:0;transition:.3s cubic-bezier(.2,.9,.3,1.2)}
  #modal.open .modal-card{transform:none;opacity:1}
  .modal-card h2{font-family:'Russo One',sans-serif;font-size:23px;letter-spacing:.5px;color:#ffe0b0}
  .modal-sub{margin-top:6px;color:#8ea3c4;font-size:13.5px}
  .modal-x{position:absolute;top:13px;right:13px;width:34px;height:34px;border-radius:9px;background:#202c48;
    border:1px solid #33456e;color:#9fb2d6;font-size:15px;cursor:pointer;transition:.15s}
  .modal-x:hover{background:#3d2030;border-color:#7e3a4e;color:#ff9aa8;transform:rotate(90deg)}
  .shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}
  .shape-card{display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 10px 18px;background:#1a2440;
    border:1px solid #2b3a5e;border-radius:14px;color:#dfe8fa;cursor:pointer;font-family:'Rubik',sans-serif;
    transition:transform .2s, border-color .2s, box-shadow .2s}
  .shape-card:hover{transform:translateY(-5px);border-color:var(--acc);box-shadow:0 16px 32px rgba(0,0,0,.45)}
  .shape-card:active{transform:translateY(-1px) scale(.98)}
  .shape-card[data-shape="cube"]{--acc:#ffb454}
  .shape-card[data-shape="sphere"]{--acc:#4fd2ff}
  .shape-card[data-shape="cone"]{--acc:#ff6f61}
  .shape-card[data-shape="prism"]{--acc:#f458c4}
  .shape-card[data-shape="cyl"]{--acc:#a44dff}
  .shape-card[data-shape="glass"]{--acc:#9adde8}
  .shape-card[data-shape="wind"]{--acc:#bfeef0}
  .shape-ico{transition:transform .25s}
  .shape-card:hover .shape-ico{transform:scale(1.14) rotate(-5deg)}
  .ico-sq{width:46px;height:46px;border-radius:9px;background:linear-gradient(145deg,#ffc76b,#ff9a2b);box-shadow:0 8px 20px rgba(255,164,52,.4)}
  .ico-ci{width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#8fe3ff,#26a9e0);box-shadow:0 8px 20px rgba(79,210,255,.35)}
  .ico-tr{width:52px;height:46px;background:linear-gradient(160deg,#ff9384,#f04a38);
    clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(0 8px 14px rgba(255,111,97,.4))}
  .ico-pr{width:52px;height:46px;background:linear-gradient(160deg,#ff9ade,#f458c4);
    clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(0 8px 14px rgba(244,88,196,.4))}
  .ico-cy{width:44px;height:48px;background:linear-gradient(90deg,#7a2fe0,#b06cff 55%,#8a2be2);
    border-radius:50%/16px;box-shadow:0 8px 20px rgba(164,77,255,.4)}
  .ico-gl{width:44px;height:48px;border-radius:5px;border:2px solid rgba(170,225,235,.9);
    background:linear-gradient(160deg,rgba(200,240,246,.55),rgba(140,210,222,.28));
    box-shadow:0 8px 20px rgba(150,220,230,.25), inset 0 0 12px rgba(255,255,255,.35)}
  .ico-ws{width:56px;height:42px;background:linear-gradient(180deg,rgba(205,242,246,.6),rgba(150,215,225,.3));
    clip-path:polygon(14% 0,86% 0,100% 100%,0 100%);
    filter:drop-shadow(0 8px 14px rgba(150,220,230,.35))}
  .shape-card b{font-size:15px;font-weight:600}
  .shape-card small{color:#8ea3c4;font-size:12px;margin-top:-6px}

  #toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,14px);z-index:60;background:#101a2e;
    border:1px solid #3a4d78;border-left:3px solid #ffb454;color:#eaf1ff;padding:11px 20px;border-radius:10px;
    font-size:14px;opacity:0;pointer-events:none;transition:.3s;box-shadow:0 12px 30px rgba(0,0,0,.4)}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:720px){
    .brand-sub{display:none}
    .btn{padding:9px 12px;font-size:13px}
    .btn .btn-label{display:none}
    .btn-del,.btn-menu{padding:9px}
    .chip{display:none}
    .shapes{gap:10px;grid-template-columns:repeat(2,1fr)}
    .modal-card{padding:24px 18px 20px}
    #palette{left:14px;right:14px;width:auto;top:auto;bottom:14px}
  }
</style>
</head>
<body>

<div id="scene"></div>
<div id="vignette"></div>

<header id="bar">
  <button class="btn btn-menu" id="btnMenu" title="Репозитории">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2 21 7 12 12 3 7Z" fill="#ffc25e"/>
      <path d="M3 7l9 5v10l-9-5Z" fill="#e0703f"/>
      <path d="M21 7l-9 5v10l9-5Z" fill="#4fd2ff"/>
    </svg>
    <div><span class="brand-name">ГРАНЬ</span><span class="brand-sub">3D-мастерская</span></div>
  </div>
  <div class="grow"></div>
  <div class="chip">Репозиторий: <b id="repoLabel">—</b></div>
  <div class="chip">Фигур: <b id="count">0</b></div>

  <button class="btn btn-create" id="btnCreate" title="Создать начальную модель">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <span class="btn-label">Создать модель</span>
  </button>

  <button class="btn btn-color" id="btnColor" title="Покрасить предмет">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.7s6.3 6.6 6.3 11.2a6.3 6.3 0 1 1-12.6 0C5.7 9.3 12 2.7 12 2.7Z"/></svg>
    <span class="btn-label">Цвет</span>
    <span id="colorDot"></span>
  </button>

  <button class="btn btn-copy" id="btnCopy" title="Сделать копию предмета">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="12" height="12" rx="2.2"/><path d="M15.5 5.5v-1a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h1"/></svg>
    <span class="btn-label">Копия</span>
  </button>

  <button class="btn btn-del" id="btnDelete" title="Удалить предмет">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4.8A.8.8 0 0 1 9.8 4h4.4a.8.8 0 0 1 .8.8V7"/><path d="M6.5 7l1 12.2a1 1 0 0 0 1 .8h7a1 1 0 0 0 1-.8L17.5 7"/><path d="M10 11v5M14 11v5"/></svg>
  </button>

  <button class="btn btn-repo" id="btnRepoSave" title="Сохранить в репозиторий">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
    <span class="btn-label">Сохранить</span>
  </button>

  <button class="btn btn-save" id="btnDownload" title="Скачать файл">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="m7 10 5 5 5-5"/><path d="M4 20h16"/></svg>
    <span class="btn-label">Скачать</span>
  </button>

  <button class="btn btn-full" id="btnFull" title="Во весь экран">
    <svg class="i-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    <svg class="i-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
    <span class="btn-label">Fullscreen</span>
  </button>
</header>

<div id="menuBack"></div>
<div id="menu">
  <div class="menu-head">
    <span>Репозитории</span>
    <button class="pal-x" id="menuClose" aria-label="Закрыть">✕</button>
  </div>
  <div class="menu-actions">
    <button class="ma-new" id="btnNewScene">+ Новая сцена</button>
    <button class="ma-as" id="btnSaveAs">Как копию</button>
    <button class="ma-im" id="btnImport">Импорт JSON</button>
  </div>
  <div id="repoList"></div>
</div>

<div id="nameModal">
  <div class="modal-back" data-nameclose></div>
  <div class="modal-card">
    <h2 id="nameModalTitle">Название репозитория</h2>
    <input id="repoNameInput" type="text" placeholder="Введите название…" maxlength="40" autocomplete="off">
    <div class="name-row">
      <button class="btn btn-create" id="nameOk">Сохранить</button>
      <button class="btn btn-full" data-nameclose>Отмена</button>
    </div>
  </div>
</div>

<div id="exportModal">
  <div class="modal-back" data-exclose></div>
  <div class="modal-card">
    <h2>Скачать сцену</h2>
    <p class="modal-sub">Выберите формат файла</p>
    <div class="export-grid">
      <button class="exp-opt" id="expGlb"><b>.GLB</b><small>3D-файл: просмотрщики, Blender, Windows 3D Viewer</small></button>
      <button class="exp-opt" id="expHtml"><b>.HTML</b><small>Точный просмотр в браузере — как в редакторе</small></button>
      <button class="exp-opt" id="expJson"><b>.JSON</b><small>Для ИИ и обратного импорта в меню ☰</small></button>
    </div>
  </div>
</div>

<div id="welcome">
  <div class="w-pill">Нажмите <b>«Создать модель»</b> сверху,<br>чтобы добавить первую фигуру</div>
</div>

<div id="palette">

<script type="module">

const renderer = new THREE.WebGLRenderer({ antialias:true });

/* ═══ геометрии, в т.ч. НОВЫЕ: стекло и лобовое ═══ */
function triGeo(){
  const s = new THREE.Shape();
  s.moveTo(-1.5, -1);
  s.lineTo( 1.5, -1);
  s.lineTo(-0.5,  1);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth:1.6, bevelEnabled:false });
  g.translate(0, 0, -0.8);
  return g;
}
function windshieldGeo(){
  const s = new THREE.Shape();
  s.moveTo(-1.6, -1.1);
  s.quadraticCurveTo(0, -1.35, 1.6, -1.1);
  s.lineTo(1.15, 1.0);
  s.quadraticCurveTo(0, 1.2, -1.15, 1.0);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth:.1, bevelEnabled:false, curveSegments:24 });
  g.translate(0, 0, -.05);
  const p = g.attributes.position;
  for(let i = 0; i < p.count; i++){
    const x = p.getX(i);
    p.setZ(i, p.getZ(i) + x * x * .18);   // лёгкий изгиб, как у настоящего лобового
  }
  g.computeVertexNormals();
  return g;
}

const GLASS_MAT = { transparent:true, opacity:.28, roughness:.06, metalness:.05, depthWrite:false, side:THREE.DoubleSide };

const SHAPES = {
  cube:   { label:'Куб',     color:0xffb454, y:1,    geo:()=>new THREE.BoxGeometry(2,2,2) },
  sphere: { label:'Сфера',   color:0x4fd2ff, y:1.25, geo:()=>new THREE.SphereGeometry(1.25,48,32) },
  cone:   { label:'Конус',   color:0xff6f61, y:1.25, geo:()=>new THREE.ConeGeometry(1.35,2.5,48) },
  prism:  { label:'Призма',  color:0xf458c4, y:1,    geo:triGeo },
  cyl:    { label:'Цилиндр', color:0xa44dff, y:1.1,  geo:()=>new THREE.CylinderGeometry(1.15,1.15,2.2,48) },
  glass:  { label:'Стекло',  color:0xcfeef2, y:1.3,  geo:()=>new THREE.BoxGeometry(2.4,2.6,.12),
            matOpts:GLASS_MAT, castShadow:false },
  wind:   { label:'Лобовое', color:0xd8f4f4, y:1.23, geo:windshieldGeo,
            matOpts:GLASS_MAT, castShadow:false },
};
// точная высота установки, чтобы низ был на земле
['glass','wind','prism'].forEach(k => {
  const g = SHAPES[k].geo();
  g.computeBoundingBox();
  SHAPES[k].y = -g.boundingBox.min.y;
});

let models = [], spawnCount = 0, selected = null, gizmoTipShown = false;

function spawn(type, position, scale, color, rotation){
  const def = SHAPES[type];
  if(!def) return;
  const c = color !== undefined ? color : def.color;
  const mat = new THREE.MeshStandardMaterial(Object.assign({
    color:c, roughness:.4, metalness:.18, emissive:c, emissiveIntensity:0
  }, def.matOpts || {}));
  const mesh = new THREE.Mesh(def.geo(), mat);
  mesh.geometry.computeBoundingBox();
  const bb = mesh.geometry.boundingBox;
  mesh.userData.baseHalf = {
    x:(bb.max.x-bb.min.x)/2, y:(bb.max.y-bb.min.y)/2, z:(bb.max.z-bb.min.z)/2
  };
  mesh.userData.shape = type;
  if(position){
    mesh.position.fromArray(position);
  } else if(models.length){
    const last = models[models.length-1];
    const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd);
    const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0)).normalize();
    const r = Math.max(last.userData.baseHalf.x*last.scale.x, last.userData.baseHalf.z*last.scale.z);
    mesh.position.copy(last.position).addScaledVector(right, r*2 + 1.2);
    mesh.position.y = def.y;
  } else {
    mesh.position.set(0, def.y, 0);
  }
  if(scale) mesh.scale.fromArray(scale);
  if(rotation){
    mesh.quaternion.fromArray(rotation);
    if(mesh.quaternion.lengthSq() < 1e-8) mesh.quaternion.set(0,0,0,1);
    mesh.quaternion.normalize();
  }
  mesh.castShadow = def.castShadow !== false;
  mesh.receiveShadow = def.castShadow !== false;
  scene.add(mesh);
  models.push(mesh);
  spawnCount++;
  select(mesh);
  targetGoal.copy(mesh.position);
  updateCounter();
  document.getElementById('welcome').classList.add('hide');
}

function duplicateMesh(src){
  const m = new THREE.Mesh(src.geometry, src.material.clone());
  m.userData.shape = src.userData.shape;
  m.userData.baseHalf = src.userData.baseHalf;
  m.scale.copy(src.scale);
  m.quaternion.copy(src.quaternion);
  m.castShadow = src.castShadow;
  m.receiveShadow = src.receiveShadow;
  const fwd = new THREE.Vector3();
  camera.getWorldDirection(fwd);
  const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0)).normalize();
  const r = Math.max(src.userData.baseHalf.x * src.scale.x, src.userData.baseHalf.z * src.scale.z);
  m.position.copy(src.position).addScaledVector(right, r * 2 + .8);
  m.userData.flash = performance.now();
  scene.add(m);
  models.push(m);
  spawnCount++;
  updateCounter();
  select(m);
  targetGoal.copy(m.position);
}

const gizmo = new THREE.Group();
gizmo.visible = false;
scene.add(gizmo);

function arrowMat(color){
  const mat = new THREE.MeshBasicMaterial({ color });
  mat.toneMapped = false; mat.fog = false; mat.depthTest = false;
  return mat;
}
function makeArrow(color){
  const g = new THREE.Group();
  const mat = arrowMat(color);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.85,12), mat);
  shaft.position.y = .425;
  const tip = new THREE.Mesh(new THREE.ConeGeometry(.17,.42,20), mat);
  tip.position.y = 1.06;
  shaft.renderOrder = tip.renderOrder = 999;
  g.add(shaft, tip);
  return g;
}
function makeMoveArrow(color){
  const g = new THREE.Group();
  const mat = arrowMat(color);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(.028,.028,.7,10), mat);
  shaft.position.y = .35;
  const ball = new THREE.Mesh(new THREE.SphereGeometry(.15,18,14), mat);
  ball.position.y = .85;
  shaft.renderOrder = ball.renderOrder = 999;
  g.add(shaft, ball);
  return g;
}
function makeRotRing(color){
  const g = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1, .02, 10, 64), arrowMat(color));
  ring.renderOrder = 998;
  const hit = new THREE.Mesh(new THREE.TorusGeometry(1, .10, 8, 48),
    new THREE.MeshBasicMaterial({ transparent:true, opacity:0, depthWrite:false, depthTest:false }));
  hit.renderOrder = 997;
  g.add(ring, hit);
  g.userData.ringMat = ring.material;
  return g;
}

const ARROW_DEFS = [
  { dir:new THREE.Vector3( 1,0,0), rot:[0,0,-Math.PI/2], axis:'x' },
  { dir:new THREE.Vector3(-1,0,0), rot:[0,0, Math.PI/2], axis:'x' },
  { dir:new THREE.Vector3(0, 1,0), rot:[0,0,0],          axis:'y' },
  { dir:new THREE.Vector3(0,-1,0), rot:[Math.PI,0,0],    axis:'y' },
  { dir:new THREE.Vector3(0,0, 1), rot:[ Math.PI/2,0,0], axis:'z' },
  { dir:new THREE.Vector3(0,0,-1), rot:[-Math.PI/2,0,0], axis:'z' },
];
const SCALE_COLOR = { x:0xff5c5c, y:0x54e389, z:0x4f8dff };
const MOVE_COLOR  = { x:0xffb0b0, y:0xb2f7cd, z:0xb0ccff };
const ROT_COLOR   = { x:0xff5c5c, y:0x54e389, z:0x4f8dff };
const ROT_DEFS = [
  { axis:'x', rot:[0, Math.PI/2, 0] },
  { axis:'y', rot:[Math.PI/2, 0, 0] },
  { axis:'z', rot:[0, 0, 0] },
];

const arrows = [];
ARROW_DEFS.forEach(d => {
  const group = makeArrow(SCALE_COLOR[d.axis]);
  group.rotation.set(...d.rot);
  gizmo.add(group);
  arrows.push({ group, dir:d.dir, axis:d.axis, kind:'scale', dist:1 });
});
ARROW_DEFS.forEach(d => {
  const group = makeMoveArrow(MOVE_COLOR[d.axis]);
  group.rotation.set(...d.rot);
  gizmo.add(group);
  arrows.push({ group, dir:d.dir, axis:d.axis, kind:'move', dist:1 });
});
const rotHandles = [];
ROT_DEFS.forEach(d => {
  const group = makeRotRing(ROT_COLOR[d.axis]);
  group.rotation.set(...d.rot);
  gizmo.add(group);
  rotHandles.push({ group, axis:d.axis, ringMat:group.userData.ringMat, baseColor:ROT_COLOR[d.axis] });
});

function layoutGizmo(){
  if(!selected) return;
  gizmo.position.copy(selected.position);
  gizmo.quaternion.copy(selected.quaternion);
  let maxHalf = 0;
  arrows.forEach(a => {
    const half = selected.userData.baseHalf[a.axis] * selected.scale[a.axis];
    a.dist = a.kind === 'scale' ? half + .18 : half + 1.72;
    maxHalf = Math.max(maxHalf, half);
  });
  const radius = maxHalf + .7;
  rotHandles.forEach(h => h.group.scale.setScalar(radius));
}

function resolveGizmoHit(obj){
  let o = obj;
  while(o && o !== gizmo){
    const arrow = arrows.find(a => a.group === o);
    if(arrow) return { type:'arrow', arrow };
    const rh = rotHandles.find(h => h.group === o);
    if(rh) return { type:'rot', handle:rh };
    o = o.parent;
  }
  return null;
}

let mode = null;
const paintColor = new THREE.Color('#ffb454');
const palette  = document.getElementById('palette');
const btnColor = document.getElementById('btnColor');
const btnCopy  = document.getElementById('btnCopy');

const COLORS = [

function clearSel(){ swWrap.querySelectorAll('.sw').forEach(s => s.classList.remove('sel')); }

  paintColor.set(c);

function enterMode(m){
  mode = m;
  if(m !== 'paint') palette.classList.remove('open');
  updateModeUI();
}
function exitMode(){
  mode = null;
  palette.classList.remove('open');
  updateModeUI();
}
function updateModeUI(){
  btnColor.classList.toggle('active', mode === 'paint');
  btnCopy.classList.toggle('active', mode === 'copy');
  btnDelete.classList.toggle('active', mode === 'delete');
  canvas.style.cursor = 'grab';
}

  if(palette.classList.contains('open')){ palette.classList.remove('open'); return; }
  if(mode === 'paint'){ exitMode(); return; }

  if(mode === 'copy'){ exitMode(); return; }
  if(!models.length){ toast('Сначала создайте модель'); return; }
  enterMode('copy');

});

  enterMode('delete');
  toast('Нажмите на предмет, чтобы удалить его');
});

const REPOS_KEY = 'gran_repos_v1';
let currentRepoName = null;

function readAllRepos(){
  try { return JSON.parse(localStorage.getItem(REPOS_KEY)) || {}; }
  catch(e){ return {}; }
}
function writeRepo(name, data){
  try {
    const all = readAllRepos();
    all[name] = data;
    localStorage.setItem(REPOS_KEY, JSON.stringify(all));
    return true;
  } catch(e){ toast('Не удалось сохранить (хранилище недоступно)'); return false; }
}
function deleteRepo(name){
  const all = readAllRepos();
  delete all[name];
  try { localStorage.setItem(REPOS_KEY, JSON.stringify(all)); } catch(e){}
  if(currentRepoName === name) currentRepoName = null;
  updateRepoList(); updateRepoLabel();
  toast('Репозиторий удалён');
}
function updateRepoLabel(){
  document.getElementById('repoLabel').textContent = currentRepoName || '—';
}
function updateRepoList(){
  const all = readAllRepos();
  const names = Object.keys(all);
  const list = document.getElementById('repoList');
  list.innerHTML = '';
  if(!names.length){
    list.innerHTML = '<div class="repo-empty">Пока нет репозиториев.<br>Создайте объекты и нажмите «Сохранить».</div>';
    return;
  }
  names.forEach(name => {
    const row = document.createElement('div');
    row.className = 'repo-row';
    const nm = document.createElement('div');
    nm.className = 'repo-name';
    nm.textContent = (name === currentRepoName ? '● ' : '') + name;
    const btns = document.createElement('div');
    btns.className = 'repo-btns';
    const load = document.createElement('button');
    load.className = 'repo-btn load'; load.textContent = 'Загрузить';
    load.onclick = () => loadRepo(name);
    const del = document.createElement('button');
    del.className = 'repo-btn del'; del.textContent = '✕';
    del.onclick = () => {
      if(del.dataset.confirm){ deleteRepo(name); }
      else {
        del.dataset.confirm = '1';
        del.textContent = 'Точно?';
        del.classList.add('arm');
        setTimeout(() => {
          if(del.isConnected){ delete del.dataset.confirm; del.textContent='✕'; del.classList.remove('arm'); }
        }, 2000);
      }
    };
    btns.appendChild(load); btns.appendChild(del);
    row.appendChild(nm); row.appendChild(btns);
    list.appendChild(row);
  });
}

function round6(n){ return Math.round(n * 1000000) / 1000000; }
function buildObjects(){
  return models.map(m => {
    const q = m.quaternion.clone().normalize();
    return {
      shape: m.userData.shape,
      position: [round6(m.position.x), round6(m.position.y), round6(m.position.z)],
      scale:    [round6(m.scale.x),    round6(m.scale.y),    round6(m.scale.z)],
      rotation: [round6(q.x), round6(q.y), round6(q.z), round6(q.w)],
      color:    '#' + m.material.color.getHexString()
    };
  });
}
function clearScene(){
  [...models].forEach(m => destroyMesh(m));
  spawnCount = 0;
}
function saveRepo(){
  if(!models.length){ toast('Сначала создайте модель'); return; }
  if(currentRepoName){
    if(writeRepo(currentRepoName, {objects: buildObjects()})){
      toast('Сохранено: ' + currentRepoName);
      updateRepoList();
    }
  } else {
    openNamePrompt('Название репозитория', name => {
      currentRepoName = name;
      if(writeRepo(name, {objects: buildObjects()})){
        toast('Сохранено: ' + name);
        updateRepoList(); updateRepoLabel();
      } else { currentRepoName = null; }
    });
  }
}
function saveRepoAs(){
  if(!models.length){ toast('Сначала создайте модель'); return; }
  openNamePrompt('Новое название', name => {
    currentRepoName = name;
    if(writeRepo(name, {objects: buildObjects()})){
      toast('Сохранено: ' + name);
      updateRepoList(); updateRepoLabel();
    } else { currentRepoName = null; }
  });
}
function loadRepo(name){
  const all = readAllRepos();
  const data = all[name];
  if(!data || !Array.isArray(data.objects)){ toast('Не удалось загрузить'); return; }
  applySceneData(data);
  currentRepoName = name;
  updateRepoLabel();
  closeMenu();
  toast('Загружено: ' + name);
}
function newScene(){
  clearScene();
  currentRepoName = null;
  updateRepoLabel(); updateRepoList();
  closeMenu();
  document.getElementById('welcome').classList.remove('hide');
  toast('Новая сцена');
}

function isFin(v){ return Number.isFinite(v); }
function applySceneData(data){
  if(!data || !Array.isArray(data.objects)){ toast('Неверный формат файла'); return false; }
  clearScene();
  let n = 0;
  data.objects.forEach(o => {
    if(!o || !SHAPES[o.shape]) return;
    const pos = Array.isArray(o.position) && o.position.every(isFin) ? o.position : null;
    const scl = Array.isArray(o.scale) && o.scale.every(v => isFin(v) && v > 0) ? o.scale : null;
    const rot = Array.isArray(o.rotation) && o.rotation.every(isFin) ? o.rotation : null;
    spawn(o.shape, pos, scl, o.color, rot || [0,0,0,1]);
    n++;
  });
  deselect();
  return n > 0;
}

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let scaling = null, movingAxis = null, rotating = null, moving = null, downInfo = null;
let hoverArrow = null, hoverRot = null, hoverModel = null;
const activePointers = new Set();

function castAt(e){
  const r = canvas.getBoundingClientRect();
  ndc.x =  ((e.clientX - r.left) / r.width)  * 2 - 1;
  ndc.y = -((e.clientY - r.top)  / r.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  return raycaster;
}
function select(mesh){
  if(selected && selected !== mesh) selected.material.emissiveIntensity = 0;
  selected = mesh;
  gizmo.visible = true;
  layoutGizmo();
  if(!gizmoTipShown){
    gizmoTipShown = true;
    toast('Конусы — размер, шарики — перенос, кольца — вращение');
  }
}
function deselect(){
  if(selected) selected.material.emissiveIntensity = 0;
  selected = null;
  gizmo.visible = false;
}
function cancelDrags(){
  scaling = null; movingAxis = null; rotating = null; moving = null;
  controls.enabled = true;
  canvas.style.cursor = 'grab';
}
function destroyMesh(m){
  if(selected === m) deselect();
  scene.remove(m);
  m.geometry.dispose(); m.material.dispose();
  models = models.filter(x => x !== m);
  updateCounter();
}

function axisPlane(dir, point){
  const camDir = new THREE.Vector3();
  camera.getWorldDirection(camDir);
  const side = new THREE.Vector3().crossVectors(dir, camDir);
  if(side.lengthSq() < 1e-6) side.set(0,0,1);
  const normal = new THREE.Vector3().crossVectors(side, dir).normalize();
  return new THREE.Plane().setFromNormalAndCoplanarPoint(normal, point);
}
function localAxisVec(axis){
  const v = new THREE.Vector3();
  if(axis==='x') v.set(1,0,0); else if(axis==='y') v.set(0,1,0); else v.set(0,0,1);
  return v;
}

function startScale(a){
  controls.enabled = false; hoverModel = null;
  const worldDir = a.dir.clone().applyQuaternion(selected.quaternion);
  const plane = axisPlane(worldDir, selected.position);
  const start = new THREE.Vector3();
  if(!raycaster.ray.intersectPlane(plane, start)) start.copy(selected.position);
  scaling = { arrow:a, worldDir, plane, start,
    startScale:selected.scale.clone(),
    ref:selected.userData.baseHalf[a.axis] * selected.scale[a.axis] };
  canvas.style.cursor = (a.axis==='x') ? 'ew-resize' : (a.axis==='y') ? 'ns-resize' : 'move';
}

function startMoveAxis(a){
  controls.enabled = false; hoverModel = null;
  const worldDir = a.dir.clone().applyQuaternion(selected.quaternion);
  const plane = axisPlane(worldDir, selected.position);
  const start = new THREE.Vector3();
  if(!raycaster.ray.intersectPlane(plane, start)) start.copy(selected.position);
  movingAxis = { arrow:a, worldDir, plane, start, startPos:selected.position.clone() };
  canvas.style.cursor = 'move';
}

function startRotate(handle, e){
  controls.enabled = false; hoverModel = null;
  const worldAxis = localAxisVec(handle.axis).applyQuaternion(selected.quaternion).normalize();
  const center = selected.position.clone();
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(worldAxis, center);
  const p0 = new THREE.Vector3();
  const ok = raycaster.ray.intersectPlane(plane, p0);
  const v0 = ok ? p0.sub(center) : new THREE.Vector3();
  rotating = { worldAxis, startQuat:selected.quaternion.clone(), plane, center,
    prevV:v0, totalAngle:0, lastX:e.clientX, useScreen:(v0.length() < 1e-3) };
  canvas.style.cursor = 'grabbing';
}

function startMove(){
  controls.enabled = false; hoverModel = null;
  const normal = new THREE.Vector3();
  camera.getWorldDirection(normal);
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(normal, selected.position);
  const start = new THREE.Vector3();
  if(!raycaster.ray.intersectPlane(plane, start)) start.copy(selected.position);
  moving = { plane, start, startPos:selected.position.clone() };
  canvas.style.cursor = 'move';
}

window.addEventListener('pointerdown', e => {
  if(e.target !== canvas) return;
  activePointers.add(e.pointerId);
  controls.autoRotate = false;
  if(activePointers.size > 1){ cancelDrags(); downInfo = null; return; }
  castAt(e);

  if(gizmo.visible){
    const hit = raycaster.intersectObjects(gizmo.children, true)[0];
    if(hit){
      const res = resolveGizmoHit(hit.object);
      if(res && selected){
        if(res.type === 'arrow'){
          if(res.arrow.kind === 'scale') startScale(res.arrow);
          else startMoveAxis(res.arrow);
        } else {
          startRotate(res.handle, e);
        }
      }
      e.preventDefault();
      return;
    }
  }

  const hitModel = raycaster.intersectObjects(models, false)[0];
  if(hitModel){
    if(mode === 'paint'){
      const m = hitModel.object;
      m.material.color.copy(paintColor);
      m.userData.flash = performance.now();
      e.preventDefault(); return;
    }
    if(mode === 'copy'){
      duplicateMesh(hitModel.object);
      exitMode();
      toast('Копия создана');
      e.preventDefault(); return;
    }
    if(mode === 'delete'){
      destroyMesh(hitModel.object);
      exitMode();
      toast('Фигура удалена');
      e.preventDefault(); return;
    }
    select(hitModel.object);
    startMove();
    e.preventDefault(); return;
  }

  downInfo = { x:e.clientX, y:e.clientY, t:performance.now(), id:e.pointerId };
}, true);

window.addEventListener('pointermove', e => {
  if(scaling && selected){
    castAt(e);
    const p = new THREE.Vector3();
    if(raycaster.ray.intersectPlane(scaling.plane, p)){
      const d = scaling.worldDir;
      const delta = p.dot(d) - scaling.start.dot(d);
      let f = 1 + delta / scaling.ref;
      f = Math.max(.06, Math.min(14, f));
      selected.scale[scaling.arrow.axis] = scaling.startScale[scaling.arrow.axis] * f;
      layoutGizmo();
    }
    return;
  }
  if(movingAxis && selected){
    castAt(e);
    const p = new THREE.Vector3();
    if(raycaster.ray.intersectPlane(movingAxis.plane, p)){
      const d = movingAxis.worldDir;
      const delta = p.dot(d) - movingAxis.start.dot(d);
      selected.position.copy(movingAxis.startPos).addScaledVector(d, delta);
      layoutGizmo();
    }
    return;
  }
  if(rotating && selected){
    castAt(e);
    let applied = false;
    const p = new THREE.Vector3();
    if(!rotating.useScreen && raycaster.ray.intersectPlane(rotating.plane, p)){
      const v1 = p.clone().sub(rotating.center);
      if(v1.length() > 1e-4 && rotating.prevV.length() > 1e-4){
        const cross = new THREE.Vector3().crossVectors(rotating.prevV, v1);
        const dot = rotating.prevV.dot(v1);
        const delta = Math.atan2(rotating.worldAxis.dot(cross), dot);
        rotating.totalAngle += delta;
        rotating.prevV.copy(v1);
        applied = true;
      }
    }
    if(!applied){
      const dx = e.clientX - rotating.lastX;
      rotating.totalAngle += dx * 0.02;
    }
    rotating.lastX = e.clientX;
    const q = new THREE.Quaternion().setFromAxisAngle(rotating.worldAxis, rotating.totalAngle);
    selected.quaternion.copy(q.multiply(rotating.startQuat));
    layoutGizmo();
    return;
  }
  if(moving && selected){
    castAt(e);
    const p = new THREE.Vector3();
    if(raycaster.ray.intersectPlane(moving.plane, p)){
      selected.position.copy(moving.startPos).add(p.sub(moving.start));
      layoutGizmo();
    }
    return;
  }
  if(e.target !== canvas) return;
  castAt(e);
  const hit = gizmo.visible ? raycaster.intersectObjects(gizmo.children, true)[0] : null;
  const desc = hit ? resolveGizmoHit(hit.object) : null;
  arrows.forEach(a => a.group.scale.setScalar(
    (desc && desc.type==='arrow' && desc.arrow===a) ? 1.18 : 1));
  rotHandles.forEach(h => {
    const hov = desc && desc.type==='rot' && desc.handle===h;
    h.ringMat.color.setHex(hov ? 0xffffff : h.baseColor);
  });
  hoverArrow = (desc && desc.type==='arrow') ? desc.arrow : null;
  hoverRot   = (desc && desc.type==='rot') ? desc.handle : null;
  hoverModel = raycaster.intersectObjects(models, false)[0]?.object || null;
  if(hoverArrow){
    canvas.style.cursor = hoverArrow.kind==='move' ? 'move'
      : hoverArrow.axis==='x' ? 'ew-resize' : hoverArrow.axis==='y' ? 'ns-resize' : 'move';
  } else if(hoverRot){
    canvas.style.cursor = 'grab';
  } else if(hoverModel && mode){
    canvas.style.cursor = mode==='paint' ? 'crosshair' : mode==='copy' ? 'copy' : 'pointer';
  } else if(hoverModel){
    canvas.style.cursor = 'move';
  } else {
    canvas.style.cursor = 'grab';
  }
});

window.addEventListener('pointerup', e => {
  activePointers.delete(e.pointerId);
  if(scaling){ scaling = null; controls.enabled = true; canvas.style.cursor='grab'; downInfo=null; return; }
  if(movingAxis){
    movingAxis = null; controls.enabled = true; canvas.style.cursor='grab';
    if(selected) targetGoal.copy(selected.position);
    downInfo=null; return;
  }
  if(rotating){
    rotating = null; controls.enabled = true; canvas.style.cursor='grab';
    if(selected) targetGoal.copy(selected.position);
    downInfo=null; return;
  }
  if(moving){
    moving = null; controls.enabled = true; canvas.style.cursor='grab';
    if(selected) targetGoal.copy(selected.position);
    downInfo=null; return;
  }
  if(downInfo && e.pointerId === downInfo.id && e.target === canvas){
    const moved = Math.hypot(e.clientX - downInfo.x, e.clientY - downInfo.y);
    if(moved < 8 && performance.now() - downInfo.t < 600) deselect();
  }
  downInfo = null;
});
window.addEventListener('pointercancel', e => {
  activePointers.delete(e.pointerId);
  cancelDrags();
  downInfo = null;
});
canvas.addEventListener('wheel', () => controls.autoRotate = false, { passive:true });
canvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(nameModal.classList.contains('open')) closeNamePrompt();
    else if(exportModal.classList.contains('open')) closeExport();
    else if(palette.classList.contains('open')) palette.classList.remove('open');
    else if(menu.classList.contains('open')) closeMenu();
    else if(modal.classList.contains('open')) closeModal();
    else if(mode) exitMode();
    else deselect();
  }
  if((e.key === 'Delete' || e.key === 'Backspace') && selected){
    destroyMesh(selected);
    toast('Фигура удалена');
  }
});

const toastEl = document.getElementById('toast');
let toastTimer;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
}
function updateCounter(){ document.getElementById('count').textContent = models.length; }

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  const now = performance.now();
  controls.target.lerp(targetGoal, .06);
  controls.update();

  models.forEach(m => {
    const mat = m.material;
    mat.emissive.copy(mat.color);
    let ei = 0;
    if(m === selected) ei = .18 + .08 * Math.sin(t * 3.2);
    if(mode === 'paint' && m === hoverModel){ mat.emissive.copy(paintColor); ei = .5; }
    else if(mode === 'copy' && m === hoverModel){ mat.emissive.setRGB(.45,.95,1); ei = .45; }
    else if(mode === 'delete' && m === hoverModel){ mat.emissive.setRGB(1, .25, .22); ei = .55; }
    if(m.userData.flash){
      const k = 1 - (now - m.userData.flash) / 350;
      if(k > 0) ei = Math.max(ei, k * 1.15); else delete m.userData.flash;
    }
    mat.emissiveIntensity = ei;
  });

  if(gizmo.visible){
    const busy = scaling || movingAxis || rotating || moving;
    arrows.forEach((a, i) => {
      const bob = busy ? 0 : Math.sin(t * 2.4 + i * 1.05) * .05;
      a.group.position.copy(a.dir).multiplyScalar(a.dist + bob);
    });
  }
  renderer.render(scene, camera);
});
