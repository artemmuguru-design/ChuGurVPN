<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChugurHub</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="ChugurHub">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0d1117">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .header {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 20px;
            flex: 1;
            color: #58a6ff;
            font-weight: bold;
        }

        button {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-secondary {
            background: #21262d;
            border: 1px solid #30363d;
        }

        .btn-danger {
            background: #da3633;
        }

        .btn-preview {
            background: #58a6ff;
            color: #000;
        }

        .btn-pages {
            background: #a371f7;
            color: white;
        }

        .btn-create-page {
            background: #f0883e;
            color: white;
        }

        .tabs {
            display: flex;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            flex-shrink: 0;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-size: 15px;
            color: #8b949e;
            border-bottom: 2px solid transparent;
            user-select: none;
            touch-action: manipulation;
        }

        .tab.active {
            color: #e6edf3;
            border-bottom-color: #58a6ff;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .repo-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .repo-card:active {
            border-color: #58a6ff;
            transform: scale(0.98);
        }

        .repo-card h3 {
            color: #58a6ff;
            margin-bottom: 5px;
            font-size: 18px;
        }

        .repo-card p {
            color: #8b949e;
            font-size: 14px;
            margin: 3px 0;
        }

        .repo-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #8b949e;
        }

        .empty-state .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
        }

        .modal-content h2 {
            margin-bottom: 15px;
            font-size: 18px;
        }

        input {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #e6edf3;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 12px;
            font-family: inherit;
        }

        .search-panel {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .search-input-container {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .search-input {
            flex: 1;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #e6edf3;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            margin: 0;
        }

        .search-results {
            max-height: 200px;
            overflow-y: auto;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px;
            display: none;
        }

        .search-results.show {
            display: block;
        }

        .search-result-item {
            padding: 8px;
            margin-bottom: 4px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .search-result-item:hover {
            border-color: #58a6ff;
            background: #1c2128;
        }

        .search-result-item:active {
            transform: scale(0.98);
        }

        .search-result-line {
            color: #58a6ff;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .search-result-code {
            color: #e6edf3;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .search-result-code mark {
            background: #f0883e;
            color: #000;
            padding: 0 2px;
            border-radius: 2px;
        }

        .search-no-results {
            text-align: center;
            padding: 20px;
            color: #8b949e;
            font-size: 14px;
        }

        .editor-container {
            display: flex;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            overflow-y: auto;
            overflow-x: auto;
            max-height: 500px;
            position: relative;
        }

        .line-numbers {
            background: #161b22;
            color: #8b949e;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            padding: 12px 8px;
            text-align: right;
            user-select: none;
            border-right: 1px solid #30363d;
            min-width: 45px;
            white-space: pre;
            position: sticky;
            left: 0;
            z-index: 1;
            flex-shrink: 0;
        }

        textarea {
            flex: 1;
            background: #0d1117;
            color: #e6edf3;
            border: none;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            resize: none;
            word-break: break-all;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            outline: none;
            overflow: visible;
            min-height: 100%;
        }

        textarea:focus {
            border: none;
            outline: none;
        }

        .file-item {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            flex-wrap: wrap;
        }

        .file-item .file-name {
            flex: 1;
            min-width: 100px;
        }

        iframe {
            width: 100%;
            height: 500px;
            background: white;
            border: none;
            border-radius: 8px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #238636;
            color: white;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 14px;
            display: none;
            z-index: 200;
        }

        .toast.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        .site-url {
            background: #0d1117;
            border: 1px solid #30363d;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            color: #58a6ff;
            margin: 5px 0;
            word-break: break-all;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-url span {
            flex: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📦 ChugurHub</h1>
        <button onclick="showCreateRepo()">+ Новый</button>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('repos', this)">📁 Репозитории</div>
        <div class="tab" onclick="switchTab('pages', this)">🌐 Pages</div>
    </div>

    <div class="content" id="content"></div>

    <div class="modal" id="createRepoModal">
        <div class="modal-content">
            <h2>Создать репозиторий</h2>
            <input type="text" id="repoName" placeholder="Название репозитория">
            <textarea id="repoDesc" placeholder="Описание" rows="3" style="min-height: 80px;"></textarea>
            <button onclick="createRepo()">Создать</button>
            <button class="btn-secondary" onclick="closeModal('createRepoModal')" style="margin-left: 10px;">Отмена</button>
        </div>
    </div>

    <div class="modal" id="createFileModal">
        <div class="modal-content">
            <h2>Создать файл</h2>
            <input type="text" id="fileName" placeholder="Название файла (например, index.html)">
            <button onclick="createFile()">Создать</button>
            <button class="btn-secondary" onclick="closeModal('createFileModal')" style="margin-left: 10px;">Отмена</button>
        </div>
    </div>

    <div class="modal" id="createPageModal">
        <div class="modal-content">
            <h2>Создать страницу Pages</h2>
            <input type="text" id="pageName" placeholder="Название страницы (для адреса)">
            <button onclick="createPage()">Создать</button>
            <button class="btn-secondary" onclick="closeModal('createPageModal')" style="margin-left: 10px;">Отмена</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let repos = [];
        let currentRepo = null;
        let currentFile = null;
        let currentTab = 'repos';

        document.addEventListener('paste', function(e) {
            if (e.target && e.target.id === 'fileContent') {
                e.preventDefault();
                const text = (e.clipboardData || window.clipboardData).getData('text/plain');
                const textarea = e.target;
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const value = textarea.value;
                
                setTimeout(() => {
                    textarea.value = value.substring(0, start) + text + value.substring(end);
                    textarea.selectionStart = textarea.selectionEnd = start + text.length;
                    
                    // СНАЧАЛА обновляем высоту, ПОТОМ номера строк
                    autoResizeTextarea();
                    setTimeout(() => {
                        updateLineNumbers();
                    }, 20);
                }, 0);
            }
        }, true);

        function updateLineNumbers() {
            const textarea = document.getElementById('fileContent');
            const lineNumbers = document.getElementById('lineNumbers');
            if (!textarea || !lineNumbers) return;

            const lines = textarea.value.split('\n').length;
            let nums = '';
            for (let i = 1; i <= lines; i++) {
                nums += i + '\n';
            }
            lineNumbers.textContent = nums;
        }

        function autoResizeTextarea() {
            const textarea = document.getElementById('fileContent');
            if (!textarea) return;
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function performSearch() {
            const searchInput = document.getElementById('searchInput');
            const searchResults = document.getElementById('searchResults');
            const textarea = document.getElementById('fileContent');
            
            if (!searchInput || !searchResults || !textarea) return;
            
            const query = searchInput.value.trim();
            
            if (!query) {
                searchResults.classList.remove('show');
                return;
            }
            
            const lines = textarea.value.split('\n');
            const results = [];
            
            lines.forEach((line, index) => {
                const lowerLine = line.toLowerCase();
                const lowerQuery = query.toLowerCase();
                
                if (lowerLine.includes(lowerQuery)) {
                    results.push({
                        lineNumber: index + 1,
                        lineContent: line,
                        query: query
                    });
                }
            });
            
            if (results.length === 0) {
                searchResults.innerHTML = '<div class="search-no-results">🔍 Нет данных</div>';
            } else {
                let html = '';
                results.forEach(result => {
                    const highlightedLine = highlightMatch(result.lineContent, result.query);
                    html += '<div class="search-result-item" onclick="goToLine(' + result.lineNumber + ')">';
                    html += '<div class="search-result-line">Строка ' + result.lineNumber + '</div>';
                    html += '<div class="search-result-code">' + highlightedLine + '</div>';
                    html += '</div>';
                });
                searchResults.innerHTML = html;
            }
            
            searchResults.classList.add('show');
        }

        function highlightMatch(text, query) {
            const escapedText = escapeHtml(text);
            const escapedQuery = escapeHtml(query);
            const regex = new RegExp('(' + escapeRegExp(escapedQuery) + ')', 'gi');
            return escapedText.replace(regex, '<mark>$1</mark>');
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function goToLine(lineNumber) {
            const textarea = document.getElementById('fileContent');
            if (!textarea) return;
            
            const lines = textarea.value.split('\n');
            let position = 0;
            
            for (let i = 0; i < lineNumber - 1; i++) {
                position += lines[i].length + 1;
            }
            
            textarea.focus();
            textarea.setSelectionRange(position, position + lines[lineNumber - 1].length);
            
            const lineHeight = 19.5;
            const scrollPosition = (lineNumber - 1) * lineHeight;
            const container = document.getElementById('editorContainer');
            if (container) {
                container.scrollTop = scrollPosition - 100;
            }
        }

        function loadData() {
            const saved = localStorage.getItem('chugurhub_data');
            if (saved) {
                try {
                    repos = JSON.parse(saved);
                } catch(e) {
                    repos = [];
                }
            }
            
            if (repos.length === 0) {
                const demoRepo = {
                    id: Date.now(),
                    name: 'demo-site',
                    description: 'Демонстрационный сайт',
                    files: [
                        {
                            id: Date.now() + 1,
                            name: 'index.html',
                            content: '<!DOCTYPE html>\n<html>\n<head>\n    <title>Мой сайт</title>\n    <style>\n        body {\n            font-family: Arial;\n            text-align: center;\n            padding: 50px;\n            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);\n            color: white;\n        }\n        h1 { font-size: 3em; }\n    </style>\n</head>\n<body>\n    <h1>🚀 ChugurHub работает!</h1>\n    <p>Это демонстрационная страница</p>\n</body>\n</html>'
                        }
                    ]
                };
                repos.push(demoRepo);
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem('chugurhub_data', JSON.stringify(repos));
        }

        function switchTab(tab, element) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            
            if (tab === 'repos') {
                showReposList();
            } else {
                showPagesList();
            }
        }

        function showReposList() {
            const content = document.getElementById('content');
            
            if (repos.length === 0) {
                content.innerHTML = '<div class="empty-state"><div class="icon">📦</div><h2>Нет репозиториев</h2><p>Создайте свой первый репозиторий!</p></div>';
                return;
            }

            let html = '';
            repos.forEach(repo => {
                const fileCount = repo.files ? repo.files.length : 0;
                const hasIndex = repo.files && repo.files.some(f => f.name === 'index.html');
                
                html += '<div class="repo-card">';
                html += '<h3>📁 ' + repo.name + '</h3>';
                html += '<p>' + (repo.description || 'Нет описания') + ' • ' + fileCount + ' файл(ов)</p>';
                html += '<div class="repo-actions">';
                html += '<button onclick="openRepo(' + repo.id + ')">Открыть</button>';
                if (hasIndex) {
                    html += '<button class="btn-pages" onclick="openSiteInNewTab(' + repo.id + ')">🌐 Открыть сайт</button>';
                }
                html += '<button class="btn-create-page" onclick="showCreatePage(' + repo.id + ')">📄 Создать Pages</button>';
                html += '</div>';
                html += '</div>';
            });
            
            content.innerHTML = html;
        }

        function showPagesList() {
            const content = document.getElementById('content');
            
            const pagesRepos = repos.filter(repo => 
                repo.isPage === true && repo.files && repo.files.some(f => f.name === 'index.html')
            );

            if (pagesRepos.length === 0) {
                content.innerHTML = '<div class="empty-state"><div class="icon">🌐</div><h2>Нет страниц</h2><p>Нажмите "Создать Pages" в репозитории с файлом index.html</p></div>';
                return;
            }

            let html = '<p style="margin-bottom: 20px; color: #8b949e;">Ваши опубликованные сайты:</p>';
            pagesRepos.forEach(repo => {
                html += '<div class="repo-card">';
                html += '<h3>🌐 ' + (repo.pageName || repo.name) + '</h3>';
                html += '<p>Репозиторий: ' + repo.name + '</p>';
                html += '<div class="site-url">';
                html += '<span>chugurhub.' + (repo.pageName || repo.name) + '.pages.app</span>';
                html += '</div>';
                html += '<div class="repo-actions">';
                html += '<button class="btn-preview" onclick="openSiteInNewTab(' + repo.id + ')">↗ Открыть в новой вкладке</button>';
                html += '<button class="btn-danger" onclick="deletePage(' + repo.id + ')">🗑 Удалить страницу</button>';
                html += '</div>';
                html += '</div>';
            });
            
            content.innerHTML = html;
        }

        function showCreatePage(repoId) {
            const repo = repos.find(r => r.id === repoId);
            if (!repo) {
                showToast('Репозиторий не найден!');
                return;
            }

            const hasIndex = repo.files && repo.files.some(f => f.name === 'index.html');
            if (!hasIndex) {
                showToast('Сначала создайте файл index.html в репозитории!');
                return;
            }

            currentRepo = repo;
            document.getElementById('createPageModal').classList.add('show');
            document.getElementById('pageName').value = repo.name + '-page';
        }

        function createPage() {
            const pageName = document.getElementById('pageName').value.trim();
            
            if (!pageName) {
                showToast('Введите название страницы!');
                return;
            }

            if (!currentRepo) {
                showToast('Ошибка!');
                return;
            }

            const hasIndex = currentRepo.files && currentRepo.files.some(f => f.name === 'index.html');
            if (!hasIndex) {
                showToast('Нет файла index.html!');
                return;
            }

            currentRepo.isPage = true;
            currentRepo.pageName = pageName;
            
            saveData();
            closeModal('createPageModal');
            showReposList();
            showToast('Страница создана! Перейдите во вкладку Pages');
        }

        function deletePage(id) {
            if (confirm('Удалить эту страницу?')) {
                const repo = repos.find(r => r.id === id);
                if (repo) {
                    repo.isPage = false;
                    delete repo.pageName;
                    saveData();
                    showPagesList();
                    showToast('Страница удалена');
                }
            }
        }

        function openSiteInNewTab(id) {
            const repo = repos.find(r => r.id === id);
            if (!repo) return;
            
            const indexFile = repo.files.find(f => f.name === 'index.html');
            if (!indexFile) return;
            
            const blob = new Blob([indexFile.content], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            
            window.open(url, '_blank');
            
            const pageName = repo.pageName || repo.name;
            showToast('Сайт открыт: chugurhub.' + pageName + '.pages.app');
        }

        function showCreateRepo() {
            document.getElementById('createRepoModal').classList.add('show');
            document.getElementById('repoName').value = '';
            document.getElementById('repoDesc').value = '';
        }

        function createRepo() {
            const name = document.getElementById('repoName').value.trim();
            const description = document.getElementById('repoDesc').value.trim();
            
            if (!name) {
                showToast('Введите название!');
                return;
            }

            const repo = {
                id: Date.now(),
                name: name,
                description: description,
                files: [],
                isPage: false
            };

            repos.push(repo);
            saveData();
            closeModal('createRepoModal');
            showReposList();
            showToast('Репозиторий создан!');
        }

        function openRepo(id) {
            currentRepo = repos.find(r => r.id === id);
            if (!currentRepo) return;
            
            const content = document.getElementById('content');
            
            let html = '<div style="margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap;">';
            html += '<button class="btn-secondary" onclick="showReposList()">← Назад</button> ';
            html += '<button onclick="showCreateFile()">+ Файл</button>';
            
            const hasIndex = currentRepo.files.some(f => f.name === 'index.html');
            if (hasIndex) {
                html += '<button class="btn-pages" onclick="openSiteInNewTab(' + currentRepo.id + ')">🌐 Сайт</button>';
                html += '<button class="btn-create-page" onclick="showCreatePage(' + currentRepo.id + ')">📄 Создать Pages</button>';
            }
            html += '</div>';
            html += '<h2 style="margin-bottom: 15px;">📁 ' + currentRepo.name + '</h2>';
            
            if (currentRepo.files && currentRepo.files.length > 0) {
                currentRepo.files.forEach(file => {
                    const icon = getFileIcon(file.name);
                    html += '<div class="file-item">';
                    html += '<span>' + icon + '</span>';
                    html += '<span class="file-name">' + file.name + '</span>';
                    html += '<button onclick="openFile(' + file.id + ')">Открыть</button>';
                    html += '<button class="btn-danger" onclick="deleteFile(' + file.id + ')">🗑</button>';
                    html += '</div>';
                });
            } else {
                html += '<p style="color: #8b949e; text-align: center; padding: 20px;">Нет файлов. Создайте файл index.html чтобы опубликовать сайт!</p>';
            }
            
            content.innerHTML = html;
        }

        function showCreateFile() {
            document.getElementById('createFileModal').classList.add('show');
            document.getElementById('fileName').value = '';
        }

        function createFile() {
            const name = document.getElementById('fileName').value.trim();
            
            if (!name) {
                showToast('Введите название файла!');
                return;
            }

            const file = {
                id: Date.now(),
                name: name,
                content: name.endsWith('.html') ? '<!DOCTYPE html>\n<html>\n<head>\n    <title>Новая страница</title>\n</head>\n<body>\n    <h1>Привет, ChugurHub!</h1>\n</body>\n</html>' : ''
            };

            currentRepo.files.push(file);
            saveData();
            closeModal('createFileModal');
            openRepo(currentRepo.id);
            showToast('Файл создан!');
        }

        function openFile(id) {
            currentFile = currentRepo.files.find(f => f.id === id);
            if (!currentFile) return;
            
            const content = document.getElementById('content');
            
            let html = '<div style="margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap;">';
            html += '<button class="btn-secondary" onclick="openRepo(' + currentRepo.id + ')">← Назад</button> ';
            html += '<button onclick="saveFile()">💾 Сохранить</button> ';
            html += '<button class="btn-secondary" onclick="downloadCurrentFile()">⬇ Скачать</button> ';
            if (currentFile.name.endsWith('.html')) {
                html += '<button class="btn-preview" onclick="previewFile()">👁 Предпросмотр</button>';
                html += '<button class="btn-pages" onclick="openSiteInNewTab(' + currentRepo.id + ')">🌐 Сайт</button>';
                html += '<button class="btn-create-page" onclick="showCreatePage(' + currentRepo.id + ')">📄 Создать Pages</button>';
            }
            html += '</div>';
            html += '<h3 style="margin-bottom: 10px;">' + getFileIcon(currentFile.name) + ' ' + currentFile.name + '</h3>';
            
            html += '<div class="search-panel">';
            html += '<div class="search-input-container">';
            html += '<input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск по коду..." oninput="performSearch()">';
            html += '</div>';
            html += '<div class="search-results" id="searchResults"></div>';
            html += '</div>';
            
            html += '<div class="editor-container" id="editorContainer">';
            html += '<div class="line-numbers" id="lineNumbers">1</div>';
            html += '<textarea id="fileContent" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>';
            html += '</div>';
            
            content.innerHTML = html;
            
            const textarea = document.getElementById('fileContent');
            
            if (textarea) {
                textarea.value = '';
                setTimeout(() => {
                    textarea.value = currentFile.content;
                    
                    // СНАЧАЛА обновляем высоту, ПОТОМ номера строк
                    autoResizeTextarea();
                    setTimeout(() => {
                        updateLineNumbers();
                    }, 30);
                }, 10);
                
                // Обработчик для любого изменения текста (ввод, удаление, вставка)
                textarea.addEventListener('input', () => {
                    autoResizeTextarea();
                    setTimeout(() => {
                        updateLineNumbers();
                    }, 10);
                });
            }
        }

        function saveFile() {
            const textarea = document.getElementById('fileContent');
            if (textarea && currentFile) {
                currentFile.content = textarea.value;
                saveData();
                showToast('Сохранено!');
            }
        }

        function downloadCurrentFile() {
            if (!currentFile) return;
            const textarea = document.getElementById('fileContent');
            const content = textarea ? textarea.value : currentFile.content;
            
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = currentFile.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast('Файл скачан: ' + currentFile.name);
        }

        function previewFile() {
            const textarea = document.getElementById('fileContent');
            if (textarea) {
                currentFile.content = textarea.value;
                
                const content = document.getElementById('content');
                content.innerHTML = '<button class="btn-secondary" onclick="openFile(' + currentFile.id + ')">← Назад</button><br><br>';
                
                const blob = new Blob([currentFile.content], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                
                const iframe = document.createElement('iframe');
                iframe.style.width = '100%';
                iframe.style.height = '500px';
                iframe.style.background = 'white';
                iframe.style.border = 'none';
                iframe.style.borderRadius = '8px';
                iframe.src = url;
                
                content.appendChild(iframe);
                
                setTimeout(() => saveData(), 0);
            }
        }

        function deleteFile(id) {
            if (confirm('Удалить этот файл?')) {
                currentRepo.files = currentRepo.files.filter(f => f.id !== id);
                saveData();
                openRepo(currentRepo.id);
                showToast('Файл удалён');
            }
        }

        function getFileIcon(name) {
            if (name.endsWith('.html')) return '🌐';
            if (name.endsWith('.css')) return '🎨';
            if (name.endsWith('.js')) return '⚡';
            if (name.endsWith('.json')) return '📋';
            if (name.endsWith('.md')) return '📝';
            if (name.endsWith('.py')) return '🐍';
            return '📄';
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('show');
                }
            });
        });

        loadData();
        showReposList();
    </script>
</body>
 </html>
