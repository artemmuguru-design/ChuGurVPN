<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ГРАНЬ — 3D мастерская</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:#0f1626;color:#e8eefb;
    font-family:'Rubik',system-ui,sans-serif;font-size:15px;
    -webkit-user-select:none;user-select:none;
  }
  #scene{position:fixed;inset:0;z-index:0}
  #scene canvas{display:block;touch-action:none;cursor:grab}

  #vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(60% 40% at 50% 0%, rgba(90,170,255,.09), transparent 70%),
      radial-gradient(120% 95% at 50% 42%, transparent 55%, rgba(5,9,18,.62) 100%);
  }

  /* ── верхняя панель ─────────────────────────────── */
  #bar{position:fixed;top:14px;left:14px;right:14px;z-index:20;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 16px;border:1px solid #26324e;border-radius:16px;
    background:rgba(15,21,36,.92);box-shadow:0 12px 40px rgba(0,0,0,.45);
  }
  .brand{display:flex;align-items:center;gap:11px;margin-right:6px}
  .brand svg{width:30px;height:30px;filter:drop-shadow(0 3px 8px rgba(255,164,52,.35))}
  .brand-name{font-family:'Russo One',sans-serif;font-size:19px;letter-spacing:2px;color:#ffd08a}
  .brand-sub{display:block;font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:#7d90b4}
  .grow{flex:1}
  .chip{padding:7px 13px;border:1px solid #2b3a5e;border-radius:999px;
    background:#141d31;color:#8ea3c4;font-size:13px;white-space:nowrap}
  .chip b{color:#ffd08a;font-weight:600}

  .btn{display:inline-flex;align-items:center;gap:8px;
    font:600 14px 'Rubik',sans-serif;padding:10px 16px;border-radius:11px;
    border:1px solid transparent;cursor:pointer;touch-action:manipulation;
    transition:transform .18s, box-shadow .18s, background .18s, border-color .18s;
  }
  .btn svg{width:17px;height:17px;flex:none}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(0) scale(.97)}
  .btn:focus-visible{outline:2px solid #ffd08a;outline-offset:2px}
  .btn-create{background:linear-gradient(160deg,#ffc25e,#ff9a2b);color:#2a1703;
    box-shadow:0 6px 20px rgba(255,158,46,.35)}
  .btn-create:hover{box-shadow:0 10px 26px rgba(255,158,46,.5)}
  .btn-color{background:#1c1a30;color:#d9c8ff;border-color:#3d3468}
  .btn-color:hover{background:#272244}
  .btn-copy{background:#132427;color:#7fe8d8;border-color:#2a5a55}
  .btn-copy:hover{background:#183238}
  .btn-del{background:#251620;color:#ff8d9d;border-color:#57293a;padding:10px}
  .btn-del:hover{background:#341c2a}
  .btn-color.active{border-color:#ffb454;
    box-shadow:0 0 0 2px rgba(255,180,84,.35), 0 6px 18px rgba(255,158,46,.25)}
  .btn-copy.active{border-color:#38e0c6;
    box-shadow:0 0 0 2px rgba(56,224,198,.35), 0 6px 18px rgba(56,224,198,.22)}
  .btn-del.active{border-color:#ff4d5e;
    box-shadow:0 0 0 2px rgba(255,77,94,.4), 0 6px 18px rgba(255,77,94,.25)}
  #colorDot{width:13px;height:13px;border-radius:50%;background:#ffb454;
    border:1.5px solid rgba(255,255,255,.45);flex:none}
  .btn-save{background:#152440;color:#7fdcff;border-color:#2b4a6e}
  .btn-save:hover{background:#1b2f52;box-shadow:0 8px 22px rgba(80,190,255,.22)}
  .btn-full{background:#161d2e;color:#c7d3ea;border-color:#2c3a58}
  .btn-full:hover{background:#1d2740}
  #btnFull .i-exit{display:none}
  body.fs #btnFull .i-enter{display:none}
  body.fs #btnFull .i-exit{display:block}

  /* ── палитра цветов ─────────────────────────────── */
  #palette{position:fixed;top:84px;right:14px;z-index:30;width:302px;
    background:#131b2e;border:1px solid #2c3c60;border-radius:14px;padding:16px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
    opacity:0;visibility:hidden;transform:translateY(-10px) scale(.97);transition:.22s}
  #palette.open{opacity:1;visibility:visible;transform:none}
  .pal-head{display:flex;justify-content:space-between;align-items:center;
    font-family:'Russo One',sans-serif;font-size:14px;color:#ffe0b0;margin-bottom:13px}
  .pal-x{width:28px;height:28px;border-radius:8px;background:#202c48;border:1px solid #33456e;
    color:#9fb2d6;font-size:13px;cursor:pointer;transition:.15s}
  .pal-x:hover{background:#3d2030;color:#ff9aa8}
  .swatches{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .sw{width:100%;aspect-ratio:1;border-radius:50%;cursor:pointer;padding:0;
    border:2px solid rgba(255,255,255,.14);transition:transform .15s, border-color .15s, box-shadow .15s}
  .sw:hover{transform:scale(1.18);border-color:rgba(255,255,255,.75)}
  .sw.sel{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.28)}
  .custom-row{display:flex;align-items:center;justify-content:space-between;
    margin-top:14px;color:#8ea3c4;font-size:13.5px}
  .custom-row input{width:60px;height:30px;border:none;background:none;cursor:pointer;padding:0}

  /* ── приветствие ────────────────────────────────── */
  #welcome{position:fixed;left:50%;top:57%;transform:translate(-50%,-50%);z-index:5;
    pointer-events:none;text-align:center;transition:opacity .6s;
    animation:floaty 3.6s ease-in-out infinite}
  #welcome.hide{opacity:0}
  #welcome .w-pill{display:inline-block;padding:13px 24px;border:1px solid #33456e;border-radius:14px;
    background:rgba(16,23,40,.85);color:#d9e4f8;font-size:15px;
    box-shadow:0 16px 44px rgba(0,0,0,.45)}
  #welcome b{color:#ffd08a}
  @keyframes floaty{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-58%)}}

  /* ── модальное окно выбора фигуры ───────────────── */
  #modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
    visibility:hidden;transition:visibility 0s .28s}
  #modal.open{visibility:visible;transition:none}
  .modal-back{position:absolute;inset:0;background:rgba(4,8,16,.68);backdrop-filter:blur(4px);
    opacity:0;transition:opacity .25s}
  #modal.open .modal-back{opacity:1}
  .modal-card{position:relative;width:min(600px,92vw);
    background:linear-gradient(180deg,#182136,#121a2b);
    border:1px solid #2c3c60;border-radius:18px;padding:30px 28px 26px;
    box-shadow:0 30px 80px rgba(0,0,0,.55);
    transform:translateY(18px) scale(.94);opacity:0;
    transition:.3s cubic-bezier(.2,.9,.3,1.2)}
  #modal.open .modal-card{transform:none;opacity:1}
  .modal-card h2{font-family:'Russo One',sans-serif;font-size:23px;letter-spacing:.5px;color:#ffe0b0}
  .modal-sub{margin-top:6px;color:#8ea3c4;font-size:13.5px}
  .modal-x{position:absolute;top:13px;right:13px;width:34px;height:34px;border-radius:9px;
    background:#202c48;border:1px solid #33456e;color:#9fb2d6;font-size:15px;cursor:pointer;
    transition:.15s}
  .modal-x:hover{background:#3d2030;border-color:#7e3a4e;color:#ff9aa8;transform:rotate(90deg)}
  .shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}
  .shape-card{display:flex;flex-direction:column;align-items:center;gap:12px;
    padding:24px 10px 18px;background:#1a2440;border:1px solid #2b3a5e;border-radius:14px;
    color:#dfe8fa;cursor:pointer;font-family:'Rubik',sans-serif;
    transition:transform .2s, border-color .2s, box-shadow .2s}
  .shape-card:hover{transform:translateY(-5px);border-color:var(--acc);
    box-shadow:0 16px 32px rgba(0,0,0,.45)}
  .shape-card:active{transform:translateY(-1px) scale(.98)}
  .shape-card[data-shape="cube"]{--acc:#ffb454}
  .shape-card[data-shape="sphere"]{--acc:#4fd2ff}
  .shape-card[data-shape="cone"]{--acc:#ff6f61}
  .shape-ico{transition:transform .25s}
  .shape-card:hover .shape-ico{transform:scale(1.14) rotate(-5deg)}
  .ico-sq{width:46px;height:46px;border-radius:9px;
    background:linear-gradient(145deg,#ffc76b,#ff9a2b);box-shadow:0 8px 20px rgba(255,164,52,.4)}
  .ico-ci{width:46px;height:46px;border-radius:50%;
    background:linear-gradient(145deg,#8fe3ff,#26a9e0);box-shadow:0 8px 20px rgba(79,210,255,.35)}
  .ico-tr{width:52px;height:46px;background:linear-gradient(160deg,#ff9384,#f04a38);
    clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(0 8px 14px rgba(255,111,97,.4))}
  .shape-card b{font-size:15px;font-weight:600}
  .shape-card small{color:#8ea3c4;font-size:12px;margin-top:-6px}

  /* ── тост ───────────────────────────────────────── */
  #toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,14px);z-index:60;
    background:#101a2e;border:1px solid #3a4d78;border-left:3px solid #ffb454;
    color:#eaf1ff;padding:11px 20px;border-radius:10px;font-size:14px;
    opacity:0;pointer-events:none;transition:.3s;box-shadow:0 12px 30px rgba(0,0,0,.4)}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:720px){
    .brand-sub{display:none}
    .btn{padding:9px 12px;font-size:13px}
    .btn .btn-label{display:none}
    .btn-del{padding:9px}
    .chip{display:none}
    .shapes{gap:10px}
    .modal-card{padding:24px 18px 20px}
    #palette{left:14px;right:14px;width:auto;top:auto;bottom:14px}
  }
</style>
</head>
<body>

<div id="scene"></div>
<div id="vignette"></div>

<header id="bar">
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2 21 7 12 12 3 7Z" fill="#ffc25e"/>
      <path d="M3 7l9 5v10l-9-5Z" fill="#e0703f"/>
      <path d="M21 7l-9 5v10l9-5Z" fill="#4fd2ff"/>
    </svg>
    <div><span class="brand-name">ГРАНЬ</span><span class="brand-sub">3D-мастерская</span></div>
  </div>
  <div class="grow"></div>
  <div class="chip">Фигур: <b id="count">0</b></div>

  <button class="btn btn-create" id="btnCreate" title="Создать начальную модель">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <span class="btn-label">Создать модель</span>
  </button>

  <button class="btn btn-color" id="btnColor" title="Покрасить предмет">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.7s6.3 6.6 6.3 11.2a6.3 6.3 0 1 1-12.6 0C5.7 9.3 12 2.7 12 2.7Z"/></svg>
    <span class="btn-label">Цвет</span>
    <span id="colorDot"></span>
  </button>

  <button class="btn btn-copy" id="btnCopy" title="Сделать копию предмета">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="12" height="12" rx="2.2"/><path d="M15.5 5.5v-1a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h1"/></svg>
    <span class="btn-label">Копия</span>
  </button>

  <button class="btn btn-del" id="btnDelete" title="Удалить предмет">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4.8A.8.8 0 0 1 9.8 4h4.4a.8.8 0 0 1 .8.8V7"/><path d="M6.5 7l1 12.2a1 1 0 0 0 1 .8h7a1 1 0 0 0 1-.8L17.5 7"/><path d="M10 11v5M14 11v5"/></svg>
  </button>

  <button class="btn btn-save" id="btnSave" title="Сохранить сцену в JSON-файл">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="m7 10 5 5 5-5"/><path d="M4 20h16"/></svg>
    <span class="btn-label">Сохранить</span>
  </button>

  <button class="btn btn-full" id="btnFull" title="Во весь экран">
    <svg class="i-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    <svg class="i-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
    <span class="btn-label">Fullscreen</span>
  </button>
</header>

<div id="welcome">
  <div class="w-pill">Нажмите <b>«Создать модель»</b> сверху,<br>чтобы добавить первую фигуру</div>
</div>

<div id="palette">
  <div class="pal-head">Выберите цвет <button class="pal-x" id="palClose" aria-label="Закрыть">✕</button></div>
  <div class="swatches"></div>
  <label class="custom-row">Свой цвет: <input type="color" id="customColor" value="#ffb454"></label>
</div>

<div id="modal" role="dialog" aria-modal="true">
  <div class="modal-back" data-close></div>
  <div class="modal-card">
    <button class="modal-x" data-close aria-label="Закрыть">✕</button>
    <h2>Новая модель</h2>
    <p class="modal-sub">Выберите форму — она появится в центре сцены</p>
    <div class="shapes">
      <button class="shape-card" data-shape="cube">
        <span class="shape-ico ico-sq"></span><b>Квадрат</b><small>→ куб</small>
      </button>
      <button class="shape-card" data-shape="sphere">
        <span class="shape-ico ico-ci"></span><b>Круг</b><small>→ сфера</small>
      </button>
      <button class="shape-card" data-shape="cone">
        <span class="shape-ico ico-tr"></span><b>Треугольник</b><small>→ конус</small>
      </button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ═══ автозапуск полного экрана при первом действии ═══ */
function autoFullscreen(){
  window.removeEventListener('pointerdown', autoFullscreen, true);
  if(!document.fullscreenElement && document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen().catch(() => {});
  }
}
window.addEventListener('pointerdown', autoFullscreen, true);

/* ═══ базовая сцена ═══ */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.getElementById('scene').appendChild(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1626);
scene.fog = new THREE.Fog(0x0f1626, 26, 60);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, .1, 200);
camera.position.set(7, 5.4, 9.5);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.1, 0);
controls.enableDamping = true;
controls.dampingFactor = .08;
controls.minDistance = 2.4;
controls.maxDistance = 38;
controls.maxPolarAngle = Math.PI * .52;
controls.autoRotate = true;
controls.autoRotateSpeed = .9;
let targetGoal = controls.target.clone();

/* ═══ свет и окружение ═══ */
scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x1a2030, .85));
const key = new THREE.DirectionalLight(0xffe0b8, 1.7);
key.position.set(7, 12, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -14;
key.shadow.camera.right = key.shadow.camera.top = 14;
key.shadow.bias = -0.0004;
scene.add(key);
const rim = new THREE.DirectionalLight(0x66aaff, .7);
rim.position.set(-8, 6, -7);
scene.add(rim);

const grid = new THREE.GridHelper(50, 50, 0x3a4a6b, 0x212c44);
grid.material.transparent = true;
grid.material.opacity = .85;
scene.add(grid);

const shadowPlane = new THREE.Mesh(
  new THREE.CircleGeometry(28, 48),
  new THREE.ShadowMaterial({ opacity:.38 })
);
shadowPlane.rotation.x = -Math.PI/2;
shadowPlane.position.y = .005;
shadowPlane.receiveShadow = true;
scene.add(shadowPlane);

const gc = document.createElement('canvas'); gc.width = gc.height = 512;
const gx = gc.getContext('2d');
const grad = gx.createRadialGradient(256,256,20, 256,256,250);
grad.addColorStop(0,'rgba(96,150,255,.22)');
grad.addColorStop(.55,'rgba(96,150,255,.07)');
grad.addColorStop(1,'rgba(96,150,255,0)');
gx.fillStyle = grad; gx.fillRect(0,0,512,512);
const glow = new THREE.Mesh(
  new THREE.PlaneGeometry(58,58),
  new THREE.MeshBasicMaterial({ map:new THREE.CanvasTexture(gc), transparent:true, depthWrite:false })
);
glow.rotation.x = -Math.PI/2;
glow.position.y = -.03;
glow.renderOrder = -1;
scene.add(glow);

/* ═══ фигуры ═══ */
const SHAPES = {
  cube:   { label:'Куб',   color:0xffb454, y:1,    geo:()=>new THREE.BoxGeometry(2,2,2) },
  sphere: { label:'Сфера', color:0x4fd2ff, y:1.25, geo:()=>new THREE.SphereGeometry(1.25,48,32) },
  cone:   { label:'Конус', color:0xff6f61, y:1.25, geo:()=>new THREE.ConeGeometry(1.35,2.5,48) },
};
let models = [], spawnCount = 0, selected = null, gizmoTipShown = false;

function spawn(type, position, scale, color){
  const def = SHAPES[type];
  if(!def) return;
  const mesh = new THREE.Mesh(
    def.geo(),
    new THREE.MeshStandardMaterial({
      color: color !== undefined ? color : def.color,
      roughness:.4, metalness:.18,
      emissive: color !== undefined ? color : def.color,
      emissiveIntensity:0
    })
  );
  mesh.geometry.computeBoundingBox();
  const bb = mesh.geometry.boundingBox;
  mesh.userData.baseHalf = {
    x:(bb.max.x-bb.min.x)/2, y:(bb.max.y-bb.min.y)/2, z:(bb.max.z-bb.min.z)/2
  };
  mesh.userData.shape = type;
  if(position) mesh.position.fromArray(position);
  else mesh.position.set(spawnCount === 0 ? 0 : spawnCount * 2.7, def.y, 0);
  if(scale) mesh.scale.fromArray(scale);
  mesh.castShadow = mesh.receiveShadow = true;
  scene.add(mesh);
  models.push(mesh);
  spawnCount++;
  select(mesh);
  targetGoal.copy(mesh.position);
  updateCounter();
  document.getElementById('welcome').classList.add('hide');
}

function duplicateMesh(src){
  const m = new THREE.Mesh(src.geometry, src.material.clone());
  m.userData.shape = src.userData.shape;
  m.userData.baseHalf = src.userData.baseHalf;
  m.scale.copy(src.scale);
  m.castShadow = m.receiveShadow = true;
  const fwd = new THREE.Vector3();
  camera.getWorldDirection(fwd);
  const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0)).normalize();
  const r = Math.max(src.userData.baseHalf.x * src.scale.x, src.userData.baseHalf.z * src.scale.z);
  m.position.copy(src.position).addScaledVector(right, r * 2 + .8);
  m.userData.flash = performance.now();
  scene.add(m);
  models.push(m);
  spawnCount++;
  updateCounter();
  select(m);
  targetGoal.copy(m.position);
}

/* ═══ гизмо: 6 стрелок размера + 6 стрелок переноса ═══ */
const gizmo = new THREE.Group();
gizmo.visible = false;
scene.add(gizmo);

function arrowMat(color){
  const mat = new THREE.MeshBasicMaterial({ color });
  mat.toneMapped = false; mat.fog = false; mat.depthTest = false;
  return mat;
}
function makeArrow(color){
  const g = new THREE.Group();
  const mat = arrowMat(color);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.85,12), mat);
  shaft.position.y = .425;
  const tip = new THREE.Mesh(new THREE.ConeGeometry(.17,.42,20), mat);
  tip.position.y = 1.06;
  shaft.renderOrder = tip.renderOrder = 999;
  g.add(shaft, tip);
  return g;
}
function makeMoveArrow(color){
  const g = new THREE.Group();
  const mat = arrowMat(color);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(.028,.028,.7,10), mat);
  shaft.position.y = .35;
  const ball = new THREE.Mesh(new THREE.SphereGeometry(.15,18,14), mat);
  ball.position.y = .85;
  shaft.renderOrder = ball.renderOrder = 999;
  g.add(shaft, ball);
  return g;
}

const ARROW_DEFS = [
  { dir:new THREE.Vector3( 1,0,0), rot:[0,0,-Math.PI/2], axis:'x' },
  { dir:new THREE.Vector3(-1,0,0), rot:[0,0, Math.PI/2], axis:'x' },
  { dir:new THREE.Vector3(0, 1,0), rot:[0,0,0],          axis:'y' },
  { dir:new THREE.Vector3(0,-1,0), rot:[Math.PI,0,0],    axis:'y' },
  { dir:new THREE.Vector3(0,0, 1), rot:[ Math.PI/2,0,0], axis:'z' },
  { dir:new THREE.Vector3(0,0,-1), rot:[-Math.PI/2,0,0], axis:'z' },
];
const SCALE_COLOR = { x:0xff5c5c, y:0x54e389, z:0x4f8dff };
const MOVE_COLOR  = { x:0xffb0b0, y:0xb2f7cd, z:0xb0ccff };

const arrows = [];
ARROW_DEFS.forEach(d => {
  const group = makeArrow(SCALE_COLOR[d.axis]);
  group.rotation.set(...d.rot);
  gizmo.add(group);
  arrows.push({ group, dir:d.dir, axis:d.axis, kind:'scale', dist:1 });
});
ARROW_DEFS.forEach(d => {
  const group = makeMoveArrow(MOVE_COLOR[d.axis]);
  group.rotation.set(...d.rot);
  gizmo.add(group);
  arrows.push({ group, dir:d.dir, axis:d.axis, kind:'move', dist:1 });
});

function layoutGizmo(){
  if(!selected) return;
  gizmo.position.copy(selected.position);
  arrows.forEach(a => {
    const half = selected.userData.baseHalf[a.axis] * selected.scale[a.axis];
    a.dist = a.kind === 'scale' ? half + .18 : half + 1.72;
  });
}

/* ═══ режимы: покраска, копирование, удаление ═══ */
let mode = null;
const paintColor = new THREE.Color('#ffb454');
const palette  = document.getElementById('palette');
const btnColor = document.getElementById('btnColor');
const btnCopy  = document.getElementById('btnCopy');
const btnDelete= document.getElementById('btnDelete');
const colorDot = document.getElementById('colorDot');
const swWrap   = document.querySelector('.swatches');

const COLORS = [
  '#ffffff','#e8edf7','#b7c3da','#8fa0bd','#5f6f8f','#39445e','#161b29',
  '#ff4d4d','#ff7a45','#ffb454','#ffd93d','#f9f871','#d4ed62','#8ce05f',
  '#3ddc84','#2ec4a6','#35d0c5','#4fd2ff','#38a3f1','#4d7cff','#5465ff',
  '#7d5bff','#a44dff','#d44dff','#f458c4','#ff5c99','#ff8fb3','#c98a4b',
  '#8d5a3b','#5a3825','#ffe0c2','#e0ff4f','#4fffd8','#9dff4f','#ff4f6e'
];
COLORS.forEach(c => {
  const b = document.createElement('button');
  b.className = 'sw'; b.style.background = c; b.title = c;
  b.addEventListener('click', () => pickColor(c, b));

function clearSel(){ swWrap.querySelectorAll('.sw').forEach(s => s.classList.remove('sel')); }
function pickColor(c, el){
  paintColor.set(c);
  colorDot.style.background = '#' + paintColor.getHexString();
  clearSel();
  if(el) el.classList.add('sel');
  palette.classList.remove('open');
  enterMode('paint');

}
document.getElementById('customColor').addEventListener('input', e => {
  paintColor.set(e.target.value);
  colorDot.style.background = e.target.value;
  clearSel();
  if(mode !== 'paint') enterMode('paint');
});
document.getElementById('customColor').addEventListener('change', () => {
  palette.classList.remove('open');
  toast('Цвет выбран — нажимайте на предметы');
});
document.getElementById('palClose').addEventListener('click', () => palette.classList.remove('open'));

function enterMode(m){
  mode = m;
  if(m !== 'paint') palette.classList.remove('open');
  updateModeUI();
}
function exitMode(){
  mode = null;
  palette.classList.remove('open');
  updateModeUI();
}
function updateModeUI(){
  btnColor.classList.toggle('active', mode === 'paint');
  btnCopy.classList.toggle('active', mode === 'copy');
  btnDelete.classList.toggle('active', mode === 'delete');
  canvas.style.cursor = 'grab';
}

btnColor.addEventListener('click', () => {
  if(palette.classList.contains('open')){ palette.classList.remove('open'); return; }
  if(mode === 'paint'){ exitMode(); return; }
  palette.classList.add('open');
});
btnCopy.addEventListener('click', () => {
  if(mode === 'copy'){ exitMode(); return; }
  if(!models.length){ toast('Сначала создайте модель'); return; }
  enterMode('copy');
  toast('Нажмите на предмет — рядом появится его копия');
});
btnDelete.addEventListener('click', () => {
  if(mode === 'delete'){ exitMode(); return; }
  enterMode('delete');
  toast('Нажмите на предмет, чтобы удалить его');
});

/* ═══ выбор, растягивание, перенос, перемещение ═══ */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let scaling = null, movingAxis = null, moving = null, downInfo = null;
let hoverArrow = null, hoverModel = null;
const activePointers = new Set();

function castAt(e){
  const r = canvas.getBoundingClientRect();
  ndc.x =  ((e.clientX - r.left) / r.width)  * 2 - 1;
  ndc.y = -((e.clientY - r.top)  / r.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  return raycaster;
}
function select(mesh){
  if(selected && selected !== mesh) selected.material.emissiveIntensity = 0;
  selected = mesh;
  gizmo.visible = true;
  layoutGizmo();
  if(!gizmoTipShown){
    gizmoTipShown = true;
    toast('Стрелки с конусом — размер, с шариком — перенос по оси');
  }
}
function deselect(){
  if(selected) selected.material.emissiveIntensity = 0;
  selected = null;
  gizmo.visible = false;
}
function cancelDrags(){
  scaling = null; movingAxis = null; moving = null;
  controls.enabled = true;
  canvas.style.cursor = 'grab';
}
function destroyMesh(m){
  if(selected === m) deselect();
  scene.remove(m);
  m.geometry.dispose(); m.material.dispose();
  models = models.filter(x => x !== m);
  updateCounter();
}

function axisPlane(dir, point){
  const camDir = new THREE.Vector3();
  camera.getWorldDirection(camDir);
  const side = new THREE.Vector3().crossVectors(dir, camDir);
  if(side.lengthSq() < 1e-6) side.set(0,0,1);
  const normal = new THREE.Vector3().crossVectors(side, dir).normalize();
  return new THREE.Plane().setFromNormalAndCoplanarPoint(normal, point);
}

function startScale(a){
  controls.enabled = false;
  hoverModel = null;
  const plane = axisPlane(a.dir, selected.position);
  const start = new THREE.Vector3();
  if(!raycaster.ray.intersectPlane(plane, start)) start.copy(selected.position);
  scaling = {
    arrow:a, plane, start,
    startScale:selected.scale.clone(),
    ref:selected.userData.baseHalf[a.axis] * selected.scale[a.axis]
  };
  canvas.style.cursor = (a.axis === 'x') ? 'ew-resize' : (a.axis === 'y') ? 'ns-resize' : 'move';
}

function startMoveAxis(a){
  controls.enabled = false;
  hoverModel = null;
  const plane = axisPlane(a.dir, selected.position);
  const start = new THREE.Vector3();
  if(!raycaster.ray.intersectPlane(plane, start)) start.copy(selected.position);
  movingAxis = { arrow:a, plane, start, startPos:selected.position.clone() };
  canvas.style.cursor = 'move';
}

function startMove(){
  controls.enabled = false;
  hoverModel = null;
  const normal = new THREE.Vector3();
  camera.getWorldDirection(normal);
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(normal, selected.position);
  const start = new THREE.Vector3();
  if(!raycaster.ray.intersectPlane(plane, start)) start.copy(selected.position);
  moving = { plane, start, startPos:selected.position.clone() };
  canvas.style.cursor = 'move';
}

window.addEventListener('pointerdown', e => {
  if(e.target !== canvas) return;
  activePointers.add(e.pointerId);
  controls.autoRotate = false;

  if(activePointers.size > 1){ cancelDrags(); downInfo = null; return; }

  castAt(e);

  if(gizmo.visible){
    const hit = raycaster.intersectObjects(gizmo.children, true)[0];
    if(hit){
      const g = hit.object.parent;
      const a = arrows.find(x => x.group === g);
      if(a && selected){
        if(a.kind === 'scale') startScale(a);
        else startMoveAxis(a);
      }
      e.preventDefault();
      return;
    }
  }

  const hitModel = raycaster.intersectObjects(models, false)[0];
  if(hitModel){
    if(mode === 'paint'){
      const m = hitModel.object;
      m.material.color.copy(paintColor);
      m.userData.flash = performance.now();
      e.preventDefault();
      return;
    }
    if(mode === 'copy'){
      duplicateMesh(hitModel.object);
      exitMode();
      toast('Копия создана');
      e.preventDefault();
      return;
    }
    if(mode === 'delete'){
      destroyMesh(hitModel.object);
      exitMode();
      toast('Фигура удалена');
      e.preventDefault();
      return;
    }
    select(hitModel.object);
    startMove();
    e.preventDefault();
    return;
  }

  downInfo = { x:e.clientX, y:e.clientY, t:performance.now(), id:e.pointerId };
}, true);

window.addEventListener('pointermove', e => {
  if(scaling && selected){
    castAt(e);
    const p = new THREE.Vector3();
    if(raycaster.ray.intersectPlane(scaling.plane, p)){
      const d = scaling.arrow.dir;
      const delta = p.dot(d) - scaling.start.dot(d);
      let f = 1 + delta / scaling.ref;
      f = Math.max(.06, Math.min(14, f));
      selected.scale[scaling.arrow.axis] = scaling.startScale[scaling.arrow.axis] * f;
      layoutGizmo();
    }
    return;
  }
  if(movingAxis && selected){
    castAt(e);
    const p = new THREE.Vector3();
    if(raycaster.ray.intersectPlane(movingAxis.plane, p)){
      const d = movingAxis.arrow.dir;
      const delta = p.dot(d) - movingAxis.start.dot(d);
      selected.position.copy(movingAxis.startPos).addScaledVector(d, delta);
      layoutGizmo();
    }
    return;
  }
  if(moving && selected){
    castAt(e);
    const p = new THREE.Vector3();
    if(raycaster.ray.intersectPlane(moving.plane, p)){
      selected.position.copy(moving.startPos).add(p.sub(moving.start));
      layoutGizmo();
    }
    return;
  }
  if(e.target !== canvas) return;
  castAt(e);
  const ah = gizmo.visible ? raycaster.intersectObjects(gizmo.children, true)[0] : null;
  hoverArrow = ah ? arrows.find(a => a.group === ah.object.parent) : null;
  arrows.forEach(a => a.group.scale.setScalar(a === hoverArrow ? 1.18 : 1));
  hoverModel = raycaster.intersectObjects(models, false)[0]?.object || null;
  if(hoverArrow){
    canvas.style.cursor = hoverArrow.kind === 'move' ? 'move'
      : hoverArrow.axis === 'x' ? 'ew-resize'
      : hoverArrow.axis === 'y' ? 'ns-resize' : 'move';
  } else if(hoverModel && mode){
    canvas.style.cursor = mode === 'paint' ? 'crosshair' : mode === 'copy' ? 'copy' : 'pointer';
  } else if(hoverModel){
    canvas.style.cursor = 'move';
  } else {
    canvas.style.cursor = 'grab';
  }
});

window.addEventListener('pointerup', e => {
  activePointers.delete(e.pointerId);
  if(scaling){ scaling = null; controls.enabled = true; canvas.style.cursor = 'grab'; downInfo = null; return; }
  if(movingAxis){
    movingAxis = null; controls.enabled = true; canvas.style.cursor = 'grab';
    if(selected) targetGoal.copy(selected.position);
    downInfo = null;
    return;
  }
  if(moving){
    moving = null; controls.enabled = true; canvas.style.cursor = 'grab';
    if(selected) targetGoal.copy(selected.position);
    downInfo = null;
    return;
  }
  if(downInfo && e.pointerId === downInfo.id && e.target === canvas){
    const moved = Math.hypot(e.clientX - downInfo.x, e.clientY - downInfo.y);
    if(moved < 8 && performance.now() - downInfo.t < 600) deselect();
  }
  downInfo = null;
});
window.addEventListener('pointercancel', e => {
  activePointers.delete(e.pointerId);
  cancelDrags();
  downInfo = null;
});
canvas.addEventListener('wheel', () => controls.autoRotate = false, { passive:true });
canvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(palette.classList.contains('open')) palette.classList.remove('open');
    else if(modal.classList.contains('open')) closeModal();
    else if(mode) exitMode();
    else deselect();
  }
  if((e.key === 'Delete' || e.key === 'Backspace') && selected){
    destroyMesh(selected);
    toast('Фигура удалена');
  }
});

/* ═══ остальные кнопки ═══ */
const modal = document.getElementById('modal');
const btnCreate = document.getElementById('btnCreate');
const btnSave   = document.getElementById('btnSave');
const btnFull   = document.getElementById('btnFull');

btnCreate.addEventListener('click', () => modal.classList.add('open'));
function closeModal(){ modal.classList.remove('open'); }
modal.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeModal));
modal.querySelectorAll('.shape-card').forEach(el =>
  el.addEventListener('click', () => { spawn(el.dataset.shape); closeModal(); })
);

/* ═══ сохранение в человекочитаемый JSON ═══ */
function round3(n){ return Math.round(n * 1000) / 1000; }
function saveBlob(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
btnSave.addEventListener('click', () => {
  if(!models.length){ toast('Сначала создайте модель'); return; }
  const data = {
    format: "gran-3d-scene/v1",
    description: "Сцена 3D-мастерской ГРАНЬ. "
      + "Отправь этот файл ИИ (или вставь его содержимое в чат) — "
      + "он прочитает JSON и восстановит сцену командой loadScene().",
    savedAt: new Date().toISOString(),
    objects: models.map(m => ({
      shape: m.userData.shape,
      position: [round3(m.position.x), round3(m.position.y), round3(m.position.z)],
      scale:    [round3(m.scale.x),    round3(m.scale.y),    round3(m.scale.z)],
      color:    '#' + m.material.color.getHexString()
    }))
  };
  saveBlob(
    new Blob([JSON.stringify(data, null, 2)], { type:'application/json' }),
    'gran-scene.json'
  );
  toast('Сохранил gran-scene.json — это текст, который я прочитаю');
});

/* функция загрузки сцены из JSON (можно вызвать из консоли или передать файл) */
window.loadScene = function(data){
  if(typeof data === 'string') data = JSON.parse(data);
  if(!data || !Array.isArray(data.objects)){
    toast('Неверный формат файла'); return;
  }
  // очищаем сцену
  [...models].forEach(m => destroyMesh(m));
  spawnCount = 0;
  deselect();
  // воссоздаём объекты
  data.objects.forEach(o => {
    spawn(o.shape, o.position, o.scale, o.color);
  });
  deselect();
  toast(`Сцена загружена: ${data.objects.length} фигур`);
};

btnFull.addEventListener('click', async () => {
  try{
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(err){ toast('Полный экран недоступен в этом браузере'); }
});
document.addEventListener('fullscreenchange', () =>
  document.body.classList.toggle('fs', !!document.fullscreenElement));

/* ═══ служебное ═══ */
const toastEl = document.getElementById('toast');
let toastTimer;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
}
function updateCounter(){ document.getElementById('count').textContent = models.length; }

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ═══ цикл рендера ═══ */
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  const now = performance.now();
  controls.target.lerp(targetGoal, .06);
  controls.update();

  models.forEach(m => {
    const mat = m.material;
    mat.emissive.copy(mat.color);
    let ei = 0;
    if(m === selected) ei = .18 + .08 * Math.sin(t * 3.2);
    if(mode === 'paint' && m === hoverModel){ mat.emissive.copy(paintColor); ei = .5; }
    else if(mode === 'copy' && m === hoverModel){ mat.emissive.setRGB(.45,.95,1); ei = .45; }
    else if(mode === 'delete' && m === hoverModel){ mat.emissive.setRGB(1, .25, .22); ei = .55; }
    if(m.userData.flash){
      const k = 1 - (now - m.userData.flash) / 350;
      if(k > 0) ei = Math.max(ei, k * 1.15); else delete m.userData.flash;
    }
    mat.emissiveIntensity = ei;
  });

  if(gizmo.visible){
    const busy = scaling || movingAxis || moving;
    arrows.forEach((a, i) => {
      const bob = busy ? 0 : Math.sin(t * 2.4 + i * 1.05) * .05;
      a.group.position.copy(a.dir).multiplyScalar(a.dist + bob);
    });
  }
  renderer.render(scene, camera);
});
</script>
