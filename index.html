<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Мессенджер</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f0f;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#loginScreen{position:fixed;inset:0;background:#0f0f0f;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:100}
#loginScreen h1{font-size:28px;margin-bottom:30px;color:#00d4ff}
#loginScreen input{width:100%;max-width:300px;padding:15px;font-size:16px;border:2px solid #333;border-radius:10px;background:#1a1a1a;color:#fff;margin-bottom:20px;outline:none}
#loginScreen input:focus{border-color:#00d4ff}
#loginScreen button{padding:15px 40px;font-size:16px;font-weight:bold;background:#00d4ff;color:#000;border:none;border-radius:10px;cursor:pointer}
#loginScreen button:active{transform:scale(0.95)}
#chatScreen{display:none;flex-direction:column;height:100vh}
#header{background:#1a1a1a;padding:15px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
#header h2{font-size:18px;color:#00d4ff}
#users{font-size:12px;color:#888}
#messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.message{max-width:80%;padding:10px 15px;border-radius:15px;word-wrap:break-word}
.message.mine{align-self:flex-end;background:#00d4ff;color:#000;border-bottom-right-radius:5px}
.message.other{align-self:flex-start;background:#2a2a2a;border-bottom-left-radius:5px}
.message .username{font-size:12px;font-weight:bold;margin-bottom:3px;opacity:0.7}
.message .time{font-size:10px;opacity:0.5;margin-top:5px;text-align:right}
#inputArea{background:#1a1a1a;padding:15px;border-top:1px solid #333;display:flex;gap:10px}
#inputArea input{flex:1;padding:12px;font-size:16px;border:2px solid #333;border-radius:25px;background:#0f0f0f;color:#fff;outline:none}
#inputArea input:focus{border-color:#00d4ff}
#inputArea button{padding:12px 20px;font-size:16px;background:#00d4ff;color:#000;border:none;border-radius:25px;cursor:pointer;font-weight:bold}
#inputArea button:active{transform:scale(0.95)}
.system{align-self:center;background:#2a2a2a;padding:8px 15px;border-radius:15px;font-size:12px;color:#888;margin:5px 0}
</style>
</head>
<body>

<div id="loginScreen">
<h1>💬 Мессенджер</h1>
<input type="text" id="usernameInput" placeholder="Твоё имя" maxlength="20">
<button onclick="login()">Войти</button>
</div>

<div id="chatScreen">
<div id="header">
<h2>💬 Чат</h2>
<div id="users">0 онлайн</div>
</div>
<div id="messages"></div>
<div id="inputArea">
<input type="text" id="messageInput" placeholder="Сообщение..." maxlength="500">
<button onclick="sendMessage()">➤</button>
</div>
</div>

<script>
let ws=null;
let myUsername=null;

const loginScreen=document.getElementById('loginScreen');
const chatScreen=document.getElementById('chatScreen');
const usernameInput=document.getElementById('usernameInput');
const messageInput=document.getElementById('messageInput');
const messagesDiv=document.getElementById('messages');
const usersDiv=document.getElementById('users');

function login(){
const username=usernameInput.value.trim();
if(!username){
alert('Введи имя!');
return;
}
myUsername=username;
loginScreen.style.display='none';
chatScreen.style.display='flex';
connect();
}

function connect(){
const url=(location.protocol==='https:'?'wss:':'ws:')+'//'+location.host;
ws=new WebSocket(url);

ws.onopen=()=>{
ws.send(JSON.stringify({type:'login',username:myUsername}));
};

ws.onmessage=(e)=>{
try{
const msg=JSON.parse(e.data);

if(msg.type==='history'){
msg.messages.forEach(m=>addMessage(m));
}else if(msg.type==='message'){
addMessage(msg.message);
}else if(msg.type==='user_joined'){
usersDiv.textContent=msg.users.length+' онлайн';
if(msg.username!==myUsername){
addSystemMessage(msg.username+' зашёл в чат');
}
}else if(msg.type==='user_left'){
usersDiv.textContent=msg.users.length+' онлайн';
addSystemMessage(msg.username+' вышел из чата');
}
}catch(err){
console.error('Parse error:',err);
}
};

ws.onclose=()=>{
setTimeout(connect,3000);
};

ws.onerror=()=>{
console.error('WS error');
};
}

function addMessage(msg){
const div=document.createElement('div');
div.className='message '+(msg.username===myUsername?'mine':'other');
div.innerHTML=`
${msg.username!==myUsername?'<div class="username">'+msg.username+'</div>':''}
<div>${escapeHtml(msg.text)}</div>
<div class="time">${msg.time}</div>
`;
messagesDiv.appendChild(div);
messagesDiv.scrollTop=messagesDiv.scrollHeight;
}

function addSystemMessage(text){
const div=document.createElement('div');
div.className='system';
div.textContent=text;
messagesDiv.appendChild(div);
messagesDiv.scrollTop=messagesDiv.scrollHeight;
}

function sendMessage(){
const text=messageInput.value.trim();
if(!text||!ws)return;
ws.send(JSON.stringify({type:'message',text:text}));
messageInput.value='';
}

function escapeHtml(text){
const div=document.createElement('div');
div.textContent=text;
return div.innerHTML;
}

messageInput.addEventListener('keypress',(e)=>{
if(e.key==='Enter')sendMessage();
});

usernameInput.addEventListener('keypress',(e)=>{
if(e.key==='Enter')login();
});
</script>
</body>
  </html>
