<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>🌍 3D WORLD Online</title><style>*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}html,body{width:100%;height:100%;overflow:hidden;background:#73c9ff;font-family:Arial,sans-serif}#game{position:fixed;inset:0;overflow:hidden}canvas{display:block;width:100%;height:100%}#serverScreen{position:absolute;inset:0;z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:white}#serverScreen h1{font-size:32px;margin-bottom:5px;letter-spacing:3px}#serverScreen p{color:#aaa;margin-bottom:30px;font-size:14px}.server-card{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);border-radius:16px;padding:25px 40px;margin:10px;cursor:pointer;transition:all .2s;width:300px;text-align:center;backdrop-filter:blur(10px)}.server-card:hover{background:rgba(255,255,255,.15);border-color:#2ecc71;transform:scale(1.03)}.server-card h2{font-size:22px;margin-bottom:8px}.server-card .count{font-size:16px;color:#2ecc71;font-weight:700}.server-card .full{color:#e74c3c}.server-card.disabled{opacity:.4;pointer-events:none}#connectStatus{margin-top:20px;font-size:14px;color:#ffcc00;min-height:20px}#startScreen{position:absolute;inset:0;z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center;color:white;background:linear-gradient(#73c9ff,#3d9ed4,#2273a6)}#startScreen h1{margin-bottom:8px;font-size:28px;letter-spacing:3px;font-weight:900}#startScreen p{margin-bottom:20px;color:#e8f7ff;font-size:13px;text-align:center;padding:0 20px;line-height:1.5}#skins{display:flex;gap:9px;margin-bottom:18px}.skin{width:56px;height:56px;border-radius:14px;border:3px solid #ffffff66;cursor:pointer}.skin.sel{border-color:#00ff88;transform:scale(1.15)}#startButton{border:none;border-radius:15px;padding:16px 34px;background:white;color:#111;font-size:17px;font-weight:900;box-shadow:0 8px 30px rgba(0,0,0,.3);cursor:pointer}#startButton.disabled{background:#aaa;color:#555;pointer-events:none;opacity:.7}#rotateHint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#ffcc00;padding:12px 20px;border-radius:30px;font-size:14px;font-weight:bold;animation:pulse 2s infinite;text-align:center;width:80%}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}#controls{position:fixed;inset:0;pointer-events:none;z-index:50}#controls>*{pointer-events:auto}#joystickArea{position:absolute;left:0;bottom:0;width:50%;height:70%;touch-action:none}#joystick{position:absolute;left:80px;bottom:100px;width:130px;height:130px;border-radius:50%;background:rgba(0,0,0,.15);border:2px solid rgba(255,255,255,.1);display:none;pointer-events:none;transform:translate(-50%,-50%)}#joystick.active{display:block}#stick{position:absolute;left:50%;top:50%;width:54px;height:54px;margin-left:-27px;margin-top:-27px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.15);pointer-events:none}#droneUpBtn,#droneDownBtn,#droneExitBtn{position:absolute;right:30px;width:70px;height:70px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.35);color:white;font-size:28px;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:60}#droneExitBtn{bottom:220px;background:rgba(231,76,60,.5);border-color:rgba(231,76,60,.8);font-size:22px}#droneUpBtn{bottom:130px;background:rgba(46,204,113,.5);border-color:rgba(46,204,113,.8)}#droneDownBtn{bottom:40px;background:rgba(52,152,219,.5);border-color:rgba(52,152,219,.8)}#droneJoystickArea{position:absolute;left:0;bottom:0;width:50%;height:70%;touch-action:none;display:none;z-index:55}#droneJoystick{position:absolute;left:80px;bottom:100px;width:130px;height:130px;border-radius:50%;background:rgba(0,0,0,.15);border:2px solid rgba(255,255,255,.1);display:none;pointer-events:none;transform:translate(-50%,-50%)}#droneJoystick.active{display:block}#droneStick{position:absolute;left:50%;top:50%;width:54px;height:54px;margin-left:-27px;margin-top:-27px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.15);pointer-events:none}#droneHint{position:absolute;top:20px;left:50%;transform:translateX(-50%);color:white;background:rgba(0,0,0,.7);padding:8px 16px;border-radius:20px;font-size:13px;pointer-events:none;z-index:55;display:none}.notification{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.9);color:white;padding:20px 40px;border-radius:15px;font-size:18px;font-weight:900;z-index:1000;pointer-events:none;animation:fadeOut 2.5s forwards;text-align:center}@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}#statusBar{position:fixed;top:10px;left:10px;background:rgba(0,0,0,.7);color:white;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700;z-index:100;pointer-events:none}#miniMap{position:fixed;right:10px;top:10px;width:140px;height:140px;background:rgba(0,0,0,.6);border-radius:50%;border:2px solid rgba(255,255,255,.3);z-index:100;pointer-events:none;overflow:hidden}#miniMapCanvas{width:100%;height:100%}#compass{position:fixed;right:160px;top:10px;background:rgba(0,0,0,.7);color:white;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700;z-index:100;pointer-events:none}#quickDroneBtn{position:fixed;left:15px;top:50%;transform:translateY(-50%);width:75px;height:75px;border-radius:50%;background:linear-gradient(135deg,#2ecc71,#27ae60);color:white;border:3px solid rgba(255,255,255,.5);font-size:34px;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.5)}#quickDroneBtn:active{transform:translateY(-50%) scale(.9)}#quickDroneBtn.cooldown{background:linear-gradient(135deg,#7f8c8d,#555);opacity: ;z-index:500;display:none;align-items:center;justify-content:center;padding-right:110px}#droneShopModal.show{display:flex}#droneShopContent{background:#1a1a2e;border-radius:20px;padding:20px;width:90%;max-width:400px;text-align:center;position:relative}#droneShopContent h2{color:white;margin-bottom:10px;font-size:22px}#closeShopX{position:fixed;right:15px;top:50%;transform:translateY(-50%);width:90px;height:90px;border-radius:50%;border:3px solid #fff;background:#e74c3c;color:white;font-size:42px;font-weight:900;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:600;box-shadow:0 4px 15px #0009}#closeShopX:active{transform:translateY(-50%) scale(.9)}#droneShopModal.show #closeShopX{display:flex}#pageArea{min-height:220px;display:flex;align-items:center;justify-content:center}#droneGrid{display:grid;grid-template-columns:1fr;gap:10px;width:100%}.droneCard{background:#16213e;border-radius:15px;padding:15px;cursor:pointer;border:3px solid transparent;transition:all .2s;width:100%}.droneCard.selected{border-color:#00ff88;background:#1a3a5c}.droneCard.locked{opacity:.6}.droneImg{width:100%;height:70px;background:#0f3460;border-radius:10px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;font-size:36px}.droneName{color:white;font-weight:700;font-size:15px;margin-bottom:4px}.dronePrice{color:#ffd700;font-weight:900;font-size:16px}.droneBuyBtn{background:#ff9800;color:white;border:none;border-radius:10px;padding:10px 20px;font-weight:700;cursor:pointer;margin-top:8px;font-size:15px}.droneBuyBtn:active{transform:scale(.95)}#navRow{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:12px}#prevPage,#nextPage{width:60px;height:60px;border-radius:50%;border:3px solid #fff;background:#2a52be;color:white;font-size:28px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center}#prevPage:active,#nextPage:active{transform:scale(.9);background:#1a3a8e}#pageInfo{color:white;font-size:20px;font-weight:900;min-width:70px}#closeShop{background:#e74c3c;color:white;border:none;border-radius:12px;padding:12px 30px;font-size:16px;font-weight:900;cursor:pointer;margin-top:12px}</style></head><body><div id="game"><div id="serverScreen"><h1>🌍 3D WORLD</h1><p>Выбери сервер для онлайн-игры</p><div class="server-card" id="srv1" onclick="connectToServer(1)"><h2>🖥️ Сервер #1</h2><div class="count" id="srv1count">Загрузка...</div></div><div class="server-card" id="srv2" onclick="connectToServer(2)"><h2>🖥️ Сервер #2</h2><div class="count" id="srv2count">Загрузка...</div></div><div id="connectStatus"></div></div><div id="startScreen"><h1>🌍 3D WORLD</h1><p>Онлайн-мир • Дрон • Монеты 🪙</p><div id="skins"></div><button id="startButton" class="disabled">▶ НАЧАТЬ</button><div id="rotateHint">📱 Переверните экран горизонтально</div></div><div id="statusBar">🚶 Пешком</div><div id="onlinePlayers">👥 Онлайн: -</div><div id="compass">N</div><div id="miniMap"><canvas id="miniMapCanvas"></canvas></div><div id="coinDisplay"><span id="coinIcon">🪙</span><span id="coinText">0</span></div><button id="quickDroneBtn">🚁</button><button id="disconnectBtn" onclick="disconnect()">❌ Выход</button><button id="openShopBtn">🛒 Открыть магазин</button><div id="chatBox"><div id="chatMessages"></div><input id="chatInput" placeholder="Напиши сообщение..." maxlength="100"></div><div id="controls"><div id="joystickArea"></div><div id="joystick"><div id="stick"></div></div><div id="droneJoystickArea"></div><div id="droneJoystick"><div id="droneStick"></div></div><button id="droneExitBtn">🚪</button><button id="droneUpBtn">⬆</button><button id="droneDownBtn">⬇</button></div><div id="droneHint">Свайп справа — камера</div><div id="droneShopModal"><div id="droneShopContent"><button id="closeShopX">✕</button><h2>🚁 Магазин дронов</h2><div id="pageArea"><div id="droneGrid"></div></div><div id="navRow"><button id="prevPage">◀</button><div id="pageInfo">1/1</div><button id="nextPage">▶</button></div><button id="closeShop">✖ Закрыть</button></div></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script><script type="module">import*as THREE from'three';let ws=null,myId=null,myServerId=null;const remotePlayers=new Map();const SERVER_URL='ws://localhost:3000';const SK=[{h:0x111111,s:0xf0c8a0,sh:0x111111,p:0x151515,shoe:0x111111,a:0xdd2222,e:"belt"},{h:0x000000,s:0xe8b890,sh:0x111111,p:0x222222,shoe:0xffffff,a:0xffffff,e:"q",band:1},{h:0x4a3520,s:0xf0d0b0,sh:0xcfc3a0,p:0x4a4a33,shoe:0xffffff,a:0x3a3a25,e:"67"},{h:0x5a3a1a,s:0xf0c8a0,sh:0xffffff,p:0x111111,shoe:0xaa2222,a:0xff6600,e:"x"},{h:0x4a2f1a,s:0xf0d0b0,sh:0xffffff,p:0x2a1f15,shoe:0x8a6a4a,a:0x4a3020,e:"vest"}];let mySkin=0;const hex=c=>"#"+c.toString(16).padStart(6,"0");SK.forEach((s,i)=>{const b=document.createElement("div");b.className="skin"+(i==mySkin?" sel":"");b.style.background=`linear-gradient(${hex(s.h)} 0 40%,${hex(s.sh)} 40% 75%,${hex(s.p)} 75%)`;b.onclick=()=>{mySkin=i;document.querySelectorAll(".skin").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");rebuildPlayer()};document.getElementById("skins").appendChild(b)});function rebuildPlayer(){const old=player;const newP=createPlayer(mySkin);scene.add(newP);player=newP;arms.length=0;legs.length=0;player.children.forEach(c=>{if(c.userData&&c.userData.isArm)arms.push(c);if(c.userData&&c.userData.isLeg)legs.push(c)});if(old)scene.remove(old)}function createPlayer(id){const sk=SK[id],g=new THREE.Group();const skin=new THREE.MeshStandardMaterial({color:sk.s,roughness:0.55});const hair=new THREE.MeshStandardMaterial({color:sk.h,roughness:0.9});const shirt=new THREE.MeshStandardMaterial({color:sk.sh,roughness:0.6});const pants=new THREE.MeshStandardMaterial({color:sk.p,roughness:0.8});const shoe=new THREE.MeshStandardMaterial({color:sk.shoe,roughness:0.55});const acc=new THREE.MeshStandardMaterial({color:sk.a,roughness:0.45});const torso=new THREE.Mesh(new THREE.BoxGeometry(2.2,2.2,1.25),shirt);torso.position.y=3.2;torso.castShadow=true;g.add(torso);const belt=new THREE.Mesh(new THREE.BoxGeometry(2.35,0.38,1.35),acc);belt.position.y=2.15;g.add(belt);if(sk.e=="q"){const q=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.75,0.08),acc);q.position.set(0,3.45,0.68);g.add(q)}if(sk.e=="67"){const n=new THREE.Mesh(new THREE.BoxGeometry(0.95,0.85,0.08),acc);n.position.set(0,3.35,0.68);g.add(n)}if(sk.e=="x"){for(let r of[-1,1]){const x=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.9,0.08),acc);x.position.set(0,3.35,0.68);x.rotation.z=r*0.7;g.add(x)}}if(sk.e=="vest"){const v=new THREE.Mesh(new THREE.BoxGeometry(1.45,1.9,0.1),acc);v.position.set(0,3.25,0.69);g.add(v)}const head=new THREE.Mesh(new THREE.BoxGeometry(1.8,1.7,1.55),skin);head.position.y=5.2;head.castShadow=true;g.add(head);const ht=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.45,1.65),hair);ht.position.y=0.9;head.add(ht);const hf=new THREE.Mesh(new THREE.BoxGeometry(1.85,0.35,0.25),hair);hf.position.set(0,0.72,0.75);head.add(hf);const hb=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.8,0.28),hair);hb.position.set(0,0.3,-0.74);head.add(hb);if(sk.band){const bd=new THREE.Mesh(new THREE.BoxGeometry(1.95,0.3,1.7),acc);bd.position.y=0.48;head.add(bd)}for(let sx of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(0.22,12,12),new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.4}));e.position.set(sx*0.5,0.08,0.8);head.add(e);const p=new THREE.Mesh(new THREE.SphereGeometry(0.1,8,8),new THREE.MeshStandardMaterial({color:id>1?0x28aa35:0x222222,roughness:0.3}));p.position.set(0,0,0.18);e.add(p)}const mouth=new THREE.Mesh(new THREE.BoxGeometry(0.65,0.25,0.08),new THREE.MeshStandardMaterial({color:0x7c1d1d,roughness:0.5}));mouth.position.set(0,-0.55,0.79);head.add(mouth);const arms=[];for(let sx of[-1,1]){const a=new THREE.Group();a.position.set(sx*1.58,4,0);a.userData={isArm:true};const sl=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.9,0.78),shirt);sl.position.y=-0.45;sl.castShadow=true;a.add(sl);const tyle.display='block';joystickArea.style.display='none';joystick.style.display='none';player.visible=false;droneGroup.position.y=1.5;droneTargetHeight=1.5;droneYaw=0;dronePitch=0;droneTargetYaw=0;droneTargetPitch=0;droneSpeed=0;droneHint.style.display='block';setTimeout(()=>droneHint.style.display='none',4000);statusBar.textContent='🚁 Дрон';updateQuickDroneBtn();sendDroneEnter();openShopBtn.style.display='none';showNotification('🚁 Вы сели за дрон!')}function exitDroneMode(fromExplosion=false){isDroneMode=false;droneUpBtn.style.display='none';droneDownBtn.style.display='none';droneExitBtn.style.display='none';droneJoystickArea.style.display='none';droneJoystick.style.display='none';joystickArea.style.display='block';joystick.style.display='none';player.visible=true;if(!fromExplosion){droneGroup.position.copy(DRONE_SPAWN);droneGroup.position.y=0.3;droneTargetHeight=0.3;droneSpeed=0;sendDroneExit();showNotification('🚶 Вернулись')}statusBar.textContent='🚶 Пешком';updateQuickDroneBtn()}droneExitBtn.addEventListener('click',()=>exitDroneMode(false));function updatePlayerCamera(delta){if(isDroneMode)return;const sm=1-Math.pow(0.002,delta);cameraYaw=THREE.MathUtils.lerp(cameraYaw,targetYaw,sm);cameraPitch=THREE.MathUtils.lerp(cameraPitch,targetPitch,sm);const dist=7.5,tgt=new THREE.Vector3(player.position.x,player.position.y+2.5,player.position.z);const off=new THREE.Vector3(Math.sin(cameraYaw)*dist*Math.cos(cameraPitch),3.5+Math.sin(cameraPitch)*dist,Math.cos(cameraYaw)*dist*Math.cos(cameraPitch));camera.position.lerp(tgt.clone().add(off),1-Math.pow(0.0005,delta));if(camera.position.y<0.8)camera.position.y=0.8;camera.lookAt(tgt)}function updateDroneCamera(delta){if(!isDroneMode)return;const sm=1-Math.pow(0.001,delta);droneYaw=THREE.MathUtils.lerp(droneYaw,droneTargetYaw,sm);dronePitch=THREE.MathUtils.lerp(dronePitch,droneTargetPitch,sm);camera.position.copy(droneGroup.position);camera.position.y+=0.3;camera.lookAt(new THREE.Vector3(droneGroup.position.x-Math.sin(droneYaw)*Math.cos(dronePitch),droneGroup.position.y+0.3+Math.sin(dronePitch),droneGroup.position.z-Math.cos(droneYaw)*Math.cos(dronePitch)))}function getFocus(){return isDroneMode?droneGroup.position:player.position}const MAX_RADIUS=42;let joyActive=false,joyId=null,joyCX=0,joyCY=0,droneJoyActive=false,droneJoyId=null,droneJoyCX=0,droneJoyCY=0;joystickArea.addEventListener('pointerdown',e=>{if(isDroneMode)return;e.preventDefault();joyCX=e.clientX;joyCY=e.clientY;joystick.style.left=joyCX+'px';joystick.style.top=joyCY+'px';joystick.classList.add('active');joystick.style.display='block';joyActive=true;joyId=e.pointerId;e.target.setPointerCapture(e.pointerId);updateJoy(e.clientX,e.clientY)});droneJoystickArea.addEventListener('pointerdown',e=>{if(!isDroneMode)return;e.preventDefault();droneJoyCX=e.clientX;droneJoyCY=e.clientY;droneJoystick.style.left=droneJoyCX+'px';droneJoystick.style.top=droneJoyCY+'px';droneJoystick.classList.add('active');droneJoystick.style.display='block';droneJoyActive=true;droneJoyId=e.pointerId;e.target.setPointerCapture(e.pointerId);updateDroneJoy(e.clientX,e.clientY)});document.addEventListener('pointermove',e=>{if(joyActive&&e.pointerId===joyId)updateJoy(e.clientX,e.clientY);if(droneJoyActive&&e.pointerId===droneJoyId)updateDroneJoy(e.clientX,e.clientY)});document.addEventListener('pointerup',e=>{if(e.pointerId===joyId){joyActive=false;joyId=null;joystick.classList.remove('active');joystick.style.display='none';stickEl.style.transform='translate3d(0,0,0)';moveX=0;moveZ=0}if(e.pointerId===droneJoyId){droneJoyActive=false;droneJoyId=null;droneJoystick.classList.remove('active');droneJoystick.style.display='none';droneStickEl.style.transform='translate3d(0,0,0)';droneMoveX=0;droneMoveZ=0}});function updateJoy(cx,cy){let dx=cx-joyCX,dy=cy-joyCY;const d=Math.sqrt(dx*dx+dy*dy);if(d>MAX_RADIUS){dx=dx/d*MAX_RADIUS;dy=dy/d*MAX_RADIUS}stickEl.style.transform=`translate3d(${dx}px,${dy}px,0)`;moveX=dx/MAX_RADIUS;moveZ=dy/MAX_RADIUS}function updateDroneJoy(cx,cy){let dx=cx-droneJoyCX,dy=cy-droneJoyCY;const d=Math.sqrt(dx*dx+dy*dy);if(d>MAX_RADIUS){dx=dx/d*MAX_RADIUS;dy=dy/d*MAX_RADIUS}droneStickEl.style.transform=`translate3d(${dx}px,${dy}px,0)`;droneMoveX=dx/MAX_RADIUS;droneMoveZ=dy/MAX_RADIUS}droneUpBtn.addEventListener('pointerdown',e=>{e.preventDefault();droneUpPressed=true});droneUpBtn.addEventListener('pointerup',()=>droneUpPressed=false);droneUpBtn.addEventListener('pointerleave',()=>droneUpPressed=false);droneDownBtn.addEventListener('pointerdown',e=>{e.preventDefault();droneDownPressed=true});droneDownBtn.addEventListener('pointerup',()=>droneDownPressed=false);droneDownBtn.addEventListener('pointerleave',()=>droneDownPressed=false);function updateDroneVertical(delta){if(!isDroneMode)return;if(droneUpPressed)droneTargetHeight+=5*delta;if(droneDownPressed)droneTargetHeight=Math.max(droneTargetHeight-5*delta,0.4)}let camActive=false,camId=null,lastCamX=0,lastCamY=0,droneCamActive=false,droneCamId=null,dLastCamX=0,dLastCamY=0;document.addEventListener('pointerdown',e=>{if(document.getElementById('droneShopModal').classList.contains('show'))return;if(e.clientX<window.innerWidth*0.5||e.target.closest('button')||e.target.closest('#chatBox'))return;if(isDroneMode){droneCamActive=true;droneCamId=e.pointerId;dLastCamX=e.clientX;dLastCamY=e.clientY;e.target.setPointerCapture(e.pointerId)}else{camActive=true;camId=e.pointerId;lastCamX=e.clientX;lastCamY=e.clientY;e.target.setPointerCapture(e.pointerId)}});document.addEventListener('pointermove',e=>{if(camActive&&e.pointerId===camId){targetYaw-=(e.clientX-lastCamX)*0.005;targetPitch=THREE.MathUtils.clamp(targetPitch+(e.clientY-lastCamY)*0.005,-0.5,1.2);lastCamX=e.clientX;lastCamY=e.clientY}if(droneCamActive&&e.pointerId===droneCamId){droneTargetYaw-=(e.clientX-dLastCamX)*0.005;droneTargetPitch=THREE.MathUtils.clamp(droneTargetPitch+(e.clientY-dLastCamY)*0.005,-Math.PI/2,Math.PI/2);dLastCamX=e.clientX;dLastCamY=e.clientY}});document.addEventListener('pointerup',e=>{if(e.pointerId===camId){camActive=false;camId=null}if(e.pointerId===droneCamId){droneCamActive=false;droneCamId=null}});function drawMiniMap(){const focus=getFocus();miniMapCanvas.width=140;miniMapCanvas.height=140;miniCtx.clearRect(0,0,140,140);miniCtx.save();miniCtx.beginPath();miniCtx.arc(70,70,65,0,Math.PI*2);miniCtx.clip();miniCtx.fillStyle='#4CAF50';miniCtx.fillRect(0,0,140,140);const sc=0.15;miniCtx.fillStyle='#444';miniCtx.fillRect(0,69,140,2);miniCtx.fillRect(69,0,2,140);miniCtx.fillStyle='#ff0000';miniCtx.beginPath();miniCtx.arc(70,70,4,0,Math.PI*2);miniCtx.fill();remotePlayers.forEach(rp=>{const mx=(rp.group.position.x-focus.x)*sc+70;const mz=(rp.group.position.z-focus.z)*sc+70;miniCtx.fillStyle=rp.isDrone?'#00ff00':'#ffff00';miniCtx.beginPath();miniCtx.arc(mx,mz,3,0,Math.PI*2);miniCtx.fill()});miniCtx.restore()}function updateCompass(){const yaw=isDroneMode?droneYaw:cameraYaw;const deg=((yaw*180/Math.PI)%360+360)%360;const dirs=['N','NE','E','SE','S','SW','W','NW'];compassEl.textContent=`${dirs[Math.round(deg/45)%8]} ${Math.round(deg)}°`}const startButton=document.getElementById('startButton'),rotateHint=document.getElementById('rotateHint');function checkOrientation(){if(window.innerWidth>window.innerHeight){startButton.classList.remove('disabled');rotateHint.style.display='none'}else{startButton.classList.add('disabled');rotateHint.style.display='block'}}window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);checkOrientation()});checkOrientation();startButton.addEventListener('click',async()=>{if(startButton.classList.contains('disabled'))return;try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();if(screen.orientation?.lock)await screen.orientation.lock('landscape')}catch(e){}gameStarted=true;document.getElementById('startScreen').style.display='none'});let lastTime=performance.now(),sendTimer=0;function animate(){requestAnimationFrame(animate);const now=performance.now(),delta=Math.min((now-lastTime)/1000,0.05);lastTime=now;if(gameStarted){const focus=getFocus();sun.position.set(focus.x+100,120,focus.z+50);sun.target.position.copy(focus);sun.target.updateMatrixWorld();updateDroneRespawn(delta);updateExplosion(delta);updateQuickDroneBtn();updateRemotePlayers(delta);sendTimer+=delta;if(sendTimer>=0.05){sendMove();sendTimer=0}if(isDroneMode&&!droneExploded){updateDronePhysics(delta);updateDroneVertical(delta);dronePropellerAngle+=0.6;droneArms.forEach((p,i)=>p.rotation.y=dronePropellerAngle*(i%2===0?1:-1));droneGroup.rotation.z=Math.sin(now*0.003)*0.05;droneGroup.rotation.x=Math.cos(now*0.0025)*0.05;updateDroneCamera(delta)}else{updatePlayerPhysics(delta);updatePlayerCamera(delta)}if(carouselRef)carouselRef.rotation.y+=delta*0.8;heliRotors.forEach((r,i)=>r.rotation.y+=delta*(15-i*3));drawMiniMap();updateCompass()}renderer.render(scene,camera)}animate();</script></body></html>
